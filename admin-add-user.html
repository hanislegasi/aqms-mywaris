<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Admin - AQMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Header Section -->
    <div class="bg-[#153638] text-white px-6 py-4 shadow">
        <div class="flex justify-between items-center px-5">
            <div>
                <h1 class="text-2xl font-bold">Pengurusan Admin</h1>
                <p class="text-green-200 text-sm mt-1">Daftar pentadbir (admin) baharu ke dalam sistem</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto p-6 mt-6">
        
        <!-- Butang Kembali -->
        <a href="admin-dashboard.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-[#153638] mb-6 font-medium transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Kembali ke Dashboard
        </a>

        <!-- Kad Borang -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Maklumat Pentadbir Baharu</h2>
            
            <form id="addAdminForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Nama Penuh -->
                    <div class="col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Penuh</label>
                        <input type="text" id="inputNama" required placeholder="Contoh: Hasnawi" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#153638] focus:border-[#153638] outline-none transition">
                    </div>

                    <!-- No IC -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">No Kad Pengenalan (IC)</label>
                        <input type="text" id="inputIC" required placeholder="Contoh: 770620036241" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#153638] focus:border-[#153638] outline-none transition">
                    </div>

                    <!-- No Telefon -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">No Telefon</label>
                        <input type="text" id="inputTelefon" required placeholder="Contoh: 0129443846" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#153638] focus:border-[#153638] outline-none transition">
                    </div>

                    <!-- Emel Log Masuk -->
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Emel</label>
                        <input type="email" id="inputEmail" required placeholder="admin@aqms.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#153638] focus:border-[#153638] outline-none transition">
                    </div>

                    <!-- Kata Laluan -->
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Kata Laluan (Min: 6 aksara)</label>
                        <input type="password" id="inputPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#153638] focus:border-[#153638] outline-none transition">
                    </div>
                </div>

                <!-- Mesej Status -->
                <div id="statusMessage" class="hidden p-3 rounded-lg text-sm font-medium"></div>

                <!-- Butang Daftar -->
                <div class="mt-8 flex justify-end">
                    <button type="submit" id="btnSubmit" class="bg-[#153638] hover:bg-[#1a4346] text-white px-6 py-3 rounded-xl font-semibold shadow-md transition duration-150 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                        Daftar Admin
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { db, auth } from './firebase.js';
        
        // Guna setDoc sebab kita nak tetapkan ID dokumen sama dengan UID Authentication
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        // Fungsi daftar pengguna baru
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const form = document.getElementById('addAdminForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Elakkan page refresh
            
            // 1. Ambil data dari borang
            const nama = document.getElementById('inputNama').value;
            const ic = document.getElementById('inputIC').value;
            const telefon = document.getElementById('inputTelefon').value;
            const email = document.getElementById('inputEmail').value;
            const password = document.getElementById('inputPassword').value;

            // Tukar butang jadi 'Loading'
            btnSubmit.innerHTML = 'Sedang Mendaftar...';
            btnSubmit.disabled = true;
            statusMessage.classList.add('hidden');

            try {
                // 2. Daftar emel dan password ke Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Simpan maklumat profil ke Firestore (Koleksi 'users')
                await setDoc(doc(db, "admins", user.uid), {
                    nama: nama,
                    ic: ic,
                    telefon: telefon,
                    email: email,
                    role: "admin",              // Tetapkan peranan sebagai admin
                    createdAt: new Date()       // Simpan tarikh daftar
                });

                // 4. Berjaya!
                statusMessage.textContent = "✅ Admin baharu berjaya didaftarkan!";
                statusMessage.className = "p-3 rounded-lg text-sm font-medium bg-green-100 text-green-700 block mt-4";
                form.reset(); // Kosongkan borang

            } catch (error) {
                console.error("Ralat mendaftar:", error);
                statusMessage.textContent = "❌ Gagal mendaftar: " + error.message;
                statusMessage.className = "p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 block mt-4";
            } finally {
                // Kembalikan keadaan butang
                btnSubmit.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                    Daftar Admin
                `;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
