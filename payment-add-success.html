<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pembayaran Korporat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Inter, sans-serif; }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#153638">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQMS">
<script src="/pwa.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl text-center">
        <h1 id="statusTajuk" class="text-2xl font-bold text-[#153638] mb-4">Menyemak Pembayaran...</h1>
        <p id="statusMesej" class="text-gray-500">Sila tunggu sebentar. Sistem sedang mengemas kini rekod pelantikan. Jangan tutup skrin ini.</p>
    </div>

<script type="module">
    import { auth } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    const urlParams = new URLSearchParams(window.location.search);
    const billId = urlParams.get('billplz[id]');
    const docType = urlParams.get('type') || "corporate"; // corporate, corporate_tunggal, corporate_kongsi, corporate_zurri

    // Halaman pulang ikut pakej
    const halaman = {
        corporate:         { ok: "corporate-page.html",         gagal: "corporate.html" },
        corporate_tunggal: { ok: "corporate-tunggal-page.html", gagal: "corporate-tunggal.html" },
        corporate_kongsi:  { ok: "corporate-kongsi-page.html",  gagal: "corporate-kongsi.html" },
        corporate_zurri:   { ok: "corporate-zurri-page.html",   gagal: "corporate-zurri.html" }
    }[docType] || { ok: "corporate-page.html", gagal: "corporate.html" };

    const tajuk = document.getElementById('statusTajuk');
    const mesej = document.getElementById('statusMesej');

    function gagal(teks) {
        tajuk.innerText = "Pembayaran Gagal/Batal";
        tajuk.classList.add("text-red-600");
        mesej.innerText = teks;
        setTimeout(() => { window.location.href = halaman.gagal; }, 3000);
    }

    if (urlParams.get('billplz[paid]') !== 'true' || !billId) {
        gagal("Sila cuba sebentar lagi.");
    } else {
        const unsub = onAuthStateChanged(auth, async (user) => {
            unsub();
            if (!user) { window.location.href = "login.html"; return; }
            try {
                // Semua pengesahan & rekod (status borang, submissions, lejer, resit) dibuat di server
                const proses = httpsCallable(getFunctions(auth.app, 'asia-southeast1'), 'prosesLantikanRTB');
                const res = await proses({ billId: billId, type: docType });

                if (!res.data || res.data.ok !== true) {
                    gagal("Pembayaran tidak dapat disahkan. Sila hubungi admin jika akaun anda telah dicaj.");
                    return;
                }
                tajuk.innerText = "Pembayaran Berjaya!";
                mesej.innerText = "Selesai! Anda akan dibawa ke dashboard.";
                setTimeout(() => { window.location.href = halaman.ok; }, 2000);
            } catch (error) {
                console.error("Ralat merekod data korporat:", error);
                mesej.innerText = "Ralat merekod data. Sila hubungi admin.";
                mesej.classList.add("text-red-600");
            }
        });
    }
</script>
</body>
</html>
