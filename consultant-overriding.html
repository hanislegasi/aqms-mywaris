<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Overriding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, sans-serif; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">
  <div class="bg-[#153638] text-white p-5">
    <h1 class="text-2xl font-bold">My Team</h1>
    <p>Overriding Performance</p>
  </div>

<div class="p-5">
    <!-- Baris Butang Aksi -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-5">
      <a href="consultant-dashboard.html" class="inline-flex items-center gap-2 bg-gray-200 px-5 py-3 rounded-xl hover:bg-gray-300 transition text-gray-800 font-semibold shadow-sm">
        <span>←</span> Dashboard
      </a>
      
      <!-- BUTANG BARU: SURAT TAWARAN AQP -->
      <a href="aqp-offer.html" class="inline-flex items-center gap-2 bg-[#d8ae81] hover:bg-[#c29b70] px-5 py-3 rounded-xl transition text-[#153638] font-bold shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        Surat Tawaran AQP
      </a>
    </div>
    
    <!-- KAD KPI BONUS (Asalnya disembunyikan. Hanya MGAM boleh nampak) -->
    <div id="kpiCardContainer" class="bg-white rounded-2xl p-6 shadow-sm mb-5 border border-gray-100 hidden">
        <div class="flex justify-between items-start mb-3">
            <div>
                <h2 class="text-lg font-bold text-[#153638]">KPI Bonus Pasukan (MGAM)</h2>
                <p class="text-sm text-gray-500" id="kpiRateText">Reward: 0%</p>
                <p class="text-xs font-bold text-blue-600 mt-1" id="kpiPeriodText">Tempoh: -</p>
            </div>
            <span id="kpiStatus" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm font-bold">
                In Progress
            </span>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 rounded-full h-5 mb-2 overflow-hidden shadow-inner">
            <div id="kpiBar" class="bg-green-500 h-5 rounded-full transition-all duration-1000 ease-out flex items-center justify-end pr-2 text-xs text-white font-bold" style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between text-sm font-semibold">
            <span id="kpiCurrent" class="text-[#153638]">Kumpulan Terkini: RM0.00</span>
            <span id="kpiTargetTxt" class="text-gray-500">Target: RM0.00</span>
        </div>

        <!-- Butang Tuntutan Bonus -->
        <div id="claimBonusContainer" class="mt-5 hidden">
            <button id="claimBonusBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition shadow-lg">
                🎉 KPI Tercapai! Hantar Tuntutan Bonus
            </button>
        </div>
    </div>

    <!-- Ringkasan Total (Hanya Sales & Override) -->
    <div id="summaryCard" class="grid md:grid-cols-2 gap-5 mb-5">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-500">Total Team Sales</h2>
        <p id="topTotalSales" class="text-4xl font-bold text-[#153638] mt-2">RM0.00</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-500">Lifetime Override</h2>
        <p id="topTotalOverride" class="text-4xl font-bold text-green-600 mt-2">RM0.00</p>
      </div>
    </div>

    <!-- Jadual Prestasi Team (Tanpa Kolum USB) -->
    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full">
        <thead class="bg-[#153638] text-white text-sm">
            <tr>
                <th class="p-4 text-left">Dari AQC</th>
                <th class="p-4 text-left">Nama</th>
                <th class="p-4 text-left">Level AQC</th>
                <th class="p-4 text-center">Total Sales</th>
                <th class="p-4 text-center">Total Override</th>
                <th class="p-4 text-center">% Bonus</th>
            </tr>
        </thead>
        <tbody id="overrideTable">
          <tr>
            <td colspan="6" class="p-4 text-center text-gray-500">Memuatkan data...</td>
          </tr>
        </tbody>
        <tfoot class="bg-gray-100 border-t-2 border-gray-300">
        </tfoot>
      </table>
    </div>
  </div>

  <script type="module">
    // 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import { 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import { 
    doc, 
    getDoc, 
    getDocs, 
    collection, 
    query, 
    where, 
    addDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        // 1. Dapatkan info Diri
        const userSnap = await getDoc(doc(db, "consultants", user.uid));
        const data = userSnap.data();
        const myConsultantNo = data.consultantNo;
        const myLevel = data.consultantLevel;

        // Buka kad KPI HANYA untuk MGAM
        if (myLevel === "MGAM") {
            document.getElementById("kpiCardContainer").classList.remove("hidden");
        }

        // 2. Tarik Setting KPI
        const compSnap = await getDoc(doc(db, "settings", "compensation"));
        const compData = compSnap.exists() ? compSnap.data() : {};

        const targetSalesBonus = Number(compData.targetSalesBonus || 240000); 
        const rewardBonusRate = Number(compData.rewardBonus || 5);
        const kpiPeriodType = compData.kpiPeriod || "yearly";

        document.getElementById("kpiRateText").textContent = `Reward: ${rewardBonusRate}% daripada RM${formatRM(targetSalesBonus)}`;

        // 3. Tentukan Tarikh Mengikut Setting Tempoh (Bulan)
        const kpiPeriodMonths = Number(compData.kpiPeriod || 12); 
        
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        
        let startDate, endDate, periodName;

        if (kpiPeriodMonths === 3) {
            const q = Math.floor(m / 3) + 1;
            startDate = new Date(y, (q - 1) * 3, 1);
            endDate = new Date(y, q * 3, 0, 23, 59, 59);
            periodName = `${y}-Q${q}`;
        } else if (kpiPeriodMonths === 6) {
            const h = m < 6 ? 1 : 2;
            startDate = new Date(y, h === 1 ? 0 : 6, 1);
            endDate = new Date(y, h === 1 ? 6 : 12, 0, 23, 59, 59);
            periodName = `${y}-H${h}`;
        } else {
            startDate = new Date(y, 0, 1);
            endDate = new Date(y, 11, 31, 23, 59, 59);
            periodName = `${y}-TAHUNAN`;
        }
        
        const kpiPeriodTextEl = document.getElementById("kpiPeriodText");
        if (kpiPeriodTextEl) {
            kpiPeriodTextEl.textContent = `Tempoh Semasa: ${periodName}`;
        }
        
        // 4. Tarik Salasilah Semua Consultant & Kumpul Direct Downline
        const allConsultantsSnap = await getDocs(collection(db, "consultantPublic"));
        const uplineMap = {};
        const levelMap = {};
        const nameMap = {};
        const directDownlines = [];
        
        allConsultantsSnap.forEach(doc => { 
            const d = doc.data();
            const cNo = d.consultantNo;
            if(!cNo) return;
            
            uplineMap[cNo] = d.upline; 
            levelMap[cNo] = d.consultantLevel || "AQC"; 
            nameMap[cNo] = d.nama;

            if (d.upline === myConsultantNo) {
                directDownlines.push(cNo);
            }
        });

        // FUNGSI PENAPIS BREAKAWAY MGAM
        function isBreakawayNetwork(downlineNo, topLeaderNo) {
            let currentNo = downlineNo;
            while (currentNo && currentNo !== topLeaderNo) {
                if (levelMap[currentNo] === "MGAM") return true;
                currentNo = uplineMap[currentNo];
            }
            return false;
        }

        // 5. Sediakan bekas data (Hanya Sales & Override)
        let teamData = {};
        let grandTotalSales = 0;
        let grandTotalOverride = 0;
        let periodSales = 0; // jualan pasukan dalam tempoh KPI semasa

        const myAqcNo = data.consultantNo; 

        // --- LANGKAH 5A: Tarik Direct Downline ---
        const downlineQ = query(collection(db, "consultantPublic"), where("upline", "==", myAqcNo));
        const downlineSnap = await getDocs(downlineQ);
        downlineSnap.forEach(d => {
            const dl = d.data();
            if (dl.consultantLevel !== "MGAM") {
                teamData[dl.consultantNo] = {
                    nama: dl.nama || "-",
                    level: dl.consultantLevel || "AQC",
                    sales: 0, override: 0, items: []
                };
            }
        });

        // --- LANGKAH 5B: Kumpul TOTAL SALES & OVERRIDE dari overrideHistory ---
        const historyQ = query(
            collection(db, "overrideHistory"),
            where("receiver", "==", myAqcNo)
        );
        const historySnap = await getDocs(historyQ);

        historySnap.forEach(d => {
            const h = d.data();
            const aqcNo = h.fromConsultant; 
            
            if (!aqcNo || aqcNo === myAqcNo) return; 

            if (!teamData[aqcNo]) {
                teamData[aqcNo] = { 
                    nama: h.fromName || "-", 
                    level: h.fromLevel || "AQC", 
                    sales: 0, override: 0, items: []
                };
            }
            teamData[aqcNo].sales += Number(h.sales || 0);
            teamData[aqcNo].override += Number(h.override || 0);
            teamData[aqcNo].items.push(h); // butiran untuk paparan klik

            // KPI dikira dalam tempoh semasa sahaja
            const tKpi = h.createdAt && h.createdAt.toDate ? h.createdAt.toDate() : (h.createdAt ? new Date(h.createdAt) : null);
            if (tKpi && tKpi >= startDate && tKpi <= endDate) periodSales += Number(h.sales || 0);
        });

        // --- 6. KIRA JUMLAH KESELURUHAN (GRAND TOTAL) ---
        for (const aqcNo in teamData) {
            grandTotalSales += teamData[aqcNo].sales;
            grandTotalOverride += teamData[aqcNo].override;
        }

        // Semak Tuntutan Bonus KPI
        const claimsQ = query(
            collection(db, "bonusPayable"), 
            where("team", "==", myConsultantNo),
            where("period", "==", periodName)
        );
        const claimsSnap = await getDocs(claimsQ);
        const claimedCount = claimsSnap.size;

        const applicableSales = periodSales - (claimedCount * targetSalesBonus);

        // 7. Update UI KPI Bar
        document.getElementById("kpiCurrent").textContent = `Kumpulan Terkini: RM${formatRM(applicableSales)}`;
        document.getElementById("kpiTargetTxt").textContent = `Sasar: RM${formatRM(targetSalesBonus)}`;
        
        let percentProgress = 0;
        if (targetSalesBonus > 0) {
            percentProgress = (applicableSales / targetSalesBonus) * 100;
        }
        
        const kpiBar = document.getElementById("kpiBar");
        if (percentProgress >= 100) {
            percentProgress = 100;
            kpiBar.textContent = "100%";
            document.getElementById("kpiStatus").textContent = "TERCAPAI!";
            document.getElementById("kpiStatus").className = "px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-bold";
            document.getElementById("claimBonusContainer").classList.remove("hidden");
        } else {
            kpiBar.textContent = percentProgress > 10 ? `${percentProgress.toFixed(1)}%` : "";
        }
        
        setTimeout(() => { kpiBar.style.width = `${percentProgress}%`; }, 300);

        // 8. Update Jadual (Tanpa Kolum USB)
        const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
        const rm = (n) => "RM" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const tarikh = (v) => { const d = v && v.toDate ? v.toDate() : (v ? new Date(v) : null); return d && !isNaN(d) ? d.toLocaleDateString("ms-MY") : "-"; };
        const masa = (v) => { const d = v && v.toDate ? v.toDate() : (v ? new Date(v) : null); return d && !isNaN(d) ? d.getTime() : 0; };

        let html = "";
        let idx = 0;
        for (const aqcNo in teamData) {
            const data = teamData[aqcNo];
            const bonusPct = grandTotalSales > 0 ? (data.sales / grandTotalSales) * 100 : 0;
            const items = (data.items || []).slice().sort((a, b) => masa(b.createdAt) - masa(a.createdAt));
            const rowId = "butiran-" + (idx++);

            const sumJualan = items.reduce((t, h) => t + Number(h.sales || 0), 0);
            const sumOverride = items.reduce((t, h) => t + Number(h.override || 0), 0);
            const th = "px-3 py-2 text-[11px] font-semibold uppercase tracking-wide text-gray-500";
            const td = "px-3 py-2";
            const butiran = items.length === 0
                ? `<p class="text-gray-500 text-sm px-2">Tiada rekod override.</p>`
                : `<div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                    <table class="w-full text-sm tabular-nums">
                    <colgroup><col style="width:12%"><col style="width:28%"><col style="width:16%"><col style="width:16%"><col style="width:10%"><col style="width:8%"><col style="width:10%"></colgroup>
                    <thead class="bg-gray-100"><tr>
                        <th class="${th} text-left">Tarikh</th><th class="${th} text-left">Pelanggan</th><th class="${th} text-left">Produk</th>
                        <th class="${th} text-left">Jualan Oleh</th><th class="${th} text-right">Jualan</th>
                        <th class="${th} text-center">Beza</th><th class="${th} text-right">Override</th>
                    </tr></thead>
                    <tbody class="divide-y divide-gray-100">${items.map(h => `
                        <tr class="hover:bg-gray-50">
                            <td class="${td} text-gray-600 whitespace-nowrap">${tarikh(h.createdAt)}</td>
                            <td class="${td}"><span class="text-gray-400 text-xs mr-1">${esc(h.customerNo || "-")}</span>${esc(h.customerName || "")}</td>
                            <td class="${td} ${h.product ? "" : "text-gray-300"}">${esc(h.product || "—")}</td>
                            <td class="${td}">${h.penjual && h.penjual !== h.fromConsultant
                                ? `${esc(h.penjual)} <span class="text-gray-400 text-xs">via ${esc(h.fromConsultant)}</span>`
                                : esc(h.fromConsultant || "-")}</td>
                            <td class="${td} text-right">${rm(h.sales)}</td>
                            <td class="${td} text-center"><span class="inline-block bg-gray-100 text-gray-600 rounded-full px-2 text-xs">${Number(h.diffRate || 0)}%</span></td>
                            <td class="${td} text-right font-semibold text-green-600">${rm(h.override)}</td>
                        </tr>`).join("")}
                    </tbody>
                    <tfoot class="bg-gray-50 border-t border-gray-200 font-semibold"><tr>
                        <td class="${td}" colspan="4">Jumlah (${items.length} transaksi)</td>
                        <td class="${td} text-right">${rm(sumJualan)}</td><td></td>
                        <td class="${td} text-right text-green-600">${rm(sumOverride)}</td>
                    </tr></tfoot></table></div>`;

            html += `
            <tr class="border-b hover:bg-gray-50 cursor-pointer" onclick="document.getElementById('${rowId}').classList.toggle('hidden')" title="Klik untuk lihat butiran">
                <td class="p-4">${aqcNo}</td>
                <td class="p-4 text-blue-700 underline">${data.nama} <span class="text-xs text-gray-400 no-underline">(${items.length})</span></td>
                <td class="p-4">${data.level}</td>
                <td class="p-4 text-center">RM${(data.sales || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td class="p-4 text-center font-bold text-green-600">RM${(data.override || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td class="p-4 text-center text-blue-600">${bonusPct.toFixed(2)}%</td>
            </tr>
            <tr id="${rowId}" class="hidden bg-gray-50 border-b">
                <td colspan="6" class="px-6 pt-2 pb-5">${butiran}</td>
            </tr>
            `;
        }

       html += `
        <tr class="bg-gray-50 font-bold border-t-2">
            <td colspan="3" class="p-4 text-right">JUMLAH KESELURUHAN:</td>
            <td class="p-4 text-center">RM${(grandTotalSales || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center text-green-600">RM${(grandTotalOverride || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center text-blue-600">100.00%</td>
        </tr>
        `;
        
        if (Object.keys(teamData).length === 0) html = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Tiada rekod jualan dalam tempoh ini (MGAM dikecualikan).</td></tr>`;

        document.getElementById("overrideTable").innerHTML = html;
        document.getElementById("topTotalSales").textContent = `RM${formatRM(grandTotalSales)}`;
        document.getElementById("topTotalOverride").textContent = `RM${formatRM(grandTotalOverride)}`;

        // LOGIK KLIK HANTAR TUNTUTAN BONUS KPI
        document.getElementById("claimBonusBtn").onclick = async function() {
            if (!confirm(`Sah hantar tuntutan KPI Bonus Pasukan ke HQ? \n\n*Progress bar akan kembali kepada RM0 selepas tuntutan ini berjaya.`)) return;

            this.disabled = true;
            this.textContent = "Sedang Memproses...";
            
            try {
                // Server kira semula & sahkan KPI sebelum merekod lejer / bonusPayable
                const fn = httpsCallable(getFunctions(auth.app, 'asia-southeast1'), 'tuntutBonusKPI');
                const res = await fn({});
                if (!res.data || res.data.ok !== true) {
                    alert("KPI belum tercapai untuk tempoh ini. Tuntutan tidak dihantar.");
                    this.disabled = false;
                    this.textContent = "Tuntut Bonus";
                    return;
                }
                alert(res.data.sudahDiproses ? "Tuntutan ini telah pun direkodkan." : "Berjaya! Tuntutan Bonus KPI telah masuk ke Lejer HQ.");
                window.location.reload();

            } catch (err) {
                console.error(err);
                alert("Ralat sistem: " + err.message);
                this.disabled = false;
                this.textContent = "Cuba Semula";
            }
        };

      } catch (err) {
        console.error("Ralat memuatkan data:", err);
      }
    });
  </script>
</body>
</html>
