<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Overriding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, sans-serif; }
  </style>
</head>

<body class="bg-gray-100">
  <div class="bg-[#153638] text-white p-5">
    <h1 class="text-2xl font-bold">My Team</h1>
    <p>Overriding Performance</p>
  </div>

  <div class="p-5">
    <a href="consultant-dashboard.html" class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-5 hover:bg-gray-300 transition text-gray-800">
      ← Dashboard
    </a>

    <!-- KAD KPI BONUS (Asalnya disembunyikan. Hanya MGAM boleh nampak) -->
    <div id="kpiCardContainer" class="bg-white rounded-2xl p-6 shadow-sm mb-5 border border-gray-100 hidden">
        <div class="flex justify-between items-start mb-3">
            <div>
                <h2 class="text-lg font-bold text-[#153638]">KPI Bonus Pasukan (MGAM)</h2>
                <p class="text-sm text-gray-500" id="kpiRateText">Reward: 0%</p>
                <p class="text-xs font-bold text-blue-600 mt-1" id="kpiPeriodText">Tempoh: -</p>
            </div>
            <span id="kpiStatus" class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm font-bold">
                In Progress
            </span>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 rounded-full h-5 mb-2 overflow-hidden shadow-inner">
            <div id="kpiBar" class="bg-green-500 h-5 rounded-full transition-all duration-1000 ease-out flex items-center justify-end pr-2 text-xs text-white font-bold" style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between text-sm font-semibold">
            <span id="kpiCurrent" class="text-[#153638]">Kumpulan Terkini: RM0.00</span>
            <span id="kpiTargetTxt" class="text-gray-500">Target: RM0.00</span>
        </div>

        <!-- Butang Tuntutan Bonus -->
        <div id="claimBonusContainer" class="mt-5 hidden">
            <button id="claimBonusBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition shadow-lg">
                🎉 KPI Tercapai! Hantar Tuntutan Bonus
            </button>
        </div>
    </div>

    <!-- Ringkasan Total -->
    <div id="summaryCard" class="grid md:grid-cols-2 gap-5 mb-5">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-500">Total Team Sales</h2>
        <p id="topTotalSales" class="text-4xl font-bold text-[#153638] mt-2">RM0.00</p>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-500">Lifetime Override</h2>
        <p id="topTotalOverride" class="text-4xl font-bold text-green-600 mt-2">RM0.00</p>
      </div>
    </div>

    <!-- Jadual Prestasi Team -->
    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full">
        <thead class="bg-[#153638] text-white text-sm">
    <tr>
        <th class="p-4 text-left">Dari AQC</th>
        <th class="p-4 text-left">Nama</th>
        <th class="p-4 text-left">Level AQC</th>
        <th class="p-4 text-center">Total Sales</th>
        <th class="p-4 text-center">Total Override</th>
        <th class="p-4 text-center">Total USB</th> <!-- TAMBAH INI -->
        <th class="p-4 text-center">% Bonus</th>
    </tr>
</thead>
        <tbody id="overrideTable">
          <tr>
            <td colspan="6" class="p-4 text-center text-gray-500">Memuatkan data...</td>
          </tr>
        </tbody>
        <tfoot class="bg-gray-100 border-t-2 border-gray-300">
          
        </tfoot>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, addDoc } 
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
      authDomain: "alqawthar-mywaris.firebaseapp.com",
      projectId: "alqawthar-mywaris",
      storageBucket: "alqawthar-mywaris.firebasestorage.app",
      messagingSenderId: "3498810778",
      appId: "1:3498810778:web:ee36e0fe42f76698046e23"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        // 1. Dapatkan info Diri
        const userSnap = await getDoc(doc(db, "consultants", user.uid));
        const data = userSnap.data();
        const myConsultantNo = data.consultantNo;
        const myLevel = data.consultantLevel;

        // Buka kad KPI HANYA untuk MGAM
        if (myLevel === "MGAM") {
            document.getElementById("kpiCardContainer").classList.remove("hidden");
        }

        // 2. Tarik Setting KPI
const compSnap = await getDoc(doc(db, "settings", "compensation"));
const compData = compSnap.exists() ? compSnap.data() : {};

// Guna nama field yang sama dengan di Admin Settings
const targetSalesBonus = Number(compData.targetSalesBonus || 240000); 
const rewardBonusRate = Number(compData.rewardBonus || 5);
        const kpiPeriodType = compData.kpiPeriod || "yearly"; // 'quarter', 'half', 'yearly'

        document.getElementById("kpiRateText").textContent = `Reward: ${rewardBonusRate}% daripada RM${formatRM(targetSalesBonus)}`;

        // 3. Tentukan Tarikh Mengikut Setting Tempoh (Bulan)
        const kpiPeriodMonths = Number(compData.kpiPeriod || 12); 
        
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        
        // MESTI ADA BARIS NI (Biar di luar if-else supaya sistem kenal variable ni)
        let startDate, endDate, periodName;

        if (kpiPeriodMonths === 3) {
            const q = Math.floor(m / 3) + 1;
            startDate = new Date(y, (q - 1) * 3, 1);
            endDate = new Date(y, q * 3, 0, 23, 59, 59);
            periodName = `${y}-Q${q}`;
        } else if (kpiPeriodMonths === 6) {
            const h = m < 6 ? 1 : 2;
            startDate = new Date(y, h === 1 ? 0 : 6, 1);
            endDate = new Date(y, h === 1 ? 6 : 12, 0, 23, 59, 59);
            periodName = `${y}-H${h}`;
        } else {
            startDate = new Date(y, 0, 1);
            endDate = new Date(y, 11, 31, 23, 59, 59);
            periodName = `${y}-TAHUNAN`;
        }
        
        // Sekarang periodName dah sah dikenali
        const kpiPeriodTextEl = document.getElementById("kpiPeriodText");
        if (kpiPeriodTextEl) {
            kpiPeriodTextEl.textContent = `Tempoh Semasa: ${periodName}`;
        }
        
        // 4. Tarik Salasilah Semua Consultant & Kumpul Direct Downline
        const allConsultantsSnap = await getDocs(collection(db, "consultants"));
        const uplineMap = {};
        const levelMap = {};
        const nameMap = {};
        const directDownlines = [];
        
        allConsultantsSnap.forEach(doc => { 
            const d = doc.data();
            const cNo = d.consultantNo;
            if(!cNo) return; // Abaikan data yang tiada consultantNo
            
            uplineMap[cNo] = d.upline; 
            levelMap[cNo] = d.consultantLevel || "AQC"; 
            nameMap[cNo] = d.nama;

            // Kumpul siapa yang direct downline kepada AQC yang sedang login
            if (d.upline === myConsultantNo) {
                directDownlines.push(cNo);
            }
        });

        // FUNGSI PENAPIS BREAKAWAY MGAM
        function isBreakawayNetwork(downlineNo, topLeaderNo) {
            let currentNo = downlineNo;
            while (currentNo && currentNo !== topLeaderNo) {
                if (levelMap[currentNo] === "MGAM") return true;
                currentNo = uplineMap[currentNo];
            }
            return false;
        }

      // 1. Sediakan bekas data (Sudah wujud dalam kod ko)
        let teamData = {};
        let grandTotalSales = 0;
        let grandTotalOverride = 0;
        let grandTotalUsb = 0; 

// KOD BARU YANG TERTINGGAL: Panggil data overrideHistory dari Firestore dulu
        const historyQ = query(
            collection(db, "overrideHistory"),
            where("receiver", "==", data.consultantNo)
        );
        const historySnap = await getDocs(historyQ);

        
        // 2. Kumpul jualan dari overrideHistory
        historySnap.forEach(d => {
            const h = d.data();
            const aqcNo = h.fromAqc || h.downlineNo;
            
            if (!aqcNo) return;

            if (!teamData[aqcNo]) {
                teamData[aqcNo] = { 
                    nama: nameMap[aqcNo] || h.fromName || "-", 
                    level: levelMap[aqcNo] || "AQC", 
                    sales: 0, 
                    override: 0,
                    usb: 0
                };
            }
            teamData[aqcNo].sales += Number(h.sales || 0);
        });

        // 3. TARIK OVERRIDE DAN USB 100% DARI LEJER
        const ledgerQ = query(
            collection(db, "ledger"),
            where("consultantNo", "==", data.consultantNo)
        );
        const ledgerSnap = await getDocs(ledgerQ);

        ledgerSnap.forEach(d => {
            const row = d.data();
            
            // Kita cuma nak proses data Overriding (2100) dan USB (2150)
            if (row.accountCode === "2100" || row.accountCode === "2150") {
                
                // Pastikan ada rekod siapa downline yang beri duit ni
                // (Semak Firebase ko, guna nama field yang betul, contoh: fromAqc)
                const downlineNo = row.fromAqc || row.downlineNo || row.source; 

                if (!downlineNo) return; // Kalau tak tahu dari downline mana, abaikan

                // Wujudkan rekod kalau belum ada
                if (!teamData[downlineNo]) {
                    teamData[downlineNo] = {
                        nama: nameMap[downlineNo] || "-",
                        level: levelMap[downlineNo] || "AQC",
                        sales: 0,
                        override: 0,
                        usb: 0
                    };
                }

                // Masukkan Overriding
                if (row.accountCode === "2100" && row.credit > 0) {
                    teamData[downlineNo].override += Number(row.credit);
                }
                
                // Masukkan USB (Sama ada yang 0.5% ATAU yang daftar RM50)
                if (row.accountCode === "2150" && row.credit > 0) {
                    teamData[downlineNo].usb += Number(row.credit);
                }
            }
        });

        // 4. Kira grand total selepas gabung semua
        for (const aqcNo in teamData) {
            grandTotalSales += teamData[aqcNo].sales;
            grandTotalOverride += teamData[aqcNo].override;
            grandTotalUsb += teamData[aqcNo].usb; 
        }

        // 6. Semak Berapa Kali Dah Claim Dalam Tempoh Ini (Untuk Reset Counter)
        const claimsQ = query(
            collection(db, "bonusPayable"), 
            where("team", "==", myConsultantNo),
            where("period", "==", periodName)
        );
        const claimsSnap = await getDocs(claimsQ);
        const claimedCount = claimsSnap.size; // Berapa kali dia dah klik butang claim

        // LOGIK RESET PROGRESS BAR: Tolak 240k untuk setiap claim yang dah dibuat
        const applicableSales = grandTotalSales - (claimedCount * targetSalesBonus);

        // 7. Update UI KPI Bar
        document.getElementById("kpiCurrent").textContent = `Kumpulan Terkini: RM${formatRM(applicableSales)}`;
        document.getElementById("kpiTargetTxt").textContent = `Sasar: RM${formatRM(targetSalesBonus)}`;
        
        let percentProgress = 0;
        if (targetSalesBonus > 0) {
            percentProgress = (applicableSales / targetSalesBonus) * 100;
        }
        
        const kpiBar = document.getElementById("kpiBar");
        if (percentProgress >= 100) {
            percentProgress = 100;
            kpiBar.textContent = "100%";
            document.getElementById("kpiStatus").textContent = "TERCAPAI!";
            document.getElementById("kpiStatus").className = "px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-bold";
            document.getElementById("claimBonusContainer").classList.remove("hidden"); // Tunjuk butang
        } else {
            kpiBar.textContent = percentProgress > 10 ? `${percentProgress.toFixed(1)}%` : "";
        }
        
        setTimeout(() => { kpiBar.style.width = `${percentProgress}%`; }, 300);

        // 8. Update Jadual (Hanya Ahli BUKAN MGAM)
        let html = "";
       for (const aqcNo in teamData) {
            const data = teamData[aqcNo];
            
            // KOD BARU: Kira peratusan sumbangan (Bonus %)
            // Kalau grandTotalSales ada nilai, baru bahagi. Kalau tak, letak 0%
            const bonusPct = grandTotalSales > 0 ? (data.sales / grandTotalSales) * 100 : 0;

            html += `
            <tr class="border-b hover:bg-gray-50">
                <td class="p-4">${aqcNo}</td>
                <td class="p-4">${data.nama}</td>
                <td class="p-4">${data.level}</td>
                
                <td class="p-4 text-center">RM${(data.sales || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td class="p-4 text-center font-bold text-green-600">RM${(data.override || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                
                <!-- Kolum USB -->
                <td class="p-4 text-center font-bold text-blue-600">RM${(data.usb || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                
                <td class="p-4 text-center text-blue-600">${bonusPct.toFixed(2)}%</td>
            </tr>
            `;
        }

html += `
        <tr class="bg-gray-50 font-bold border-t-2">
            <td colspan="3" class="p-4 text-right">JUMLAH KESELURUHAN:</td>
            <td class="p-4 text-center">RM${(grandTotalSales || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center text-green-600">RM${(grandTotalOverride || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center text-blue-600">RM${(grandTotalUsb || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center text-blue-600">100.00%</td>
        </tr>
        `;
        
        if (Object.keys(teamData).length === 0) html = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Tiada rekod jualan dalam tempoh ini (MGAM dikecualikan).</td></tr>`;

        document.getElementById("overrideTable").innerHTML = html;
        document.getElementById("topTotalSales").textContent = `RM${formatRM(grandTotalSales)}`;
        document.getElementById("topTotalOverride").textContent = `RM${formatRM(grandTotalOverride)}`;
       

        // ============================================
        // LOGIK KLIK HANTAR TUNTUTAN BONUS KPI
        // ============================================
        document.getElementById("claimBonusBtn").onclick = async function() {
            if (!confirm(`Sah hantar tuntutan KPI Bonus Pasukan ke HQ? \n\n*Progress bar akan kembali kepada RM0 selepas tuntutan ini berjaya.`)) return;

            this.disabled = true;
            this.textContent = "Sedang Memproses...";
            
            try {
                const bonusPool = targetSalesBonus * (rewardBonusRate / 100); 

                // 1. Rekod Lejer
                await addDoc(collection(db, "ledger"), {
                    date: new Date(),
                    accountCode: "6100", 
                    account: "KPI Bonus Expense",
                    category: "expense",
                    description: `Bonus KPI Pasukan ${myConsultantNo} (${periodName})`,
                    debit: bonusPool,
                    credit: 0,
                    paymentType: "CONSULTANT",
                    transactionGroup: "KPI-" + myConsultantNo
                });

                await addDoc(collection(db, "ledger"), {
                    date: new Date(),
                    accountCode: "2160",
                    account: "KPI Bonus Payable",
                    category: "liability",
                    description: `Bonus KPI Pasukan ${myConsultantNo} (${periodName})`,
                    debit: 0,
                    credit: bonusPool,
                    paymentType: "CONSULTANT",
                    transactionGroup: "KPI-" + myConsultantNo
                });

                // 2. Simpan pecahan tuntutan untuk dibayar oleh Admin
                // Kami HANYA cipta 1 rekod per tuntutan untuk mewakili 1 kali klik. 
                // Ahli pasukan disertakan bersama dokumen.
                await addDoc(collection(db, "bonusPayable"), {
                    team: myConsultantNo,
                    period: periodName,       // PENTING: Untuk elak kpi bar salah baca
                    targetAchieved: targetSalesBonus,
                    bonusPercent: rewardBonusRate,
                    bonusAmount: bonusPool,   // Total Bonus Pool
                    status: "PENDING_PAYMENT",
                    createdAt: new Date(),
                    members: Object.keys(teamData).map(aqcNo => ({
                        aqcNo: aqcNo,
                        nama: teamData[aqcNo].nama,
                        totalSales: teamData[aqcNo].sales,
                        bonusPercent: (teamData[aqcNo].sales / grandTotalSales) * 100,
                        bonusAmount: bonusPool * (teamData[aqcNo].sales / grandTotalSales)
                    }))
                });
                
                alert("Berjaya! Tuntutan Bonus KPI telah masuk ke Lejer HQ. Progress bar anda akan di-reset.");
                window.location.reload(); // Refresh untuk reset kaunter kepada 0

            } catch (err) {
                console.error(err);
                alert("Ralat sistem: " + err.message);
                this.disabled = false;
                this.textContent = "Cuba Semula";
            }
        };

      } catch (err) {
        console.error("Ralat memuatkan data:", err);
      }
    });
  </script>
</body>
</html>
