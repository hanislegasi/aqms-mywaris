<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Pendaftaran Konsultan
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body
class="bg-gray-100 min-h-screen flex items-center justify-center p-5"
style="font-family: Inter, sans-serif;">
  
<div
class="bg-white w-full max-w-xl p-8 rounded-3xl shadow-xl">

<h1
class="text-3xl font-bold text-[#153638] mb-2">

Al-Qawthar Consultant

</h1>

<p
id="registrationFeeText"
class="text-gray-500 mb-6">

Loading...

</p>
  
<form id="consultantForm" class="space-y-4">

<input
id="nama"
type="text"
placeholder="Nama Penuh"
class="w-full border p-3 rounded-xl"
required>

<input
id="ic"
type="text"
placeholder="No IC"
class="w-full border p-3 rounded-xl"
required>

<input
id="telefon"
type="text"
placeholder="No Telefon"
class="w-full border p-3 rounded-xl"
required>

<input
id="email"
type="email"
placeholder="Email"
class="w-full border p-3 rounded-xl"
required>

<input
id="bankName"
type="text"
placeholder="Nama Bank"
class="w-full border p-3 rounded-xl"
required>

<input
id="bankAccount"
type="text"
placeholder="No Akaun Bank"
class="w-full border p-3 rounded-xl"
required>
  
<!-- Alamat -->

<textarea
id="alamat"
placeholder="Alamat"
rows="3"
class="w-full border p-3 rounded-xl"
required></textarea>

<!-- Poskod & Bandar -->

<div class="grid grid-cols-3 gap-3">

<input
id="postcode"
type="text"
placeholder="Poskod"
class="border p-3 rounded-xl"
maxlength="5"
required>

<input
id="city"
type="text"
placeholder="Bandar"
class="col-span-2 border p-3 rounded-xl"
required>

</div>

<!-- Negeri -->

<select
id="state"
class="w-full border p-3 rounded-xl"
required>

<option value="">Pilih Negeri</option>

<option>Johor</option>
<option>Kedah</option>
<option>Kelantan</option>
<option>Kuala Lumpur</option>
<option>Labuan</option>
<option>Melaka</option>
<option>Negeri Sembilan</option>
<option>Pahang</option>
<option>Perak</option>
<option>Perlis</option>
<option>Pulau Pinang</option>
<option>Putrajaya</option>
<option>Sabah</option>
<option>Sarawak</option>
<option>Selangor</option>
<option>Terengganu</option>

</select>


<input
id="upline"
type="text"
placeholder="Kod Upline (AQC001)"
class="w-full border p-3 rounded-xl">

<div class="flex items-start mt-4 mb-6">
    <input id="agentPdpaConsent" type="checkbox" class="w-5 h-5 text-[#153638] bg-white border-gray-300 rounded focus:ring-[#153638] mt-1 cursor-pointer" required>
    <label for="agentPdpaConsent" class="ml-3 text-xs text-gray-600 cursor-pointer leading-relaxed text-justify">
        Saya bersetuju dengan <strong>Polisi PDPA 2010</strong> dan berikrar akan mematuhi dasar <strong>Kerahsiaan Data (Confidentiality)</strong> secara mutlak. Saya faham bahawa sebarang pendedahan, salah guna, atau kecuaian terhadap maklumat peribadi dan harta pusaka pelanggan tanpa kebenaran adalah satu jenayah perundangan dan melanggar dasar Syarikat.
    </label>
</div>
  
<button
id="registerButton"
type="submit"
class="w-full bg-[#153638] text-white p-4 rounded-xl font-bold">

Loading...

</button>

</form>

<script type="module">

// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import {
    onAuthStateChanged,
    createUserWithEmailAndPassword,  
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    getDoc,
    getDocs,
    collection,
    updateDoc,
    setDoc,
    query, 
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIX 1: Tambah fungsi formatRM supaya tidak ReferenceError
      const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2 });

      // Ambil compensation dari Firestore
      const compensationSnap = await getDoc(
        doc(db, "settings", "compensation")
      );

      // FIX 2 & 3: Semak kewujudan dokumen & gunakan nama field yang betul (consultantRegistrationFee)
      const compensation = compensationSnap.exists() ? compensationSnap.data() : {};
      const registrationFee = compensation.consultantRegistrationFee || compensation.consultantRegistration || 0;

      document.getElementById("registrationFeeText").innerHTML =
        `Pendaftaran Konsultan (RM${formatRM(registrationFee)})`;

      document.getElementById("registerButton").innerHTML =
        `Daftar Akaun`;
  
// CHECK LOGIN
onAuthStateChanged(auth, (user) => {
    // Jika pengguna sudah log masuk & sudah ada pendaftaran, boleh bawa terus ke dashboard/payment
    if (user) {
        console.log("User sedia ada:", user.uid);
    }
    // Jika (!user), BIARKAN SAHAJA pengguna mengisi borang pendaftaran baharu ini.
});
  
document.getElementById("consultantForm").addEventListener("submit", async(e)=>{
    e.preventDefault();

    // Buang semakan `if(!auth.currentUser)` lama yang menyekat pendaftaran

    // --- MULA KOD PENGESAHAN UPLINE ---
    const uplineInput = document.getElementById("upline").value.trim();
    let finalUpline = "";

    if (uplineInput) {
        finalUpline = uplineInput.toUpperCase();
        
        const uplineQ = query(
            collection(db, "consultants"), 
            where("consultantNo", "==", finalUpline)
        );
        const uplineSnap = await getDocs(uplineQ);

        if (uplineSnap.empty) {
            alert("Kod Upline (" + finalUpline + ") tidak wujud! Sila semak semula ejaan.");
            return; 
        }
    } 
    // --- TAMAT KOD PENGESAHAN UPLINE ---

    const btn = document.getElementById("registerButton");
    const originalBtnText = btn.innerHTML;
    btn.innerHTML = "Memproses Pendaftaran...";
    btn.disabled = true;

    try {
        const email = document.getElementById("email").value.trim();
        // Guna No IC sebagai Katalaluan Asas (Password) Pendaftaran jika tiada medan Katalaluan
        const password = document.getElementById("ic").value.trim(); 

        let user = auth.currentUser;

        // Jika akaun Auth belum wujud, cipta akaun baharu secara automatik
        if (!user) {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            user = userCredential.user;
        }

        // Simpan pendaftaran ke Firestore
        await setDoc(doc(db, "consultants", user.uid), {
            uid: user.uid,
            nama: document.getElementById("nama").value,
            ic: document.getElementById("ic").value,
            telefon: document.getElementById("telefon").value,
            email: email,
            bankName: document.getElementById("bankName").value,
            bankAccount: document.getElementById("bankAccount").value,
            alamat: document.getElementById("alamat").value,
            postcode: document.getElementById("postcode").value,
            city: document.getElementById("city").value,
            state: document.getElementById("state").value,
            
            upline: finalUpline, 

// Tangkap nilai
const pdpaAgreed = document.getElementById("agentPdpaConsent").checked;

// Masukkan dalam payload pendaftaran Consultant
consent: {
    pdpaAgreed: pdpaAgreed,
    confidentialityAgreed: true, // Automatik setuju sebab wajib
    agreedAt: new Date().toISOString(),
    version: "1.0"
},
          
            consultantLevel: "AQC",
            consultantPaymentStatus: "pending",
            createdAt: new Date()
        });

        // Update role di collection users
        await setDoc(doc(db, "users", user.uid), {
            role: "consultant"
        }, { merge: true });

        // Pergi ke halaman bayaran
        window.location.href = "consultant-payment.html";

    } catch (error) {
        console.error(error);
        alert("Ralat semasa pendaftaran: " + error.message);
        btn.innerHTML = originalBtnText;
        btn.disabled = false;
    }
});

</script>

</div>

</body>

</html>
