<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akaun AQM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

<h2 class="text-2xl font-bold mb-6 text-center text-[#153638]">
Daftar Akaun AQM
</h2>

<form id="registerForm" class="space-y-4">

<input
id="nama"
type="text"
placeholder="Nama Penuh"
class="w-full border p-3 rounded-lg"
required>

<input
id="ic"
type="text"
placeholder="No IC"
class="w-full border p-3 rounded-lg"
required>

<input
id="email"
type="email"
placeholder="Email"
class="w-full border p-3 rounded-lg"
required>

<input
id="telefon"
type="text"
placeholder="Telefon"
class="w-full border p-3 rounded-lg"
required>

<input
id="password"
type="password"
placeholder="Password"
class="w-full border p-3 rounded-lg"
required>

<input
id="referral"
type="text"
placeholder="Kod Referral AQC"
class="w-full border p-3 rounded-lg"
required>

<p
id="referralName"
class="text-sm text-green-600">
</p>

<button
type="submit"
class="w-full bg-[#153638] text-white py-3 rounded-lg font-bold hover:opacity-90 transition">
Daftar Akaun
</button>

</form>

<div class="text-center mt-4">
<a href="login.html" class="text-blue-600 hover:underline">
Sudah ada akaun? Log Masuk
</a>
</div>

</div>

<script type="module">

// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    setDoc,
    getDocs,
    collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");

if(ref){
  document.getElementById("referral").value = ref;
  document.getElementById("referral").readOnly = true;
}

document.getElementById("referral").addEventListener("blur", async()=>{
  const referral = document.getElementById("referral").value.trim();
  if(!referral) return;

  const usersSnap = await getDocs(collection(db,"consultants"));
  let sponsor = null;

  usersSnap.forEach((d)=>{
    const u = d.data();
    if(u.consultantNo === referral){
      sponsor = u.nama;
    }
  });

  document.getElementById("referralName").innerHTML = sponsor
    ? "✓ " + sponsor
    : "❌ No Konsultan tidak sah";
});

document.getElementById("registerForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const nama = document.getElementById("nama").value;
  const ic = document.getElementById("ic").value;
  const email = document.getElementById("email").value;
  const telefon = document.getElementById("telefon").value;
  const password = document.getElementById("password").value;
  const referral = document.getElementById("referral").value;

  if(!referral){
    alert("Sila masukkan Kod Referral");
    return;
  }

  const usersSnap = await getDocs(collection(db,"consultants"));
  let validReferral = false;

  usersSnap.forEach((d)=>{
    const u = d.data();
    if(u.consultantNo === referral){
      validReferral = true;
    }
  });

  if(!validReferral){
    alert("Referral tidak sah");
    return;
  }  

  try {
    const userCredential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );
    
    const uid = userCredential.user.uid;

    // Simpan terus ke collection 'users' untuk pelanggan AQM
    await setDoc(doc(db, "users", uid), {
      nama,
      ic,
      email,
      telefon,
      referral,
      accountType: "customer",
      role: "customer",
      leadStatus: "REGISTERED",
      paymentStatus: "unpaid",
      memberNo: null,
      createdAt: new Date()
    });

    alert("Pendaftaran AQM berjaya!");
    window.location.href = "login.html";

  } catch (error) {
    alert(error.message);
  }
}); 

</script>
  
</body>
</html>
