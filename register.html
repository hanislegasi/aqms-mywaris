<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akaun AQM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">  
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

<h2 class="text-2xl font-bold mb-6 text-center text-[#153638]">
Daftar Akaun AQM
</h2>

<form id="registerForm" class="space-y-4">

<input
id="nama"
type="text"
placeholder="Nama Penuh"
class="w-full border p-3 rounded-lg"
required>

<input
id="ic"
type="text"
placeholder="No IC"
class="w-full border p-3 rounded-lg"
required>

<input
id="email"
type="email"
placeholder="Email"
class="w-full border p-3 rounded-lg"
required>

<input
id="telefon"
type="text"
placeholder="Telefon"
class="w-full border p-3 rounded-lg"
required>

<input
id="password"
type="password"
placeholder="Password"
class="w-full border p-3 rounded-lg"
required>

<input
id="referral"
type="text"
placeholder="Kod Referral AQC / Ejen AQP"
class="w-full border p-3 rounded-lg bg-gray-50"
required>

<p id="referralName" class="text-sm text-green-600 font-semibold mb-2"></p>

<!-- PAPARAN INFO INTRODUCER (JIKA ADA) -->
<div id="introducerInfo" class="hidden bg-indigo-50 border border-indigo-200 text-indigo-700 text-sm p-3 rounded-lg mb-2 leading-snug">
    <!-- Diisi oleh Javascript -->
</div>

<!-- KOTAK KONSEN PDPA (WAJIB) -->
<div class="flex items-start mt-2">
    <input id="pdpaConsent" type="checkbox" class="w-5 h-5 text-[#153638] bg-white border-gray-300 rounded focus:ring-[#153638] mt-1 cursor-pointer" required>
    <label for="pdpaConsent" class="ml-3 text-xs text-gray-600 cursor-pointer leading-relaxed">
        Saya bersetuju dengan <a href="terms.html" target="_blank" class="text-blue-600 font-semibold hover:underline">Terma & Syarat</a> dan mengakui telah membaca serta memahami <a href="privacy-notice.html" target="_blank" class="text-blue-600 font-semibold hover:underline">Notis Privasi (PDPA)</a>.
    </label>
</div>

<!-- KOTAK KONSEN MARKETING (PILIHAN) -->
<div class="flex items-start mb-6">
    <input id="marketingConsent" type="checkbox" class="w-5 h-5 text-[#153638] bg-white border-gray-300 rounded focus:ring-[#153638] mt-1 cursor-pointer">
    <label for="marketingConsent" class="ml-3 text-xs text-gray-600 cursor-pointer leading-relaxed">
        (Pilihan) Saya bersetuju untuk menerima maklumat terkini, buletin, dan tawaran promosi daripada syarikat.
    </label>
</div>

<button
id="btnRegister"
type="submit"
class="w-full bg-[#153638] text-white py-3 rounded-lg font-bold hover:opacity-90 transition mt-4">
Daftar Akaun
</button>

</form>

<div class="text-center mt-4">
<a href="login.html" class="text-blue-600 text-sm hover:underline">
Sudah ada akaun? Log Masuk
</a>
</div>

</div>

<script type="module">
import { db, auth } from './firebase.js';
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, getDoc, getDocs, collection, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
     
const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");
const introUid = params.get("intro"); 

let validIntroducer = false;
let introducerCommPercent = 0;

// FUNGSI BARU: Semak Referal (AQC ATAU Ejen AQP) menggunakan Query
async function checkReferralValidity(referralCode) {
    let isValid = false;
    let sponsorName = null;
    let aqpName = null;
    let sponsorId = null;
    let data = null;

    try {
        // 1. Semak dalam koleksi 'consultants' (AQC Utama)
        const qConsultant = query(collection(db, "consultants"), where("consultantNo", "==", referralCode));
        const snapConsultant = await getDocs(qConsultant);
        
        if (!snapConsultant.empty) {
            isValid = true;
            const docData = snapConsultant.docs[0].data();
            sponsorName = docData.nama;
            sponsorId = snapConsultant.docs[0].id;
            return { isValid, sponsorName, aqpName: null, type: "AQC", sponsorId, data: docData };
        }

        // 2. Semak dalam koleksi 'users' untuk Ejen AQP (Format AQP0001-001)
        const qAgent = query(collection(db, "users"), where("agentCode", "==", referralCode), where("role", "==", "aqp_agent"));
        const snapAgent = await getDocs(qAgent);

        if (!snapAgent.empty) {
            isValid = true;
            const docData = snapAgent.docs[0].data();
            sponsorName = docData.nama;        // Nama Ejen
            aqpName = docData.aqpName || "";   // Nama Institusi AQP
            sponsorId = snapAgent.docs[0].id;
            return { isValid, sponsorName, aqpName, type: "Ejen AQP", sponsorId, data: docData };
        }
    } catch (e) {
        console.error("Ralat menyemak referral:", e);
    }

    return { isValid, sponsorName: null, aqpName: null, type: null, sponsorId: null, data: null };
}

// FUNGSI PAPARAN NAMA REFERRAL PADA SKRIN
async function semakAQC(referralCode) {
    if(!referralCode) return;
    
    const result = await checkReferralValidity(referralCode);

    if (result.isValid) {
        if (result.type === "Ejen AQP") {
            // PAPARKAN NAMA AQP DAHULU, KEMUDIAN NAMA EJEN
            const aqpText = result.aqpName ? `${result.aqpName} ` : "";
            document.getElementById("referralName").innerHTML = `✓ Rujukan Sah: <b>${aqpText}</b>(Ejen: ${result.sponsorName})`;
        } else {
            // PAPARKAN NAMA KONSULTAN BIASA
            document.getElementById("referralName").innerHTML = `✓ Rujukan Sah: <b>${result.sponsorName}</b>`;
        }
    } else {
        document.getElementById("referralName").innerHTML = "❌ Kod rujukan (Konsultan/Ejen) tidak sah";
    }
}

// SEMAK REFERRAL AQC DARI URL
if(ref){
  document.getElementById("referral").value = ref.toUpperCase();
  document.getElementById("referral").readOnly = true;
  semakAQC(ref.toUpperCase());
}

// SEMAK INTRODUCER (AQM) DARI URL
if (introUid) {
    (async () => {
        try {
            const introDoc = await getDoc(doc(db, "users", introUid));
            if (introDoc.exists()) {
                const introData = introDoc.data();
                if (introData.isIntroducer) {
                    validIntroducer = true;
                    introducerCommPercent = introData.introducerComm || 3;
                    
                    const infoBox = document.getElementById("introducerInfo");
                    infoBox.classList.remove("hidden");
                    infoBox.innerHTML = `Diperkenalkan oleh Rakan AQM:<br><b>${introData.nama}</b>`;
                }
            }
        } catch (e) {
            console.error("Ralat semak introducer:", e);
        }
    })();
}

// EVENT LISTENER JIKA USER TAIP KOD SECARA MANUAL
document.getElementById("referral").addEventListener("blur", (e) => {
    const val = e.target.value.trim().toUpperCase();
    e.target.value = val;
    semakAQC(val);
});

// SUBMIT BORANG
document.getElementById("registerForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const btn = document.getElementById("btnRegister");
  btn.innerText = "Mendaftar...";
  btn.disabled = true;

  const nama = document.getElementById("nama").value.trim();
  const ic = document.getElementById("ic").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefon = document.getElementById("telefon").value.trim();
  const password = document.getElementById("password").value;
  const referral = document.getElementById("referral").value.trim().toUpperCase();
  
  const pdpaAgreed = document.getElementById("pdpaConsent").checked;
  const marketingAgreed = document.getElementById("marketingConsent").checked;

  if(!referral){
    alert("Sila masukkan Kod Referral");
    btn.innerText = "Daftar Akaun";
    btn.disabled = false;
    return;
  }

  // SEMAK SEKALI LAGI SEBELUM SUBMIT
  const referralCheck = await checkReferralValidity(referral);

  if(!referralCheck.isValid){
    alert("Kod Referral tidak sah. Sila semak semula kod.");
    btn.innerText = "Daftar Akaun";
    btn.disabled = false;
    return;
  }  

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCredential.user.uid;

    let payloadData = {
      nama,
      ic,
      email,
      telefon,
      referral, // Boleh simpan AQC No atau AG-XXXXXX
      accountType: "customer",
      role: "customer",
      leadStatus: "REGISTERED",
      paymentStatus: "unpaid",
      memberNo: null,
      consent: {
          pdpaAgreed: pdpaAgreed,
          marketingAgreed: marketingAgreed,
          agreedAt: new Date().toISOString(),
          version: "1.0"
      },
      createdAt: new Date()
    };

    if (validIntroducer && introUid) {
        payloadData.introducerUid = introUid;
        payloadData.introducerComm = introducerCommPercent;
    }

    await setDoc(doc(db, "users", uid), payloadData);

    if (validIntroducer && introUid) {
        try {
            const prosQuery = query(
                collection(db, "prospects"), 
                where("introducerUid", "==", introUid),
                where("telefonProspek", "==", telefon)
            );
            const prosSnap = await getDocs(prosQuery);

            if (!prosSnap.empty) {
                const prosDocId = prosSnap.docs[0].id;
                await updateDoc(doc(db, "prospects", prosDocId), {
                    status: "Didaftarkan"
                });
            }
        } catch (err) {
            console.error("Gagal auto-update status prospek:", err);
        }
    }

    alert("Pendaftaran berjaya! Anda akan dibawa ke sistem utama.");
    
    setTimeout(() => {
        window.location.href = "dashboard.html"; 
    }, 1500);

  } catch (error) {
    alert("Gagal Mendaftar: " + error.message);
    btn.innerText = "Daftar Akaun";
    btn.disabled = false;
  }
});

</script>
  
</body>
</html>
