<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">

<div class="bg-[#153638] text-white p-5">
    <h1 class="text-2xl font-bold">My Clients</h1>
</div>

<div class="p-5">

    <a href="consultant-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 px-5 py-3 rounded-xl font-semibold mb-5 transition text-gray-800">
        ← Kembali ke Dashboard
    </a>

    <div class="grid md:grid-cols-3 gap-4 mb-5">
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Client</p>
            <p id="totalClients" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Sales</p>
            <p id="totalClientSales" class="text-3xl font-bold text-green-600">RM0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Komisen</p>
            <p id="totalCommission" class="text-3xl font-bold text-blue-600">RM0</p>
        </div>
    </div>
  
    <div id="clientList" class="overflow-x-auto">
        <table class="w-full bg-white rounded-xl overflow-hidden shadow">
            <thead class="bg-[#153638] text-white">
                <tr>
                    <th class="p-3 text-left">Bil</th>
                    <th class="p-3 text-left">Tarikh Daftar</th>
                    <th class="p-3 text-left">No Ahli</th>
                    <th class="p-3 text-left">Nama</th>
                    <th class="p-3 text-left">Telefon</th>
                    <th class="p-3 text-left">Sales</th>
                    <th class="p-3 text-left">Komisen</th>
                    <th class="p-3 text-left">Tarikh Tamat</th>
                    <th class="p-3 text-center">Status Ahli</th>
                    <th class="p-3 text-center">Workflow</th>
                    <th class="p-3 text-center">Tindakan</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="11" class="p-5 text-center text-gray-500">Memuatkan...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
  
<script type="module">
import { db, auth } from './firebase.js';
import { collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, async(user)=>{

    if(!user){
        window.location.href = "login.html";
        return;
    }

    const consultantSnap = await getDoc(doc(db, "consultants", user.uid));
    const consultantData = consultantSnap.data();
    const consultantNo = consultantData.consultantNo;

    // --- 1. TARIK DATA SETTINGS (UNTUK FALLBACK JIKA REKOD LAMA TIADA RESIT) ---
    const compSnap = await getDoc(doc(db, "settings", "compensation"));
    const comp = compSnap.exists() ? compSnap.data() : {};

    const priceWasiat = Number(comp.wasiatPrice || 350);
    const priceHibah = Number(comp.hibahPrice || 2500);
    const priceSepencarian = Number(comp.sepencarianPrice || 800);
    const priceMawaris = Number(comp.mawarisPrice || 3000);
    
    const priceCorporate = Number(comp.corporatePrice || 6000);
    const priceCorporateTunggal = Number(comp.corporateTunggalPrice || 1500);
    const priceCorporateKongsi = Number(comp.corporateKongsiPrice || 3000);
    const priceCorporateZurri = Number(comp.corporateZurriPrice || 1000);

    let commissionRate = 0;
    const lvl = consultantData.consultantLevel;
    if(lvl === "AQC") commissionRate = Number(comp.commissionAQC || 35);
    else if(lvl === "AQC-AS") commissionRate = Number(comp.commissionAQCAS || 38);
    else if(lvl === "AQC-UM") commissionRate = Number(comp.commissionAQCUM || 40);
    else if(lvl === "MGAM") commissionRate = Number(comp.commissionMGAM || 45);

    // --- 2. TARIK DATA DARI PAYMENT VOUCHERS (Untuk Jualan Sebenar Kekal) ---
    const paymentClientMap = {};
    const paymentQ = query(collection(db, "paymentVouchers"), where("consultantNo", "==", consultantNo), where("status", "==", "PAID"));
    const paymentSnap = await getDocs(paymentQ);
    paymentSnap.forEach(d => {
        const p = d.data();
        const uid = p.uid || p.userId || p.clientUid;
        if (uid) {
            if (!paymentClientMap[uid]) paymentClientMap[uid] = 0;
            paymentClientMap[uid] += Number(p.amount || 0);
        }
    });

    // --- 3. TARIK DATA DARI LEJER (Untuk Komisen Sebenar Kekal) ---
    const commissionClientMap = {};
    const ledgerQ = query(collection(db, "ledger"), where("consultantNo", "==", consultantNo), where("accountCode", "==", "2000"));
    const ledgerSnap = await getDocs(ledgerQ);
    ledgerSnap.forEach(d => {
        const rekod = d.data();
        const uid = rekod.clientUid || rekod.userId || rekod.uid;
        if (uid) {
            if (!commissionClientMap[uid]) commissionClientMap[uid] = 0;
            commissionClientMap[uid] += Number(rekod.credit || 0);
        }
    });

    // --- 4. BINA JADUAL PELANGGAN ---
    const snap = await getDocs(collection(db,"users"));
    let html = "";
    let bil = 1;
    
    // Total Variables
    let totalClients = 0;
    let sumTotalSales = 0;
    let sumTotalCommission = 0;
  
    for (const docSnap of snap.docs){
        const client = docSnap.data();
        const clientId = docSnap.id;
        
        // Penapisan Prospek & Pelanggan milik konsultan
        if(client.role !== "customer" || (client.referral || "").trim() !== consultantNo){
            continue;
        }

        totalClients++;
        
        let clientSales = 0;
        let commission = 0;

        // AMBIL JUALAN TEPAT DARI VOUCHER (Atau fallback jika rekod lama)
        if (paymentClientMap[clientId] && paymentClientMap[clientId] > 0) {
            clientSales = paymentClientMap[clientId];
        } else {
            if(client.wasiatPaymentStatus === "paid") clientSales += priceWasiat;
            if(client.hibahPaymentStatus === "paid") clientSales += priceHibah;
            if(client.sepencarianPaymentStatus === "paid") clientSales += priceSepencarian;
            if(client.mawarisPaymentStatus === "paid") clientSales += priceMawaris;
            
            if(client.corporatePaymentStatus === "paid") clientSales += priceCorporate;
            if(client.corporateTunggalPaymentStatus === "paid") clientSales += priceCorporateTunggal;
            if(client.corporateKongsiPaymentStatus === "paid") clientSales += priceCorporateKongsi;
            if(client.corporateZurriPaymentStatus === "paid") clientSales += priceCorporateZurri;
        }

        // AMBIL KOMISEN TEPAT DARI LEJER (Atau fallback jika rekod lama)
        if (commissionClientMap[clientId] && commissionClientMap[clientId] > 0) {
            commission = commissionClientMap[clientId];
        } else {
            commission = clientSales * (commissionRate / 100);
        }

        // KIRA JUMLAH BESAR UNTUK KOTAK ATAS SUPAYA 100% TALLY
        sumTotalSales += clientSales;
        sumTotalCommission += commission;

        const expiryDate = client.expiryDate ? new Date(client.expiryDate).toLocaleDateString("ms-MY") : "-";

        // Tambah Modul Korporat Baharu Untuk Semakan Workflow
        const modules = [
            { key:"corporate", label:"KORPORAT PREMIUM" },
            { key:"corporate_tunggal", label:"KORPORAT TUNGGAL" },
            { key:"corporate_kongsi", label:"KORPORAT KONGSI" },
            { key:"corporate_zurri", label:"KORPORAT ZURRI" },
            { key:"hibah", label:"HIBAH" },
            { key:"wasiat", label:"WASIAT" },
            { key:"sepencarian", label:"SEPENCARIAN" },
            { key:"mawaris", label:"MAWARIS" }
        ];

        let workflowStatus = "PROSPEK";

        for(const module of modules){
            const moduleSnap = await getDoc(doc(db, "users", docSnap.id, module.key, "maklumat"));
            if(moduleSnap.exists()){
                const moduleData = moduleSnap.data();
                if(moduleData.status){
                    workflowStatus = moduleData.status;
                    break;
                }
            }
        }
      
        const registerDate = client.createdAt ? client.createdAt.toDate().toLocaleDateString("ms-MY") : "-";

        const isAhliAktif = 
            client.wasiatPaymentStatus === "paid" ||
            client.hibahPaymentStatus === "paid" ||
            client.sepencarianPaymentStatus === "paid" ||
            client.mawarisPaymentStatus === "paid" ||
            client.corporatePaymentStatus === "paid" ||
            client.corporateTunggalPaymentStatus === "paid" ||
            client.corporateKongsiPaymentStatus === "paid" ||
            client.corporateZurriPaymentStatus === "paid";
      
        html += `
        <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${bil++}</td>
            <td class="p-3">${registerDate}</td>
            <td class="p-3">${client.memberNo || "-"}</td>
            <td class="p-3 font-semibold">${client.nama || "-"}</td>
            <td class="p-3">${client.telefon || "-"}</td>
            <td class="p-3 text-right font-semibold text-green-600">
                RM${clientSales.toLocaleString("en-US",{ minimumFractionDigits:2, maximumFractionDigits:2 })}
            </td>
            <td class="p-3 text-right font-semibold text-blue-600">
                RM${commission.toLocaleString("en-US",{ minimumFractionDigits:2, maximumFractionDigits:2 })}
            </td>
            <td class="p-3">${expiryDate}</td>
            <td class="p-3 text-center">
                <span class="px-3 py-1 rounded-full text-xs font-bold ${isAhliAktif ? "bg-green-100 text-green-700" : "bg-yellow-100 text-yellow-700"}">
                    ${isAhliAktif ? "AHLI AKTIF" : "PROSPEK"}
                </span>
            </td>
            <td class="p-3 text-center">
                <span class="px-3 py-1 rounded-full text-xs font-bold
                ${
                workflowStatus==="COMPLETED" ? "bg-emerald-100 text-emerald-700"
                : workflowStatus==="SENT" ? "bg-blue-100 text-blue-700"
                : workflowStatus==="PRINTED" ? "bg-indigo-100 text-indigo-700"
                : workflowStatus==="VERIFIED" ? "bg-cyan-100 text-cyan-700"
                : workflowStatus==="APPROVED" ? "bg-green-100 text-green-700"
                : workflowStatus==="UNDER_REVIEW" ? "bg-yellow-100 text-yellow-700"
                : "bg-gray-100 text-gray-600"
                }">
                ${workflowStatus}
                </span>
            </td>
            <td class="p-3 text-center">
                <a href="consultant-customer-details.html?id=${docSnap.id}" class="bg-[#153638] text-white px-3 py-2 rounded-lg text-sm font-semibold hover:bg-[#1d4a4d] transition">
                    View
                </a>
            </td>
        </tr>
        `;
    }

    // --- 5. PAPARKAN JUMLAH TEPAT KE KOTAK ATAS ---
    document.getElementById("totalClients").innerHTML = totalClients;
    
    document.getElementById("totalClientSales").innerHTML = "RM " + sumTotalSales.toLocaleString("en-US",{
        minimumFractionDigits:2, maximumFractionDigits:2
    });

    document.getElementById("totalCommission").innerHTML = "RM " + sumTotalCommission.toLocaleString("en-US",{
        minimumFractionDigits:2, maximumFractionDigits:2
    });

    document.getElementById("tableBody").innerHTML = html || `
    <tr>
        <td colspan="11" class="p-5 text-center text-gray-500">Tiada client direkodkan.</td>
    </tr>
    `;

});

</script>

</body>
</html>
