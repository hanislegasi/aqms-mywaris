<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">

<div class="bg-[#153638] text-white p-5">
    <h1 class="text-2xl font-bold">My Clients</h1>
</div>

<div class="p-5">

    <a href="consultant-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 px-5 py-3 rounded-xl font-semibold mb-5 transition text-gray-800">
        ← Kembali ke Dashboard
    </a>

    <div class="grid md:grid-cols-3 gap-4 mb-5">
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Client</p>
            <p id="totalClients" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Sales</p>
            <p id="totalClientSales" class="text-3xl font-bold text-green-600">RM0.00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow">
            <p class="text-gray-500">Jumlah Komisen</p>
            <p id="totalCommission" class="text-3xl font-bold text-blue-600">RM0.00</p>
        </div>
    </div>
  
    <div id="clientList" class="overflow-x-auto">
        <table class="w-full bg-white rounded-xl overflow-hidden shadow">
            <thead class="bg-[#153638] text-white">
                <tr>
                    <th class="p-3 text-left">Bil</th>
                    <th class="p-3 text-left">Tarikh Daftar</th>
                    <th class="p-3 text-left">No Ahli</th>
                    <th class="p-3 text-left">Nama</th>
                    <th class="p-3 text-left">Telefon</th>
                    <th class="p-3 text-left">Sales (Lejer)</th>
                    <th class="p-3 text-left">Komisen (Lejer/Kiraan)</th>
                    <th class="p-3 text-left">Tarikh Tamat</th>
                    <th class="p-3 text-center">Status Ahli</th>
                    <th class="p-3 text-center">Workflow</th>
                    <th class="p-3 text-center">Tindakan</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="11" class="p-5 text-center text-gray-500">Memuatkan...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
  
<script type="module">
import { db, auth } from './firebase.js';
import { collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, async(user)=>{

    if(!user){
        window.location.href = "login.html";
        return;
    }

    const consultantSnap = await getDoc(doc(db, "consultants", user.uid));
    const consultantData = consultantSnap.data();
    const consultantNo = consultantData.consultantNo;
    const consName = consultantData.nama ? consultantData.nama.toLowerCase().trim() : "";

    // --- 1. DAPATKAN KADAR KOMISEN SEMASA (UNTUK FALLBACK REKOD LAMA) ---
    const compSnap = await getDoc(doc(db, "settings", "compensation"));
    const comp = compSnap.exists() ? compSnap.data() : {};

    let commissionRate = 0;
    const lvl = consultantData.consultantLevel;
    if(lvl === "AQC") commissionRate = Number(comp.commissionAQC || 35);
    else if(lvl === "AQC-AS") commissionRate = Number(comp.commissionAQCAS || 38);
    else if(lvl === "AQC-UM") commissionRate = Number(comp.commissionAQCUM || 40);
    else if(lvl === "MGAM") commissionRate = Number(comp.commissionMGAM || 45);

    // --- 2. TARIK SEMUA DATA LEJER KE DALAM MEMORI ---
    // Hanya lejer milik konsultan ini (6B: tidak lagi baca seluruh lejer)
    const ledgerSnap = await getDocs(query(collection(db, "ledger"), where("consultantNo", "==", consultantNo)));
    const ledgerRecords = [];
    
    ledgerSnap.forEach(d => {
        ledgerRecords.push({ id: d.id, ...d.data() });
    });

    // --- 3. BINA JADUAL PELANGGAN ---
    // Hanya pelanggan yang dirujuk oleh konsultan ini
    const snap = await getDocs(query(collection(db,"users"), where("referral", "==", consultantNo)));
    let html = "";
    let bil = 1;
    
    let totalClients = 0;
    let sumTotalSales = 0; 
    let sumTotalCommission = 0;
  
    for (const docSnap of snap.docs){
        const client = docSnap.data();
        const clientId = docSnap.id;
        
        // Penapisan: Hanya pelanggan di bawah seliaan konsultan ini
        if(client.role !== "customer" || (client.referral || "").trim() !== consultantNo){
            continue;
        }

        totalClients++;
        
        let clientSales = 0;
        let commission = 0;
        const belian = {}; // butiran ikut transaksi (billId, atau tarikh untuk rekod lama)

        const mNo = client.memberNo ? client.memberNo.toUpperCase() : null;
        const cName = client.nama ? client.nama.toLowerCase().trim() : null;

        // --- 4. LOGIK PADANAN LEJER (SMART & SAFE MATCHING) ---
        ledgerRecords.forEach(rekod => {
            let isMatch = false;
            const acc = String(rekod.accountCode);
            const desc = rekod.description ? rekod.description.toLowerCase() : "";
            const tGroup = rekod.transactionGroup ? String(rekod.transactionGroup).trim().toUpperCase() : "";
            const rUid = rekod.clientUid || rekod.userId || rekod.uid || rekod.customerId || "";
            const rMemNo = rekod.memberNo ? String(rekod.memberNo).toUpperCase() : "";

            // A. Padan menggunakan UID secara Mutlak (Paling Tepat)
            if (rUid === clientId || tGroup === clientId.toUpperCase()) {
                isMatch = true;
            }
            // B. Padan menggunakan No Ahli (AQM)
            else if (mNo && (tGroup === mNo || rMemNo === mNo || desc.includes(mNo.toLowerCase()))) {
                isMatch = true;
            }
            // C. Padan menggunakan Nama Klien (Fallback untuk rekod lama)
            // SAFETY LOCK: Jika nama klien sama sebiji dengan nama perunding, KITA HARAMKAN carian nama!
            else if (cName && cName.length > 3 && cName !== consName && desc.includes(cName)) {
                isMatch = true;
            }

            // Jika Padan, rekod jualan & komisen
            if (isMatch) {
                if (acc === "1000") clientSales += Number(rekod.debit || 0);
                if (acc === "2000") commission += Number(rekod.credit || 0);

                if (acc === "1000" || acc === "2000" || rekod.category === "income") {
                    const d = rekod.date && rekod.date.toDate ? rekod.date.toDate() : (rekod.date ? new Date(rekod.date) : null);
                    const hari = d && !isNaN(d) ? d.toISOString().slice(0, 10) : "-";
                    const kunci = rekod.billId || hari;
                    if (!belian[kunci]) belian[kunci] = { tarikh: d, produk: "", jualan: 0, komisen: 0 };
                    if (acc === "1000") belian[kunci].jualan += Number(rekod.debit || 0);
                    if (acc === "2000") belian[kunci].komisen += Number(rekod.credit || 0);
                    if (rekod.category === "income" && !belian[kunci].produk) {
                        belian[kunci].produk = String(rekod.product || rekod.account || "").replace(/^Sales - /, "");
                    }
                }
            }
        });

        // 5. PENYELARASAN FALLBACK (Jika Lejer Akaun 2000 belum wujud tapi Jualan ada)
        // Ini memastikan Ali Bin Abu dan Mikey Moore dapat komisen mereka
        if (commission === 0 && clientSales > 0) {
            commission = clientSales * (commissionRate / 100);
        }

        // 6. BLOK MUTLAK: Jika prospek belum beli apa-apa, komisen WAJIB RM0
        if (clientSales <= 0) {
            commission = 0;
        }

        // Kumpul untuk kotak atas (Gerenti Tally dengan jadual 100%)
        sumTotalSales += clientSales;
        sumTotalCommission += commission;

        const expiryDate = client.expiryDate ? new Date(client.expiryDate).toLocaleDateString("ms-MY") : "-";

        // Tambah Modul Korporat Baharu Untuk Semakan Workflow
        const modules = [
            { key:"corporate", label:"KORPORAT PREMIUM" },
            { key:"corporate_tunggal", label:"KORPORAT TUNGGAL" },
            { key:"corporate_kongsi", label:"KORPORAT KONGSI" },
            { key:"corporate_zurri", label:"KORPORAT ZURRI" },
            { key:"hibah", label:"HIBAH" },
            { key:"wasiat", label:"WASIAT" },
            { key:"sepencarian", label:"SEPENCARIAN" },
            { key:"mawaris", label:"MAWARIS" }
        ];

        let workflowStatus = "DRAFTING";

        for(const module of modules){
            const moduleSnap = await getDoc(doc(db, "users", docSnap.id, module.key, "maklumat"));
            if(moduleSnap.exists()){
                const moduleData = moduleSnap.data();
                if(moduleData.status){
                    workflowStatus = moduleData.status;
                    break;
                }
            }
        }
      
        const registerDate = client.createdAt ? client.createdAt.toDate().toLocaleDateString("ms-MY") : "-";

        const isAhliAktif = 
            client.wasiatPaymentStatus === "paid" ||
            client.hibahPaymentStatus === "paid" ||
            client.sepencarianPaymentStatus === "paid" ||
            client.mawarisPaymentStatus === "paid" ||
            client.corporatePaymentStatus === "paid" ||
            client.corporateTunggalPaymentStatus === "paid" ||
            client.corporateKongsiPaymentStatus === "paid" ||
            client.corporateZurriPaymentStatus === "paid";
      
        const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
        const rm = (n) => "RM" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const senaraiBelian = Object.values(belian).filter(b => b.jualan > 0 || b.komisen > 0)
            .sort((a, b) => (b.tarikh ? b.tarikh.getTime() : 0) - (a.tarikh ? a.tarikh.getTime() : 0));
        const rowId = "belian-" + clientId;
        const th = "px-3 py-2 text-[11px] font-semibold uppercase tracking-wide text-gray-500";
        const td = "px-3 py-2";
        const sumJ = senaraiBelian.reduce((t, b) => t + b.jualan, 0);
        const sumK = senaraiBelian.reduce((t, b) => t + b.komisen, 0);
        const butiran = senaraiBelian.length === 0
            ? `<p class="text-gray-500 text-sm px-2">Tiada rekod belian.</p>`
            : `<div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <table class="w-full text-sm tabular-nums">
                <colgroup><col style="width:15%"><col style="width:55%"><col style="width:15%"><col style="width:15%"></colgroup>
                <thead class="bg-gray-100"><tr>
                    <th class="${th} text-left">Tarikh</th><th class="${th} text-left">Produk / Perkhidmatan</th>
                    <th class="${th} text-right">Jualan</th><th class="${th} text-right">Komisen</th>
                </tr></thead>
                <tbody class="divide-y divide-gray-100">${senaraiBelian.map(b => `
                    <tr class="hover:bg-gray-50">
                        <td class="${td} text-gray-600 whitespace-nowrap">${b.tarikh ? b.tarikh.toLocaleDateString("ms-MY") : "-"}</td>
                        <td class="${td} ${b.produk ? "" : "text-gray-300"}">${esc(b.produk || "—")}</td>
                        <td class="${td} text-right text-green-600">${rm(b.jualan)}</td>
                        <td class="${td} text-right ${b.komisen > 0 ? "text-blue-600" : "text-gray-300"}">${b.komisen > 0 ? rm(b.komisen) : "—"}</td>
                    </tr>`).join("")}
                </tbody>
                <tfoot class="bg-gray-50 border-t border-gray-200 font-semibold"><tr>
                    <td class="${td}" colspan="2">Jumlah (${senaraiBelian.length} transaksi)</td>
                    <td class="${td} text-right text-green-600">${rm(sumJ)}</td>
                    <td class="${td} text-right text-blue-600">${rm(sumK)}</td>
                </tr></tfoot></table></div>`;

        html += `
        <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${bil++}</td>
            <td class="p-3">${registerDate}</td>
            <td class="p-3">${client.memberNo || "-"}</td>
            <td class="p-3 font-semibold text-blue-700 underline cursor-pointer" onclick="document.getElementById('${rowId}').classList.toggle('hidden')" title="Klik untuk lihat butiran belian">${client.nama || "-"}</td>
            <td class="p-3">${client.telefon || "-"}</td>
            <td class="p-3 text-right font-semibold text-green-600">
                RM${clientSales.toLocaleString("en-US",{ minimumFractionDigits:2, maximumFractionDigits:2 })}
            </td>
            <td class="p-3 text-right font-semibold text-blue-600">
                RM${commission.toLocaleString("en-US",{ minimumFractionDigits:2, maximumFractionDigits:2 })}
            </td>
            <td class="p-3">${expiryDate}</td>
            <td class="p-3 text-center">
                <span class="px-3 py-1 rounded-full text-xs font-bold ${isAhliAktif ? "bg-green-100 text-green-700" : "bg-yellow-100 text-yellow-700"}">
                    ${isAhliAktif ? "AHLI AKTIF" : "PROSPEK"}
                </span>
            </td>
            <td class="p-3 text-center">
                <span class="px-3 py-1 rounded-full text-xs font-bold
                ${
                workflowStatus==="COMPLETED" ? "bg-emerald-100 text-emerald-700"
                : workflowStatus==="SENT" ? "bg-blue-100 text-blue-700"
                : workflowStatus==="PRINTED" ? "bg-indigo-100 text-indigo-700"
                : workflowStatus==="VERIFIED" ? "bg-cyan-100 text-cyan-700"
                : workflowStatus==="APPROVED" ? "bg-green-100 text-green-700"
                : workflowStatus==="UNDER_REVIEW" ? "bg-yellow-100 text-yellow-700"
                : "bg-gray-100 text-gray-600"
                }">
                ${workflowStatus}
                </span>
            </td>
            <td class="p-3 text-center">
                <a href="consultant-customer-details.html?id=${docSnap.id}" class="bg-[#153638] text-white px-3 py-2 rounded-lg text-sm font-semibold hover:bg-[#1d4a4d] transition">
                    View
                </a>
            </td>
        </tr>
        <tr id="${rowId}" class="hidden bg-gray-50 border-b">
            <td colspan="11" class="px-6 pt-2 pb-5">${butiran}</td>
        </tr>
        `;
    }

    // --- 7. PAPARKAN JUMLAH TEPAT KE KOTAK ATAS ---
    document.getElementById("totalClients").innerHTML = totalClients;
    
    document.getElementById("totalClientSales").innerHTML = "RM " + sumTotalSales.toLocaleString("en-US",{
        minimumFractionDigits:2, maximumFractionDigits:2
    });

    document.getElementById("totalCommission").innerHTML = "RM " + sumTotalCommission.toLocaleString("en-US",{
        minimumFractionDigits:2, maximumFractionDigits:2
    });

    document.getElementById("tableBody").innerHTML = html || `
    <tr>
        <td colspan="11" class="p-5 text-center text-gray-500">Tiada client direkodkan.</td>
    </tr>
    `;

});

</script>

</body>
</html>
