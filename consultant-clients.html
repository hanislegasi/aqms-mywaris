<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Clients</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body
class="bg-gray-100 min-h-screen"
style="font-family: Inter, sans-serif;">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">
My Clients
</h1>

</div>

<div class="p-5">

<a
href="consultant-dashboard.html"
class="inline-block bg-gray-200 hover:bg-gray-300 px-5 py-3 rounded-xl font-semibold mb-5">

← Kembali ke Dashboard

</a>

<div
class="grid md:grid-cols-3 gap-4 mb-5">

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500">
Jumlah Client
</p>

<p
id="totalClients"
class="text-3xl font-bold">

0

</p>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500">
Jumlah Sales
</p>

<p
id="totalClientSales"
class="text-3xl font-bold text-green-600">

RM0

</p>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500">
Jumlah Komisen
</p>

<p
id="totalCommission"
class="text-3xl font-bold text-blue-600">

RM0

</p>

</div>

  
</div>
  
<div
id="clientList"
class="overflow-x-auto">

<table class="w-full bg-white rounded-xl overflow-hidden shadow">

<thead class="bg-[#153638] text-white">

<tr>
<th class="p-3 text-left">Bil</th>
<th class="p-3 text-left">Tarikh Daftar</th>
<th class="p-3 text-left">No Ahli</th>
<th class="p-3 text-left">Nama</th>
<th class="p-3 text-left">Telefon</th>
<th class="p-3 text-left">Sales</th>
<th class="p-3 text-left">Komisen</th>
<th class="p-3 text-left">Tarikh Tamat</th>
<th class="p-3 text-center">Status Ahli</th>
<th class="p-3 text-center">Workflow</th>
<th class="p-3 text-center">Tindakan</th>
</tr>

</thead>

<tbody id="tableBody">

<tr>
<td colspan="8" class="p-5 text-center">
Memuatkan...
</td>
</tr>

</tbody>

</table>

</div>

</div>
  

<script type="module">

import { db } from './firebase.js';

import {
collection,
getDocs,
doc,
getDoc,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";




onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const consultantSnap =
await getDoc(
doc(
db,
"consultants",
user.uid
)
);

const consultantData =
consultantSnap.data();

console.log(consultantSnap.exists());
console.log(consultantSnap.data());
console.log(consultantData);
  
const consultantNo = consultantData.consultantNo;

// --- 1. TARIK DATA SETTINGS & LEJER (KOD BARU) ---
const compSnap = await getDoc(doc(db, "settings", "compensation"));
const comp = compSnap.exists() ? compSnap.data() : {};

const priceWasiat = Number(comp.wasiatPrice || 350);
const priceHibah = Number(comp.hibahPrice || 2500);
const priceSepencarian = Number(comp.sepencarianPrice || 800);
const priceMawaris = Number(comp.mawarisPrice || 3000);

let commissionRate = 0;
const lvl = consultantData.consultantLevel;
if(lvl === "AQC") commissionRate = Number(comp.commissionAQC || 35);
else if(lvl === "AQC-AS") commissionRate = Number(comp.commissionAQCAS || 38);
else if(lvl === "AQC-UM") commissionRate = Number(comp.commissionAQCUM || 40);
else if(lvl === "MGAM") commissionRate = Number(comp.commissionMGAM || 45);

// Tarik komisen keseluruhan yang tepat dari Lejer
let exactTotalCommission = 0;
const ledgerQ = query(collection(db, "ledger"), where("consultantNo", "==", consultantNo), where("accountCode", "==", "2000"));
const ledgerSnap = await getDocs(ledgerQ);
ledgerSnap.forEach(d => {
    exactTotalCommission += Number(d.data().credit || 0);
});
// -------------------------------------------------

const snap = await getDocs(collection(db,"users"));
let html = "";
let bil = 1;

let totalClients = 0;
let totalClientSales = 0;

  
for (const docSnap of snap.docs){

const client =
docSnap.data();

console.log({
nama: client.nama,
role: client.role,
memberNo: client.memberNo,
referral: client.referral,
consultantNo: consultantNo
});
  
// SYARAT BARU: Benarkan klien yang belum ada memberNo (Prospek) masuk senarai
if(
    client.role !== "customer" ||
    (client.referral || "").trim() !== consultantNo
){
    continue;
}

let clientSales = 0;
let commission = 0;

// GUNA HARGA DARI SETTINGS
if(client.wasiatPaymentStatus === "paid"){
    clientSales += priceWasiat;
}

if(client.hibahPaymentStatus === "paid"){
    clientSales += priceHibah;
}

if(client.sepencarianPaymentStatus === "paid"){
    clientSales += priceSepencarian;
}

if(client.mawarisPaymentStatus === "paid"){
    clientSales += priceMawaris;
}

// Komisen paparan jadual (Anggaran kasar ikut level terkini)
commission = clientSales * (commissionRate / 100);

totalClients++;
totalClientSales += clientSales;
// Kita tak guna 'totalCommission += commission' lagi sebab kita guna exactTotalCommission dari lejer
  
const expiryDate =
client.expiryDate
? new Date(client.expiryDate)
.toLocaleDateString("ms-MY")
: "-";

const modules = [

{
key:"hibah",
label:"HIBAH"
},

{
key:"wasiat",
label:"WASIAT"
},

{
key:"sepencarian",
label:"SEPENCARIAN"
},

{
key:"mawaris",
label:"MAWARIS"
}

];

let workflowStatus = "PROSPEK";


for(const module of modules){

const moduleSnap = await getDoc(

doc(
db,
"users",
docSnap.id,
module.key,
"maklumat"
)

);

if(moduleSnap.exists()){

const moduleData = moduleSnap.data();

if(moduleData.status){

workflowStatus = moduleData.status;


break;

}

}

}
  
const registerDate =
client.createdAt
? client.createdAt.toDate().toLocaleDateString("ms-MY")
: "-";




  
html += `

<tr class="border-b hover:bg-gray-50">

<td class="p-3">
${bil++}
</td>

<td class="p-3">
${registerDate}
</td>

<td class="p-3">
${client.memberNo || "-"}
</td>

<td class="p-3 font-semibold">
${client.nama || "-"}
</td>

<td class="p-3">
${client.telefon || "-"}
</td>

<td class="p-3 text-right font-semibold text-green-600">
RM${clientSales.toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
})}
</td>

<td class="p-3 text-right font-semibold text-blue-600">
RM${commission.toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
})}
</td>

<td class="p-3">
${expiryDate}
</td>

<td class="p-3 text-center">

<span class="
px-3 py-1 rounded-full text-xs
${
client.wasiatPaymentStatus==="paid" ||
client.hibahPaymentStatus==="paid" ||
client.sepencarianPaymentStatus==="paid" ||
client.mawarisPaymentStatus==="paid"
? "bg-green-100 text-green-700"
: "bg-yellow-100 text-yellow-700"}">


${
client.wasiatPaymentStatus==="paid" ||
client.hibahPaymentStatus==="paid" ||
client.sepencarianPaymentStatus==="paid" ||
client.mawarisPaymentStatus==="paid"
? "AHLI AKTIF"
: "PROSPEK"
}
</span>

</td>

<td class="p-3 text-center">

<span class="
px-3 py-1 rounded-full text-xs font-semibold

${
workflowStatus==="COMPLETED"
? "bg-emerald-100 text-emerald-700"

: workflowStatus==="SENT"
? "bg-blue-100 text-blue-700"

: workflowStatus==="PRINTED"
? "bg-indigo-100 text-indigo-700"

: workflowStatus==="VERIFIED"
? "bg-cyan-100 text-cyan-700"

: workflowStatus==="APPROVED"
? "bg-green-100 text-green-700"

: workflowStatus==="UNDER_REVIEW"
? "bg-yellow-100 text-yellow-700"

: "bg-gray-100 text-gray-600"

}">

${workflowStatus}

</span>

</td>

<td class="p-3 text-center">

<a
href="consultant-customer-details.html?id=${docSnap.id}"
class="bg-[#153638] text-white px-3 py-2 rounded-lg text-sm">

View

</a>

</td>

</tr>

`;
  
}

document.getElementById(
"totalClients"
).innerHTML =
totalClients;

document.getElementById("totalClientSales").innerHTML =
"RM " +
totalClientSales.toLocaleString("en-US",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

document.getElementById("totalCommission").innerHTML =
"RM " +
exactTotalCommission.toLocaleString("en-US",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

  
document.getElementById(
"tableBody"
).innerHTML =
html || `
<tr>
<td colspan="9" class="p-5 text-center">
Tiada client.
</td>
</tr>
`;

});


</script>

</body>
</html>
