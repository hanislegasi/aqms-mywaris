<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Status Pembayaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl text-center">
        <h1 id="statusTajuk" class="text-2xl font-bold text-[#153638] mb-4">Menyemak Pembayaran...</h1>
        <p id="statusMesej" class="text-gray-500">Sila tunggu sebentar. Sistem sedang merekodkan pendaftaran dan komisen. Jangan tutup skrin ini.</p>
    </div>

<script type="module">
    import { db, auth } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, increment, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Tangkap jawapan dari URL ToyyibPay
    const urlParams = new URLSearchParams(window.location.search);
    const status_id = urlParams.get('status_id'); 
    const namaPakej = urlParams.get('pakej');

    // 1. Sediakan pembolehubah dinamik
    let dbStatusField = "";
    let redirectPage = "";
    let lejarAkaun = "";
    let receiptPrefix = ""; 
    let accountCodeValue = "4010";

    if (namaPakej === "Wasiat") {
        dbStatusField = "wasiatPaymentStatus"; redirectPage = "wasiat-page.html"; lejarAkaun = "Sales - Wasiat"; receiptPrefix = "WST"; accountCodeValue = "4010";
    } else if (namaPakej === "Hibah") {
        dbStatusField = "hibahPaymentStatus"; redirectPage = "hibah-page.html"; lejarAkaun = "Sales - Hibah"; receiptPrefix = "HIB"; accountCodeValue = "4020";
    } else if (namaPakej === "Sepencarian") {
        dbStatusField = "sepencarianPaymentStatus"; redirectPage = "sepencarian-page.html"; lejarAkaun = "Sales - Sepencarian"; receiptPrefix = "HSP"; accountCodeValue = "4030";
    } else if (namaPakej === "Mawaris") {
        dbStatusField = "mawarisPaymentStatus"; redirectPage = "mawaris-page.html"; lejarAkaun = "Sales - Mawaris"; receiptPrefix = "MAW"; accountCodeValue = "4040";
    } else if (namaPakej === "Korporat") {
        dbStatusField = "corporatePaymentStatus"; redirectPage = "corporate-page.html"; lejarAkaun = "Sales - Mawaris Korporat"; receiptPrefix = "MCO"; accountCodeValue = "4050";
    } else if (namaPakej === "Korporat Tunggal") {
        dbStatusField = "corporateTunggalPaymentStatus"; redirectPage = "corporate-tunggal-page.html"; lejarAkaun = "Sales - Mawaris Korporat (Milikan Tunggal)"; receiptPrefix = "MCT"; accountCodeValue = "4051";
    } else if (namaPakej === "Korporat Kongsi") {
        dbStatusField = "corporateKongsiPaymentStatus"; redirectPage = "corporate-kongsi-page.html"; lejarAkaun = "Sales - Mawaris Korporat (Rakan Kongsi)"; receiptPrefix = "MCK"; accountCodeValue = "4052";
    } else if (namaPakej === "Korporat Zurri") {
        dbStatusField = "corporateZurriPaymentStatus"; redirectPage = "corporate-zurri-page.html"; lejarAkaun = "Sales - Mawaris Korporat (Wakaf Zurri)"; receiptPrefix = "MCZ"; accountCodeValue = "4053";
    }

    if (status_id === "1") {
        document.getElementById('statusTajuk').innerText = "Pembayaran Berjaya!";
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const currentUser = user;
                const txnDate = new Date(); 
                
                try {
                    const userSnap = await getDoc(doc(db, "users", currentUser.uid));
                    const userData = userSnap.data();

                    if (userData[dbStatusField] === "paid") {
                        window.location.href = redirectPage;
                        return;
                    }

                    // Ambil Harga Semasa
                    const compensationSnap = await getDoc(doc(db, "settings", "compensation"));
                    let compData = {};
                    let saleAmount = 350; 
                    
                    if (compensationSnap.exists()) {
                        compData = compensationSnap.data();
                        if (namaPakej === "Wasiat" && compData.wasiatPrice !== undefined) saleAmount = Number(compData.wasiatPrice);
                        else if (namaPakej === "Hibah" && compData.hibahPrice !== undefined) saleAmount = Number(compData.hibahPrice);
                        else if (namaPakej === "Sepencarian" && compData.sepencarianPrice !== undefined) saleAmount = Number(compData.sepencarianPrice);
                        else if (namaPakej === "Mawaris" && compData.mawarisPrice !== undefined) saleAmount = Number(compData.mawarisPrice);
                        else if (namaPakej === "Korporat" && compData.corporatePrice !== undefined) saleAmount = Number(compData.corporatePrice);
                        else if (namaPakej === "Korporat Tunggal" && compData.corporateTunggalPrice !== undefined) saleAmount = Number(compData.corporateTunggalPrice);
                        else if (namaPakej === "Korporat Kongsi" && compData.corporateKongsiPrice !== undefined) saleAmount = Number(compData.corporateKongsiPrice);
                        else if (namaPakej === "Korporat Zurri" && compData.corporateZurriPrice !== undefined) saleAmount = Number(compData.corporateZurriPrice);
                    }

                    const customer = userData;
                    let refCode = customer.referral || "";
                    let isAqpAgent = false;
                    let aqpAgentData = null;

                    // ==========================================
                    // LOGIK BAHARU: SEMAK JIKA REFERRAL ADALAH EJEN AQP
                    // ==========================================
                    if (refCode) {
                        const qAgent = query(collection(db, "users"), where("role", "==", "aqp_agent"), where("agentCode", "==", refCode));
                        const agentSnap = await getDocs(qAgent);
                        
                        if (!agentSnap.empty) {
                            isAqpAgent = true;
                            aqpAgentData = agentSnap.docs[0].data();
                            aqpAgentData.id = agentSnap.docs[0].id;
                            
                            // TUKAR refCode kepada ID Institusi AQP (contoh: AQP0001)
                            refCode = aqpAgentData.aqpRef; 
                        }
                    }

                    // Ambil senarai konsultan
                    const consultantSnap = await getDocs(collection(db, "consultants"));
                    const allConsultants = [];
                    consultantSnap.forEach((d) => { allConsultants.push({ id: d.id, ...d.data() }); });
                    function findConsultant(no) { return allConsultants.find(u => u.consultantNo === no); }

                    // SEKARANG directConsultant AKAN JUMPA AQP0001
                    const directConsultant = findConsultant(refCode);
                    let currentConsultant = findConsultant(refCode);

                    const refConsultantUid = directConsultant ? directConsultant.id : "-";
                    const refConsultantNo = directConsultant ? directConsultant.consultantNo : "-";

                    // Jana Nombor Ahli Pelanggan
                    const counterRef = doc(db, "system", "counter");
                    const counterSnap = await getDoc(counterRef);
                    let memberNo = userData.memberNo;
                    if (!memberNo) {
                        const currentNo = counterSnap.data().memberCounter || 0;
                        const newNo = currentNo + 1;
                        memberNo = "AQM" + String(newNo).padStart(4, "0");
                        await updateDoc(counterRef, { memberCounter: increment(1) });
                    }

                    // Update Status Pelanggan
                    const updateData = {
                        [dbStatusField]: "paid", 
                        memberSince: txnDate.toISOString(),
                        expiryDate: (() => { const d = new Date(txnDate); d.setFullYear(d.getFullYear() + 1); return d.toISOString(); })()
                    };
                    if (!userData.memberNo) { updateData.memberNo = memberNo; }
                    await updateDoc(doc(db, "users", currentUser.uid), updateData);

                    // Ledger: Credit Sales
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: accountCodeValue, account: lejarAkaun, category: "income", description: memberNo + " " + customer.nama,
                        debit: 0, credit: saleAmount, transactionGroup: memberNo, paymentType: "CUSTOMER", sourceAccount: accountCodeValue, product: namaPakej,
                        clientUid: currentUser.uid, clientNo: memberNo, consultantUid: refConsultantUid, consultantNo: refConsultantNo
                    });

                    // Ledger: Debit Bank
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: "1000", account: "Bank", category: "asset", description: memberNo + " " + customer.nama,
                        debit: saleAmount, credit: 0, paymentType: "CUSTOMER", sourceAccount: accountCodeValue, transactionGroup: memberNo,
                        clientUid: currentUser.uid, clientNo: memberNo, consultantUid: refConsultantUid, consultantNo: refConsultantNo
                    });
                    
                    const comp = compData;
                    let isAQP = (directConsultant && directConsultant.consultantLevel === "AQP") || false;
                    
                    let pctCompany = isAQP ? (comp.companyPoolAQP || 0) : (comp.companyPool || 0);
                    let pctAllowance = isAQP ? (comp.allowanceAQP || 0) : (comp.allowance || 0);
                    let pctAdmin = isAQP ? (comp.adminOperationAQP || 0) : (comp.adminOperation || 0);
                    let pctRoyalty = isAQP ? (comp.royaltyAQP || 0) : (comp.royalty || 0);

                    const company = saleAmount * (pctCompany / 100);
                    const allowance = saleAmount * (pctAllowance / 100);
                    const adminOperation = saleAmount * (pctAdmin / 100);
                    const royalty = saleAmount * (pctRoyalty / 100);
                    const usbAmount = saleAmount * ((comp.usb || 0) / 100);

                    // Company Allocation
                    await addDoc(collection(db, "companyAllocation"), {
                        createdAt: txnDate, memberNo, customerName: customer.nama, product: namaPakej, 
                        sale: saleAmount, company, allowance, adminOperation, royalty, isAQP: isAQP 
                    });
                    
                    function getCleanLevelKey(level) { return (level || "AQC").replace(/[^a-zA-Z0-9]/g, ""); }
                    function getCommissionRate(level) {
                        const key = "commission" + getCleanLevelKey(level); 
                        return comp[key] !== undefined ? comp[key] : 35; 
                    }
                    function getOverrideRate(level) {
                        const key = "override" + getCleanLevelKey(level);
                        return comp[key] !== undefined ? comp[key] : 0;
                    }

                    // UPLINE SPONSOR BENEFIT (USB)
                    const sponsor = directConsultant ? findConsultant(directConsultant.upline) : null;
                    if (sponsor) {
                        await addDoc(collection(db, "ledger"), {
                            date: txnDate, accountCode: "5150", account: "Upline Sponsor Benefit", category: "expense",
                            consultantNo: sponsor.consultantNo, consultantName: sponsor.nama, description: directConsultant.consultantNo + " USB", 
                            debit: usbAmount, credit: 0, transactionGroup: memberNo, paymentType: "USB", fromConsultant: directConsultant.consultantNo,
                            clientUid: currentUser.uid, clientNo: memberNo, consultantUid: sponsor.id, consultantNo: sponsor.consultantNo
                        });

                        await addDoc(collection(db, "ledger"), {
                            date: txnDate, accountCode: "2150", account: "USB Payable", category: "liability",
                            consultantNo: sponsor.consultantNo, consultantName: sponsor.nama, description: directConsultant.consultantNo + " USB", 
                            debit: 0, credit: usbAmount, transactionGroup: memberNo, paymentType: "USB", fromConsultant: directConsultant.consultantNo,
                            clientUid: currentUser.uid, clientNo: memberNo, consultantUid: sponsor.id, consultantNo: sponsor.consultantNo
                        });
                        
                        await updateDoc(doc(db, "consultants", sponsor.id), { totalUSB: increment(usbAmount) });
                    }

                    // DIRECT COMMISSION
                    if (directConsultant) {
                        const commissionRate = getCommissionRate(directConsultant.consultantLevel);
                        const commissionAmount = saleAmount * commissionRate / 100;

                        await addDoc(collection(db, "ledger"), {
                            date: txnDate, accountCode: "5000", account: "Consultant Commission", category: "expense",
                            consultantNo: directConsultant.consultantNo, consultantName: directConsultant.nama, 
                            description: directConsultant.consultantNo + " " + directConsultant.nama, debit: commissionAmount, credit: 0,
                            clientUid: currentUser.uid, clientNo: memberNo, consultantUid: directConsultant.id, consultantNo: directConsultant.consultantNo
                        });

                        await addDoc(collection(db, "ledger"), {
                            date: txnDate, accountCode: "2000", account: "Commission Payable", consultantNo: directConsultant.consultantNo,
                            consultantName: directConsultant.nama, category: "liability", description: directConsultant.consultantNo + " " + directConsultant.nama,
                            debit: 0, credit: commissionAmount,
                            clientUid: currentUser.uid, clientNo: memberNo, consultantUid: directConsultant.id, consultantNo: directConsultant.consultantNo
                        });

                        await updateDoc(doc(db, "consultants", directConsultant.id), {
                            activeClients: increment(1), totalSales: increment(saleAmount), careerSales: increment(saleAmount), totalCommission: increment(commissionAmount)
                        });

                        // ==========================================
                        // LOGIK BAHARU: REKOD KOMISEN EJEN AQP (Di Luar Lejer)
                        // ==========================================
                        if (isAqpAgent && aqpAgentData) {
                            const agentCommPct = Number(aqpAgentData.commissionRate) || 0;
                            const agentCommAmt = saleAmount * (agentCommPct / 100);
                            
                            if (agentCommAmt > 0) {
                                await addDoc(collection(db, "aqpAgentEarnings"), {
                                    createdAt: txnDate,
                                    agentId: aqpAgentData.id,
                                    agentCode: aqpAgentData.agentCode,
                                    agentName: aqpAgentData.nama,
                                    aqpNo: directConsultant.consultantNo, // AQP0001
                                    customerMemberNo: memberNo,
                                    customerName: customer.nama,
                                    product: namaPakej,
                                    saleAmount: saleAmount,
                                    commPercent: agentCommPct,
                                    earnedAmount: agentCommAmt,
                                    status: "UNPAID" // Untuk diuruskan oleh PIC AQP nanti
                                });
                            }
                        }

                        // INTRODUCER
                        if (customer.introducerUid) {
                            try {
                                const introducerDoc = await getDoc(doc(db, "users", customer.introducerUid));
                                let introducerCommRate = 0;
                                if (introducerDoc.exists()) { introducerCommRate = Number(introducerDoc.data().introducerComm) || 0; }

                                if (introducerCommRate > 0) {
                                    let aqcRate = 35; 
                                    const levelAqc = directConsultant.consultantLevel || "AQC";
                                    if (levelAqc === "AQC-UM") { aqcRate = Number(comp.commissionAQCUM) || 40; } 
                                    else if (levelAqc === "AQC-AS") { aqcRate = Number(comp.commissionAQCAS) || 38; } 
                                    else if (levelAqc === "MG-AM" || levelAqc === "MGAM") { aqcRate = Number(comp.commissionMGAM) || 45; } 
                                    else if (levelAqc === "AQP") { aqcRate = Number(comp.commissionAQP) || 35; }
                                    
                                    const aqcCommAmount = saleAmount * (aqcRate / 100);
                                    const introducerAmt = aqcCommAmount * (introducerCommRate / 100);
                                    
                                    if (introducerAmt > 0) {
                                        await addDoc(collection(db, "introducerEarnings"), {
                                            createdAt: txnDate, introducerUid: customer.introducerUid, aqcNo: directConsultant.consultantNo,  
                                            customerMemberNo: memberNo, customerName: customer.nama, product: namaPakej, 
                                            saleAmount: saleAmount, commPercent: introducerCommRate, earnedAmount: introducerAmt, status: "UNPAID" 
                                        });
                                    }
                                }
                            } catch (error) {}
                        }
                    }

                    // ALLOCATION EXPENSES
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: "5200", account: "Allowance Expense", category: "expense", description: "Allowance Allocation", debit: allowance, credit: 0, clientUid: currentUser.uid, clientNo: memberNo
                    });
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: "2200", account: "Allowance Payable", category: "liability", description: "Allowance Allocation", debit: 0, credit: allowance, clientUid: currentUser.uid, clientNo: memberNo
                    });
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: "5300", account: "Royalty Expense", category: "expense", description: "Royalty Allocation", debit: royalty, credit: 0, clientUid: currentUser.uid, clientNo: memberNo
                    });
                    await addDoc(collection(db, "ledger"), {
                        date: txnDate, accountCode: "2300", account: "Royalty Payable", category: "liability", description: "Royalty Allocation", debit: 0, credit: royalty, clientUid: currentUser.uid, clientNo: memberNo
                    });

                   // OVERRIDING
                    while (currentConsultant) {
                        const upline = findConsultant(currentConsultant.upline);
                        if (!upline) break;

                        let overrideRate = 0;

                        // ==========================================
                        // UNDANG-UNDANG BARU (DUNIA AQP vs DUNIA AQC)
                        // ==========================================
                        if (currentConsultant.consultantLevel === "AQP") {
                            // DUNIA AQP: Satu rate % tetap sahaja! (Tarik dari comp.overrideAQP, contoh default 5%)
                            overrideRate = Number(comp.overrideAQP) || 5; 
                        } else {
                            // DUNIA AQC: Guna sistem beza pangkat (Differential)
                            overrideRate = Math.max(0, getOverrideRate(upline.consultantLevel) - getOverrideRate(currentConsultant.consultantLevel));
                        }

                        const overrideAmount = saleAmount * (overrideRate / 100);

                        if (overrideAmount > 0) {
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "5100", account: "Consultant Override", category: "expense", consultantNo: upline.consultantNo, consultantName: upline.nama, description: upline.consultantNo + " " + upline.nama, debit: overrideAmount, credit: 0, clientUid: currentUser.uid, clientNo: memberNo, consultantUid: upline.id, consultantNo: upline.consultantNo
                            });
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "2100", account: "Override Payable", consultantNo: upline.consultantNo, consultantName: upline.nama, category: "liability", description: upline.consultantNo + " " + upline.nama, debit: 0, credit: overrideAmount, clientUid: currentUser.uid, clientNo: memberNo, consultantUid: upline.id, consultantNo: upline.consultantNo
                            });
                            await updateDoc(doc(db, "consultants", upline.id), { careerSales: increment(saleAmount), totalOverriding: increment(overrideAmount) });
                            
                            // Rekod untuk Jadual "My Overriding"
                            await addDoc(collection(db, "overrideHistory"), {
                                createdAt: txnDate, customerNo: memberNo, customerName: customer.nama, fromConsultant: currentConsultant.consultantNo, fromName: currentConsultant.nama, fromLevel: currentConsultant.consultantLevel, receiver: upline.consultantNo, receiverName: upline.nama, receiverLevel: upline.consultantLevel, sales: saleAmount, diffRate: overrideRate, override: overrideAmount
                            });
                        }

                        // PENTING: Hentikan loop jika datang dari AQP 
                        // (Sebab AQP bayar flat rate kepada 1 level uplinenya sahaja)
                        if (currentConsultant.consultantLevel === "AQP") {
                            break; 
                        }

                        currentConsultant = upline;
                    }

                    // CREATE RECEIPT
                    await addDoc(collection(db, "receipts"), {
                        receiptNo: receiptPrefix + "-" + Date.now(), uid: currentUser.uid, memberNo: memberNo, payerName: customer.nama, serviceCode: namaPakej.toUpperCase(), serviceName: "Pendaftaran " + namaPakej, amount: saleAmount, paymentMethod: "ToyyibPay", status: "PAID", paymentDate: txnDate
                    });
                    
                    document.getElementById('statusMesej').innerText = "Selesai! Anda akan dibawa ke dashboard.";
                    setTimeout(() => { window.location.href = redirectPage; }, 2000); 

                } catch (error) {
                    console.error("Ralat merekod data:", error);
                    document.getElementById('statusMesej').innerText = "Ralat merekod data. Sila hubungi admin.";
                    document.getElementById('statusMesej').classList.add("text-red-600");
                }
            }
        });

    } else {
        document.getElementById('statusTajuk').innerText = "Pembayaran Gagal/Batal";
        document.getElementById('statusMesej').innerText = "Sila cuba sebentar lagi.";
        document.getElementById('statusTajuk').classList.add("text-red-600");
        setTimeout(() => { window.location.href = "dashboard.html"; }, 3000);
    }
</script>
</body>
</html>
