<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Akaun</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#f5f7f9] flex items-center justify-center p-5">

  <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl border border-gray-100">
    <h2 class="text-3xl font-bold mb-2 text-center text-[#153638]">
      Login Akaun
    </h2>

    <form id="loginForm" class="space-y-4">
      <input
        id="email"
        type="email"
        placeholder="Email"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]"
        required>

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]"
        required>

      <button
        type="submit"
        class="w-full bg-[#153638] hover:bg-[#1d4a4d] transition text-white py-4 rounded-xl font-semibold shadow-lg">
        Login
      </button>
    </form>

    <!-- Pilihan Pendaftaran (AQM & AQC) -->
    <div class="mt-8 pt-6 border-t border-gray-200">
      <p class="text-sm text-center text-gray-500 mb-4 font-medium">Belum mempunyai akaun? Daftar sekarang:</p>
      
      <div class="flex flex-col gap-3">
        <!-- Butang Daftar AQM (Pelanggan Biasa) -->
        <a href="register.html" class="w-full flex justify-center items-center gap-2 bg-gray-50 hover:bg-gray-100 text-[#153638] border border-gray-300 px-4 py-2.5 rounded-xl font-semibold transition duration-150 shadow-sm">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          Daftar sebagai AQM (Pelanggan)
        </a>

        <!-- Butang Daftar AQC (Perunding) -->
        <a href="consultant-registration.html" class="w-full flex justify-center items-center gap-2 bg-[#d8ae81]/20 hover:bg-[#d8ae81]/30 text-[#8b6528] border border-[#d8ae81]/50 px-4 py-2.5 rounded-xl font-semibold transition duration-150 shadow-sm">
          <svg class="w-5 h-5 text-[#8b6528]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
          Daftar sebagai AQC (Perunding)
        </a>
      </div>
    </div>

 <script type="module">
    // 1. Tarik db dan auth dari fail berpusat (Pendek dan kemas)
    import { db, auth } from './firebase.js';

    // 2. Tarik fungsi yang digunakan sahaja
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login berjaya");

        const uid = auth.currentUser.uid;

        // ==========================================
        // SEMAKAN 1: Adakah dia ADMIN HQ?
        // ==========================================
        const adminRef = doc(db, "admins", uid);
        const adminDoc = await getDoc(adminRef);

        if (adminDoc.exists()) {
          // Jika profilnya wujud dalam koleksi 'admins', terus terbangkan ke Admin Dashboard!
          window.location.href = "admin-dashboard.html";
          return; // Berhentikan fungsi di sini supaya ia tak baca kod di bawah.
        }

        // ==========================================
        // SEMAKAN 2: Jika bukan Admin, dia Perunding atau Pelanggan?
        // ==========================================
        const userRef = doc(db, "users", uid);
        const userDoc = await getDoc(userRef);

        let role = "customer";
        let consultantNo = "";
        let nama = "";

        // Check jika dokumen users wujud
        if (userDoc.exists()) {
          const userData = userDoc.data();
          role = userData.role || "customer";
          consultantNo = userData.consultantNo || "";
          nama = userData.nama || "";
        } else {
          // AUTO-HEAL: Jika users tak wujud, cari dalam consultants
          const consultantRef = doc(db, "consultants", uid);
          const consultantDoc = await getDoc(consultantRef);

          if (consultantDoc.exists()) {
            const consultantData = consultantDoc.data();
            role = "consultant";
            consultantNo = consultantData.consultantNo || "";
            nama = consultantData.nama || "";

            // Cipta semula dokumen yang terpadam di 'users'
            await setDoc(userRef, {
              role: "consultant",
              consultantNo: consultantNo,
              nama: nama
            }, { merge: true });
          } else {
            // Jika tak wujud di mana-mana, jadikan customer biasa
            await setDoc(userRef, {
              role: "customer",
              email: email
            }, { merge: true });
          }
        }

        // 3. Halakan pengguna mengikut role yang sah
        if (role === "consultant") {
          sessionStorage.setItem("consultantNo", consultantNo);
          sessionStorage.setItem("consultantName", nama);
          sessionStorage.setItem("userUid", uid);
          window.location.href = "consultant-dashboard.html";
        } 
        else {
          // Pelanggan biasa pergi ke dashboard portal
          window.location.href = "dashboard.html";
        }

      } catch (error) {
        console.error(error);
        alert("Ralat Log Masuk: " + error.message);
      }
    });
  </script>
</body>
</html>
