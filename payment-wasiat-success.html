<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Status Pembayaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl text-center">
        <h1 id="statusTajuk" class="text-2xl font-bold text-[#153638] mb-4">Menyemak Pembayaran...</h1>
        <p id="statusMesej" class="text-gray-500">Sila tunggu sebentar. Jangan tutup skrin ini.</p>
    </div>

<script type="module">
    import { db, auth } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, increment, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 1. Tangkap jawapan dari URL ToyyibPay
    // Contoh URL yang Toyyibpay bagi: payment-success.html?status_id=1&billcode=WST123...
    const urlParams = new URLSearchParams(window.location.search);
    const status_id = urlParams.get('status_id'); 
    
    // Toyyibpay Code: 1 = Berjaya, 2 = Pending, 3 = Gagal
    if (status_id === "1") {
        document.getElementById('statusTajuk').innerText = "Pembayaran Berjaya!";
        document.getElementById('statusMesej').innerText = "Sistem sedang merekodkan resit dan komisen anda...";
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const currentUser = user;
                const txnDate = new Date(); // Tarikh transaksi berjaya
                
                try {
        const userSnap = await getDoc(doc(db, "users", currentUser.uid));
        const userData = userSnap.data();

        if (userData.wasiatPaymentStatus === "paid") {
            alert("Pembayaran telah direkodkan sebelum ini.");
            window.location.href = "dashboard.html";
            return;
        }

        const counterRef = doc(db, "system", "counter");
        const counterSnap = await getDoc(counterRef);
        const txnDate = new Date();
        
        let memberNo = userData.memberNo;
        if (!memberNo) {
            const currentNo = counterSnap.data().memberCounter || 0;
            const newNo = currentNo + 1;
            memberNo = "AQM" + String(newNo).padStart(4, "0");
            await updateDoc(counterRef, { memberCounter: increment(1) });
        }

        const updateData = {
            wasiatPaymentStatus: "paid",
            memberSince: txnDate.toISOString(),
            expiryDate: (() => {
                const d = new Date(txnDate);
                d.setFullYear(d.getFullYear() + 1);
                return d.toISOString();
            })()
        };

        if (!userData.memberNo) {
            updateData.memberNo = memberNo;
        }

        await updateDoc(doc(db, "users", currentUser.uid), updateData);
        
        const customerSnap = await getDoc(doc(db, "users", currentUser.uid));
        const customer = customerSnap.data();
        
        // Ledger: Credit Sales
        await addDoc(collection(db, "ledger"), {
            date: txnDate,
            accountCode: "4010",
            account: "Sales - Wasiat",
            category: "income",
            description: memberNo + " " + customer.nama,
            debit: 0,
            credit: saleAmount,
            transactionGroup: memberNo,
            paymentType: "CUSTOMER",
            sourceAccount: "4010",
        });

        // Ledger: Debit Bank
        await addDoc(collection(db, "ledger"), {
            date: txnDate,
            accountCode: "1000",
            account: "Bank",
            category: "asset",
            description: memberNo + " " + customer.nama,
            debit: saleAmount,
            credit: 0,
            paymentType: "CUSTOMER",
            sourceAccount: "4010",
            transactionGroup: memberNo
        });
        
        // Ambil tetapan terus dari compData Firestore
        const comp = compData || {};

        const company = saleAmount * ((comp.companyPool || 0) / 100);
        const allowance = saleAmount * ((comp.allowance || 0) / 100);
        const adminOperation = saleAmount * ((comp.adminOperation || 0) / 100);
        const royalty = saleAmount * ((comp.royalty || 0) / 100);
        const usbAmount = saleAmount * ((comp.usb || 0) / 100);

        // Company Allocation
        await addDoc(collection(db, "companyAllocation"), {
            createdAt: txnDate,
            memberNo,
            customerName: customer.nama,
            product: "Wasiat",
            sale: saleAmount,
            company,
            allowance,
            adminOperation,
            royalty
        });

        const consultantSnap = await getDocs(collection(db, "consultants"));
        const allConsultants = [];
        consultantSnap.forEach((d) => {
            allConsultants.push({ id: d.id, ...d.data() });
        });
        
        // ==========================================
        // FUNGSI RATE DINAMIK DARI FIREBASE SETTINGS
        // ==========================================
        function getCleanLevelKey(level) {
            // Tukar contoh: "AQC-AS" -> "AQCAS", "AQC-UM" -> "AQCUM"
            return (level || "AQC").replace(/[^a-zA-Z0-9]/g, "");
        }

        function getCommissionRate(level) {
            const key = "commission" + getCleanLevelKey(level);
            // Mengambil field cth: comp.commissionAQC, comp.commissionAQCAS, dll.
            return comp[key] !== undefined ? comp[key] : 35; 
        }

        function getOverrideRate(level) {
            const key = "override" + getCleanLevelKey(level);
            // Mengambil field cth: comp.overrideAQC, comp.overrideAQCAS, comp.overrideAQCUM, comp.overrideMGAM
            return comp[key] !== undefined ? comp[key] : 0;
        }
        
        function findConsultant(no) {
            return allConsultants.find(u => u.consultantNo === no);
        }

        const directConsultant = findConsultant(customer.referral);
        let currentConsultant = findConsultant(customer.referral);

// UPLINE SPONSOR BENEFIT
        const sponsor = directConsultant ? findConsultant(directConsultant.upline) : null;

        if (sponsor) {
            // 1. Rekod Debit (5150)
            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "5150",
                account: "Upline Sponsor Benefit",
                category: "expense",
                consultantNo: sponsor.consultantNo,
                consultantName: sponsor.nama,
                
                // 🔥 KEMAS KINI 1: Tukar description letak nama Downline
                description: directConsultant.consultantNo + " USB", 
                
                debit: usbAmount,
                credit: 0,
                transactionGroup: memberNo,
                paymentType: "USB",
                
                // 🔥 KEMAS KINI 2: Wajib tambah 'fromConsultant'
                fromConsultant: directConsultant.consultantNo 
            });

            // 2. Rekod Credit (2150) - INI PALING PENTING UNTUK DASHBOARD
            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "2150",
                account: "USB Payable",
                category: "liability",
                consultantNo: sponsor.consultantNo,
                consultantName: sponsor.nama,
                
                // 🔥 KEMAS KINI 1: Tukar description letak nama Downline
                description: directConsultant.consultantNo + " USB", 
                
                debit: 0,
                credit: usbAmount,
                transactionGroup: memberNo,
                paymentType: "USB",
                
                // 🔥 KEMAS KINI 2: Wajib tambah 'fromConsultant'
                fromConsultant: directConsultant.consultantNo 
            });

            await updateDoc(doc(db, "consultants", sponsor.id), {
                totalUSB: increment(usbAmount)
            });
        }

        // DIRECT COMMISSION (DINAMIK DARI DB)
        if (directConsultant) {
            const commissionRate = getCommissionRate(directConsultant.consultantLevel);
            const commissionAmount = saleAmount * commissionRate / 100;

            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "5000",
                account: "Consultant Commission",
                category: "expense",
                consultantNo: directConsultant.consultantNo,
                consultantName: directConsultant.nama,
                description: directConsultant.consultantNo + " " + directConsultant.nama,
                debit: commissionAmount,
                credit: 0
            });

            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "2000",
                account: "Commission Payable",
                consultantNo: directConsultant.consultantNo,
                consultantName: directConsultant.nama,
                category: "liability",
                description: directConsultant.consultantNo + " " + directConsultant.nama,
                debit: 0,
                credit: commissionAmount
            });

            await updateDoc(doc(db, "consultants", directConsultant.id), {
                activeClients: increment(1),
                totalSales: increment(saleAmount),
                careerSales: increment(saleAmount),
                totalCommission: increment(commissionAmount),
            });

// B. Rekod Pendapatan Introducer (HANYA UNTUK NOTA/RUJUKAN AQC SAHAJA)
        if (customer.introducerUid) {
            try {
                // 1. Tarik peratus komisen Introducer dari profil 'users' AQM
                const introducerDoc = await getDoc(doc(db, "users", customer.introducerUid));
                let introducerCommRate = 0;
                
                if (introducerDoc.exists()) {
                    introducerCommRate = Number(introducerDoc.data().introducerComm) || 0;
                }

                // Teruskan pengiraan hanya jika introducer mempunyai peratusan komisen
                if (introducerCommRate > 0) {
                    
                    // 2. Tarik peratus komisen dinamik AQC dari 'settings/compensation'
                    const compSnap = await getDoc(doc(db, "settings", "compensation"));
                    let aqcRate = 35; // Nilai lalai (Default AQC)
                    
                    if (compSnap.exists()) {
                        const compData = compSnap.data();
                        const levelAqc = directConsultant.consultantLevel || "AQC";
                        
                        // Padankan level AQC dengan field dalam database compensation
                        if (levelAqc === "AQC-UM") {
                            aqcRate = Number(compData.commissionAQCUM) || 40;
                        } else if (levelAqc === "AQC-AS") {
                            aqcRate = Number(compData.commissionAQCAS) || 38;
                        } else if (levelAqc === "MG-AM") {
                            aqcRate = Number(compData.commissionMGAM) || 45;
                        } else {
                            aqcRate = Number(compData.commissionAQC) || 35;
                        }
                    }
                    
                    // 3. Kira nilai komisen
                    const aqcCommAmount = saleAmount * (aqcRate / 100);
                    const introducerAmt = aqcCommAmount * (introducerCommRate / 100);
                    
                    if (introducerAmt > 0) {
                        await addDoc(collection(db, "introducerEarnings"), {
                            createdAt: txnDate,
                            introducerUid: customer.introducerUid, 
                            aqcNo: directConsultant.consultantNo,  
                            customerMemberNo: memberNo,            
                            customerName: customer.nama,
                            product: "Wasiat",
                            saleAmount: saleAmount, 
                            commPercent: introducerCommRate, 
                            earnedAmount: introducerAmt, 
                            status: "UNPAID" 
                        });
                    } // Penutup if (introducerAmt > 0)
                } // Penutup if (introducerCommRate > 0)
                
            } catch (error) {
                console.error("Ralat mengira komisen introducer:", error);
            }
        } // Penutup if (customer.introducerUid)
        }
        // ALLOCATION EXPENSES & PAYABLES
        await addDoc(collection(db, "ledger"), {
            date: txnDate, accountCode: "5200", account: "Allowance Expense",
            category: "expense", description: "Allowance Allocation", debit: allowance, credit: 0
        });
        await addDoc(collection(db, "ledger"), {
            date: txnDate, accountCode: "2200", account: "Allowance Payable",
            category: "liability", description: "Allowance Allocation", debit: 0, credit: allowance
        });
        await addDoc(collection(db, "ledger"), {
            date: txnDate, accountCode: "5300", account: "Royalty Expense",
            category: "expense", description: "Royalty Allocation", debit: royalty, credit: 0
        });
        await addDoc(collection(db, "ledger"), {
            date: txnDate, accountCode: "2300", account: "Royalty Payable",
            category: "liability", description: "Royalty Allocation", debit: 0, credit: royalty
        });

        // OVERRIDING LOGIC (DINAMIK DARI DB)
        while (currentConsultant) {
            const upline = findConsultant(currentConsultant.upline);
            if (!upline) break;

            const diffRate = Math.max(0, getOverrideRate(upline.consultantLevel) - getOverrideRate(currentConsultant.consultantLevel));
            const overrideAmount = saleAmount * diffRate / 100;

            if (overrideAmount <= 0) {
                currentConsultant = upline;
                continue;
            }

            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "5100",
                account: "Consultant Override",
                category: "expense",
                consultantNo: upline.consultantNo,
                consultantName: upline.nama,
                description: upline.consultantNo + " " + upline.nama,
                debit: overrideAmount,
                credit: 0
            });

            await addDoc(collection(db, "ledger"), {
                date: txnDate,
                accountCode: "2100",
                account: "Override Payable",
                consultantNo: upline.consultantNo,
                consultantName: upline.nama,
                category: "liability",
                description: upline.consultantNo + " " + upline.nama,
                debit: 0,
                credit: overrideAmount
            });

            await updateDoc(doc(db, "consultants", upline.id), {
                careerSales: increment(saleAmount),
                totalOverriding: increment(overrideAmount)
            });

            await addDoc(collection(db, "overrideHistory"), {
                createdAt: txnDate,
                customerNo: memberNo,
                customerName: customer.nama,
                fromConsultant: currentConsultant.consultantNo,
                fromName: currentConsultant.nama,
                fromLevel: currentConsultant.consultantLevel,
                receiver: upline.consultantNo,
                receiverName: upline.nama,
                receiverLevel: upline.consultantLevel,
                sales: saleAmount,
                diffRate: diffRate,
                override: overrideAmount
            });

            currentConsultant = upline;
        }

        // CREATE PAYMENT RECEIPT
        await addDoc(collection(db, "receipts"), {
            receiptNo: "WST-" + Date.now(),
            uid: currentUser.uid,
            memberNo: memberNo,
            payerName: customer.nama,
            serviceCode: "WASIAT",
            serviceName: "Wasiat Registration",
            amount: saleAmount,
            paymentMethod: "ToyyibPay",
            status: "PAID",
            paymentDate: txnDate
        });
        
        document.getElementById('statusMesej').innerText = "Selesai! Anda akan dibawa ke dashboard.";
                    setTimeout(() => { window.location.href = "wasiat-page.html"; }, 2000);

                } catch (error) {
                    console.error("Ralat merekod data:", error);
                    document.getElementById('statusMesej').innerText = "Ralat merekod data. Sila hubungi admin.";
                    document.getElementById('statusMesej').classList.add("text-red-600");
                }
            }
        });

    } else {
        document.getElementById('statusTajuk').innerText = "Pembayaran Gagal/Batal";
        document.getElementById('statusMesej').innerText = "Sila cuba sebentar lagi.";
        document.getElementById('statusTajuk').classList.add("text-red-600");
        
        setTimeout(() => { window.location.href = "dashboard.html"; }, 3000);
    }
</script>
</body>
</html>
