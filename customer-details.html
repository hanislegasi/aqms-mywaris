<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">

  <!-- HEADER -->
  <div class="bg-[#153638] text-white p-5 shadow">
    <h1 class="text-2xl font-bold">Customer Details</h1>
    <p class="text-gray-200">Admin Review Center</p>
  </div>

  <!-- CONTENT -->
  <div class="p-5">
    <a href="admin-aqm.html" class="inline-block mb-5 bg-gray-200 hover:bg-gray-300 transition text-gray-700 px-5 py-3 rounded-xl font-semibold">
      ← Kembali ke Admin Dashboard
    </a>
      
    <div id="customerInfo" class="bg-white rounded-2xl shadow p-6">
      <p class="text-gray-500">Memuatkan data...</p>
    </div>
  </div>

  <script type="module">
   // 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 3. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const userDoc = await getDoc(doc(db, "users", user.uid));
      const userData = userDoc.data();

      if (userData?.role !== "admin") {
        alert("Akses ditolak");
        window.location.href = "index.html";
      }
    });

    // GET ID
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");

    if (userId) {
      // ===== Workflow Status =====
      let wasiatStatus = "BELUM DIISI";
      let hibahStatus = "BELUM DIISI";
      let sepencarianStatus = "BELUM DIISI";
      let mawarisStatus = "BELUM DIISI";
      let corporateStatus = "BELUM DIISI";

      // LOAD USER
      const docSnap = await getDoc(doc(db, "users", userId));

      if (docSnap.exists()) {
        const user = docSnap.data();
        let consultantData = {};

        if (user.referral) {
          const consultantQuery = query(
            collection(db, "consultants"),
            where("consultantNo", "==", user.referral)
          );
          const consultantSnap = await getDocs(consultantQuery);
          if (!consultantSnap.empty) {
            consultantData = consultantSnap.docs[0].data();
          }
        }

// ===== DELIVERY ALERT (FUNGSI BARU) =====
      function getDeliveryAlert(data) {
        if (!data.deliveryChoice) return ""; // Jika pelanggan belum buat pilihan

        if (data.deliveryChoice === "existing") {
            return `<div class="mb-4 bg-gray-50 text-gray-700 px-3 py-2 rounded-lg border border-gray-200 text-sm">📮 <b>Pos ke Alamat Asal</b></div>`;
        } else if (data.deliveryChoice === "new") {
            return `<div class="mb-4 bg-red-50 text-red-700 px-3 py-2 rounded-lg border border-red-200 text-sm">📮 <b>Pos ke Alamat Baru:</b><br><span class="text-gray-800">${data.deliveryAddress || "-"}</span></div>`;
        } else if (data.deliveryChoice === "consultant") {
            return `<div class="mb-4 bg-blue-50 text-blue-700 px-3 py-2 rounded-lg border border-blue-200 text-sm">🤝 <b>Serahan Tangan (Oleh Perunding)</b></div>`;
        }
        return "";
      }
        
        // WASIAT STATUS
        const wasiatSnap = await getDoc(doc(db, "users", userId, "wasiat", "maklumat"));
        let wasiatData = {};
        let wasiatDocRef = "-";
        let wasiatApprovedDate = "-";
        let wasiatExpiryDate = "-";
        let wasiatBakiHari = 0;
        let wasiatPrintedAt = null;
        let wasiatSentAt = null;
        let wasiatCompletedAt = null;
        let wasiatDeliveryMethod = "";
        let wasiatCourier = "";
        let wasiatTrackingNo = "";
        let wasiatReceiver = "";
        let wasiatRemarks = "";
        let wasiatAkadDate = "";
        let wasiatAkadTime = "";
        let wasiatStampDate = "";
        let wasiatStampRef = "";
        let wasiatHandoverDate = "";
        let wasiatHandoverRemarks = "";
        let wasiatReceivedDate = "";
          
        if (wasiatSnap.exists()) {
          wasiatData = wasiatSnap.data();
          wasiatPrintedAt = wasiatData.printedAt || null;
          wasiatSentAt = wasiatData.sentAt || null;
          wasiatAkadDate = wasiatData.akadDate || "";
          wasiatAkadTime = wasiatData.akadTime || "";
          wasiatStampDate = wasiatData.stampingDate || "";
          wasiatStampRef = wasiatData.stampingRef || "";
          wasiatHandoverDate = wasiatData.handoverDate || "";
          wasiatHandoverRemarks = wasiatData.handoverRemarks || "";
          wasiatReceivedDate = wasiatData.receivedDate || "";
          wasiatCompletedAt = wasiatData.completedAt || null;
          wasiatDeliveryMethod = wasiatData.deliveryMethod || "";
          wasiatCourier = wasiatData.courier || "";
          wasiatTrackingNo = wasiatData.trackingNo || "";
          wasiatReceiver = wasiatData.receiver || "";
          wasiatRemarks = wasiatData.remarks || "";
          wasiatStatus = wasiatData.status || "DRAFT";
          wasiatDocRef = wasiatData.docRef || "-";
          wasiatApprovedDate = wasiatData.approvedAt ? new Date(wasiatData.approvedAt).toLocaleDateString("ms-MY") : "-";
          wasiatExpiryDate = wasiatData.expiryDate ? new Date(wasiatData.expiryDate).toLocaleDateString("ms-MY") : "-";
          wasiatBakiHari = wasiatExpiryDate !== "-" ? Math.ceil((new Date(wasiatData.expiryDate) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
        }

        // HIBAH STATUS
        const hibahSnap = await getDoc(doc(db, "users", userId, "hibah", "maklumat"));
        let hibahData = {};
        let hibahDocRef = "-";
        let hibahApprovedDate = "-";
        let hibahExpiryDate = "-";
        let hibahBakiHari = 0;
        let hibahPrintedAt = null;
        let hibahSentAt = null;
        let hibahCompletedAt = null;
        let hibahDeliveryMethod = "";
        let hibahCourier = "";
        let hibahTrackingNo = "";
        let hibahReceiver = "";
        let hibahRemarks = "";
        let hibahAkadDate = "";
        let hibahAkadTime = "";
        let hibahStampDate = "";
        let hibahStampRef = "";
        let hibahHandoverDate = "";
        let hibahHandoverRemarks = "";
        let hibahReceivedDate = "";
          
        if (hibahSnap.exists()) {
          hibahData = hibahSnap.data();
          hibahPrintedAt = hibahData.printedAt || null;
          hibahSentAt = hibahData.sentAt || null;
          hibahAkadDate = hibahData.akadDate || "";
          hibahAkadTime = hibahData.akadTime || "";
          hibahStampDate = hibahData.stampingDate || "";
          hibahStampRef = hibahData.stampingRef || "";
          hibahHandoverDate = hibahData.handoverDate || "";
          hibahHandoverRemarks = hibahData.handoverRemarks || "";
          hibahReceivedDate = hibahData.receivedDate || "";  
          hibahCompletedAt = hibahData.completedAt || null;
          hibahDeliveryMethod = hibahData.deliveryMethod || "";
          hibahCourier = hibahData.courier || "";
          hibahTrackingNo = hibahData.trackingNo || "";
          hibahReceiver = hibahData.receiver || "";
          hibahRemarks = hibahData.remarks || "";  
          hibahStatus = hibahData.status || "DRAFT";
          hibahDocRef = hibahData.docRef || "-";
          hibahApprovedDate = hibahData.approvedAt ? new Date(hibahData.approvedAt).toLocaleDateString("ms-MY") : "-";
          hibahExpiryDate = hibahData.expiryDate ? new Date(hibahData.expiryDate).toLocaleDateString("ms-MY") : "-";
          hibahBakiHari = hibahExpiryDate !== "-" ? Math.ceil((new Date(hibahData.expiryDate) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
        }

        // SEPENCARIAN STATUS
        const sepencarianSnap = await getDoc(doc(db, "users", userId, "sepencarian", "maklumat"));
        let sepencarianData = {};
        let sepencarianDocRef = "-";
        let sepencarianApprovedDate = "-";
        let sepencarianExpiryDate = "-";
        let sepencarianBakiHari = 0;
        let sepencarianPrintedAt = null;
        let sepencarianSentAt = null;
        let sepencarianCompletedAt = null;
        let sepencarianDeliveryMethod = "";
        let sepencarianCourier = "";
        let sepencarianTrackingNo = "";
        let sepencarianReceiver = "";
        let sepencarianRemarks = "";
        let sepencarianAkadDate = "";
        let sepencarianAkadTime = "";
        let sepencarianStampDate = "";
        let sepencarianStampRef = "";
        let sepencarianHandoverDate = "";
        let sepencarianHandoverRemarks = "";
        let sepencarianReceivedDate = "";
          
        if (sepencarianSnap.exists()) {
          sepencarianData = sepencarianSnap.data();
          sepencarianPrintedAt = sepencarianData.printedAt || null;
          sepencarianSentAt = sepencarianData.sentAt || null;
          sepencarianAkadDate = sepencarianData.akadDate || "";
          sepencarianAkadTime = sepencarianData.akadTime || "";
          sepencarianStampDate = sepencarianData.stampingDate || "";
          sepencarianStampRef = sepencarianData.stampingRef || "";
          sepencarianHandoverDate = sepencarianData.handoverDate || "";
          sepencarianHandoverRemarks = sepencarianData.handoverRemarks || "";
          sepencarianReceivedDate = sepencarianData.receivedDate || "";
          sepencarianCompletedAt = sepencarianData.completedAt || null;
          sepencarianDeliveryMethod = sepencarianData.deliveryMethod || "";
          sepencarianCourier = sepencarianData.courier || "";
          sepencarianTrackingNo = sepencarianData.trackingNo || "";
          sepencarianReceiver = sepencarianData.receiver || "";
          sepencarianRemarks = sepencarianData.remarks || "";
          sepencarianStatus = sepencarianData.status || "DRAFT";
          sepencarianDocRef = sepencarianData.docRef || "-";
          sepencarianApprovedDate = sepencarianData.approvedAt ? new Date(sepencarianData.approvedAt).toLocaleDateString("ms-MY") : "-";
          sepencarianExpiryDate = sepencarianData.expiryDate ? new Date(sepencarianData.expiryDate).toLocaleDateString("ms-MY") : "-";
          sepencarianBakiHari = sepencarianExpiryDate !== "-" ? Math.ceil((new Date(sepencarianData.expiryDate) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
        }

        // MAWARIS STATUS
        const mawarisSnap = await getDoc(doc(db, "users", userId, "mawaris", "maklumat"));
        let mawarisData = {};
        let mawarisDocRef = "-";
        let mawarisApprovedDate = "-";
        let mawarisExpiryDate = "-";
        let mawarisBakiHari = 0;
        let mawarisPrintedAt = null;
        let mawarisSentAt = null;
        let mawarisCompletedAt = null;
        let mawarisDeliveryMethod = "";
        let mawarisCourier = "";
        let mawarisTrackingNo = "";
        let mawarisReceiver = "";
        let mawarisRemarks = "";
        let mawarisAkadDate = "";
        let mawarisAkadTime = "";
        let mawarisStampDate = "";
        let mawarisStampRef = "";
        let mawarisHandoverDate = "";
        let mawarisHandoverRemarks = "";
        let mawarisReceivedDate = "";
          
        if (mawarisSnap.exists()) {
          mawarisData = mawarisSnap.data();
          mawarisPrintedAt = mawarisData.printedAt || null;
          mawarisSentAt = mawarisData.sentAt || null;
          mawarisAkadDate = mawarisData.akadDate || "";
          mawarisAkadTime = mawarisData.akadTime || "";
          mawarisStampDate = mawarisData.stampingDate || "";
          mawarisStampRef = mawarisData.stampingRef || "";
          mawarisHandoverDate = mawarisData.handoverDate || "";
          mawarisHandoverRemarks = mawarisData.handoverRemarks || "";
          mawarisReceivedDate = mawarisData.receivedDate || "";
          mawarisCompletedAt = mawarisData.completedAt || null;
          mawarisDeliveryMethod = mawarisData.deliveryMethod || "";
          mawarisCourier = mawarisData.courier || "";
          mawarisTrackingNo = mawarisData.trackingNo || "";
          mawarisReceiver = mawarisData.receiver || "";
          mawarisRemarks = mawarisData.remarks || "";
          mawarisStatus = mawarisData.status || "DRAFT";
          mawarisDocRef = mawarisData.docRef || "-";
          mawarisApprovedDate = mawarisData.approvedAt ? new Date(mawarisData.approvedAt).toLocaleDateString("ms-MY") : "-";
          mawarisExpiryDate = mawarisData.expiryDate ? new Date(mawarisData.expiryDate).toLocaleDateString("ms-MY") : "-";
          mawarisBakiHari = mawarisExpiryDate !== "-" ? Math.ceil((new Date(mawarisData.expiryDate) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
        }

        // CORPORATE STATUS
        const corporateSnap = await getDoc(doc(db, "users", userId, "corporate", "maklumat"));
        let corporateData = {};
        let corporateDocRef = "-";
        let corporateApprovedDate = "-";
        let corporateExpiryDate = "-";
        let corporateBakiHari = 0;
        let corporatePrintedAt = null;
        let corporateSentAt = null;
        let corporateCompletedAt = null;
        let corporateDeliveryMethod = "";
        let corporateCourier = "";
        let corporateTrackingNo = "";
        let corporateReceiver = "";
        let corporateRemarks = "";
        let corporateAkadDate = "";
        let corporateAkadTime = "";
        let corporateStampDate = "";
        let corporateStampRef = "";
        let corporateHandoverDate = "";
        let corporateHandoverRemarks = "";
        let corporateReceivedDate = "";
          
        if (corporateSnap.exists()) {
          corporateData = corporateSnap.data();
          corporatePrintedAt = corporateData.printedAt || null;
          corporateSentAt = corporateData.sentAt || null;
          corporateAkadDate = corporateData.akadDate || "";
          corporateAkadTime = corporateData.akadTime || "";
          corporateStampDate = corporateData.stampingDate || "";
          corporateStampRef = corporateData.stampingRef || "";
          corporateHandoverDate = corporateData.handoverDate || "";
          corporateHandoverRemarks = corporateData.handoverRemarks || "";
          corporateReceivedDate = corporateData.receivedDate || "";
          corporateCompletedAt = corporateData.completedAt || null;
          corporateDeliveryMethod = corporateData.deliveryMethod || "";
          corporateCourier = corporateData.courier || "";
          corporateTrackingNo = corporateData.trackingNo || "";
          corporateReceiver = corporateData.receiver || "";
          corporateRemarks = corporateData.remarks || "";
          corporateStatus = corporateData.status || "DRAFT";
          corporateDocRef = corporateData.docRef || "-";
          corporateApprovedDate = corporateData.approvedAt ? new Date(corporateData.approvedAt).toLocaleDateString("ms-MY") : "-";
          corporateExpiryDate = corporateData.expiryDate ? new Date(corporateData.expiryDate).toLocaleDateString("ms-MY") : "-";
          corporateBakiHari = corporateExpiryDate !== "-" ? Math.ceil((new Date(corporateData.expiryDate) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
        }

        const products = [
          { name: "Wasiat", snap: wasiatSnap, status: wasiatStatus, docRef: wasiatDocRef, preview: "preview-wasiat.html" },
          { name: "Hibah", snap: hibahSnap, status: hibahStatus, docRef: hibahDocRef, preview: "preview-hibah.html" },
          { name: "Harta Sepencarian", snap: sepencarianSnap, status: sepencarianStatus, docRef: sepencarianDocRef, preview: "preview-sepencarian.html" },
          { name: "Mawaris", snap: mawarisSnap, status: mawarisStatus, docRef: mawarisDocRef, preview: "preview-mawaris.html" },
          { name: "Mawaris Korporat", snap: corporateSnap, status: corporateStatus, docRef: corporateDocRef, preview: "preview-corporate.html" }
        ];

        const activeProduct = products.find(product => product.snap.exists());

       const currentCollection = activeProduct
          ? (activeProduct.name === "Wasiat" ? "wasiat" : 
             activeProduct.name === "Hibah" ? "hibah" : 
             activeProduct.name === "Harta Sepencarian" ? "sepencarian" : 
             activeProduct.name === "Mawaris" ? "mawaris" : "corporate")
          : "wasiat";

        document.getElementById("customerInfo").innerHTML = `
          <div class="space-y-6">
            <div>
              <h2 class="text-3xl font-bold text-[#153638]">${user.nama || "-"}</h2>
              <p class="text-gray-500">${user.email || "-"}</p>

              <div class="bg-gray-50 rounded-xl p-5 mt-5">
                <h3 class="font-bold mb-3">Maklumat Keahlian</h3>
                <div class="grid grid-cols-2 gap-4">
                  <div><p class="text-gray-500 text-sm">No Ahli</p><p id="memberNo"></p></div>
                  <div><p class="text-gray-500 text-sm">Tarikh Daftar</p><p id="memberSince"></p></div>
                  <div><p class="text-gray-500 text-sm">Alamat</p><p id="alamatRingkas"></p></div>
                  <div><p class="text-gray-500 text-sm">Telefon</p><p id="telefon"></p></div>
                  <div><p class="text-gray-500 text-sm">Kod Referral</p><p id="referral"></p></div>
                  <div><p class="text-gray-500 text-sm">Referral</p><p id="consultantName"></p></div>
                  <div><p class="text-gray-500 text-sm">Telefon Perunding</p><p id="consultantPhone"></p></div>
                  <div><p class="text-gray-500 text-sm">Status</p><p id="memberStatus"></p></div>
                </div>

                ${wasiatSnap.exists() ? `
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-6">
                  <div class="bg-green-50 border border-green-200 rounded-xl p-5 flex flex-col">
                    <h3 class="text-xl font-bold text-green-700 mb-4">Wasiat</h3>
                    <p class="text-sm text-gray-500">No Dokumen</p>
                    <p class="font-semibold mb-3">${wasiatDocRef}</p>
                    <p class="text-sm text-gray-500">Status</p>
                    <p class="font-semibold mb-6">${wasiatStatus}</p>
                    <a href="admin-preview-wasiat.html?id=${userId}" target="_blank" class="mt-auto block text-center bg-[#153638] hover:bg-[#1d4a4d] text-white py-3 rounded-xl font-semibold">👁 View Dokumen</a>
                  </div>

                  <div class="bg-white border rounded-xl p-5 flex flex-col">
                    <h3 class="text-xl font-bold text-blue-700 mb-4">PRINT</h3>
                    <label class="block text-sm mb-2">Tarikh & Masa Cetak</label>
                    <input type="datetime-local" id="wasiatPrintedAt" value="${wasiatPrintedAt ? wasiatPrintedAt.substring(0, 16) : ""}" ${wasiatStatus === "PRINTED" || wasiatStatus === "SENT" ? "disabled" : ""} class="w-full border rounded-lg p-2">
                    <button id="btnPrintWasiat" class="mt-auto w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl">✔ Tandakan Dicetak</button>
                  </div>

                  <div class="bg-white border rounded-xl p-5 flex flex-col">
                    <h3 class="text-xl font-bold text-orange-600 mb-4">SEND</h3>
                    ${getDeliveryAlert(wasiatData)}
                    <label class="block text-sm mb-2">Tarikh & Masa Hantar</label>
                    <input type="datetime-local" id="wasiatSentAt" value="${wasiatSentAt ? wasiatSentAt.substring(0, 16) : ""}" ${wasiatStatus === "SENT" ? "disabled" : ""} class="w-full border rounded-lg p-2 mb-2">
                    <input id="wasiatCourier" class="w-full border rounded-lg p-2 mb-2" placeholder="Courier" value="${wasiatCourier}">
                    <input id="wasiatTrackingNo" class="w-full border rounded-lg p-2 mb-2" placeholder="Tracking No" value="${wasiatTrackingNo}">
                    <input id="wasiatReceiver" class="w-full border rounded-lg p-2 mb-2" placeholder="Receiver" value="${wasiatReceiver}">
                    <textarea id="wasiatRemarks" class="w-full border rounded-lg p-2 mb-3" rows="3" placeholder="Remarks">${wasiatRemarks}</textarea>
                    <button id="btnSendWasiat" class="mt-auto w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl">✔ Tandakan Dihantar</button>
                  </div>

                  <div class="bg-white border rounded-xl p-5 flex flex-col">
                    <h3 class="text-xl font-bold text-green-700 mb-4">COMPLETE</h3>
                    <p class="text-sm text-gray-500">Tarikh Akad</p>
                    <p class="font-semibold">${wasiatAkadDate || "-"} ${wasiatAkadTime || ""}</p>
                    <hr class="my-3">
                    <p class="text-sm text-gray-500">Stamping</p>
                    <p class="font-semibold">${wasiatStampDate || "-"}</p>

                    <hr class="my-3">
                    <p class="text-sm text-gray-500">Diserahkan Kepada AQM</p>
                    <p class="font-semibold">${wasiatHandoverDate || "-"}</p>
                    <p class="text-sm">${wasiatHandoverRemarks || ""}</p>
                    <hr class="my-3">
                    <p class="text-sm text-gray-500">AQM Terima Dokumen</p>
                    <p class="font-semibold text-green-700">${wasiatReceivedDate || "-"}</p>
                    <hr class="my-3">
                    <button id="btnCompleteWasiat" class="mt-auto w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl">✔ Lengkapkan</button>
                  </div>
                </div>
                ` : ""}

                ${hibahSnap.exists() ? `
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-6">
                  <div class="bg-green-50 border border-green-200 rounded-xl p-5 flex flex-col">
                    <h3 class="text-xl font-bold text-green-700 mb-4">Hibah</h3>

                    <a href="admin-preview-hibah.html?id=${userId}" target="_blank" class="mt-auto block text-center bg-[#153638] hover:bg-[#1d4a4d] text-white py-3 rounded-xl font-semibold">👁 View Dokumen</a>
