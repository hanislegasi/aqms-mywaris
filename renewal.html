<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembaharuan Keahlian - AQM</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { primary: '#153638' }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5 font-sans">

  <!-- Kad Utama: rounded-2xl[cite: 1] -->
  <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-primary mb-2">
      Pembaharuan Keahlian
    </h1>
    <p class="text-gray-500 mb-6">
      Lanjutkan keahlian produk anda selama 1 tahun
    </p>

    <!-- Status Loading -->
    <div id="loadingBox" class="text-center py-8 text-gray-500 font-semibold">
      Menyemak maklumat & harga terkini...
    </div>

    <!-- Konten Utama -->
    <div id="mainContent" class="hidden">
      <!-- Dropdown (Hanya muncul jika customer miliki > 1 produk) -->
      <div id="multiProductBox" class="mb-6 hidden">
        <label for="productSelect" class="block text-sm font-semibold text-gray-700 mb-2">
          Pilih Produk Untuk Diperbaharui
        </label>
        <select 
          id="productSelect" 
          class="w-full p-3.5 bg-gray-50 border border-gray-300 rounded-xl font-semibold text-primary focus:outline-none focus:ring-2 focus:ring-primary transition">
        </select>
      </div>

      <!-- Ringkasan Bayaran -->
      <div class="bg-gray-100 rounded-2xl p-5 mb-8">
        <div class="flex justify-between mb-3">
          <span class="text-gray-600">Produk</span>
          <span id="displayProductName" class="font-semibold text-primary">
            -
          </span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600">Jumlah</span>
          <span id="displayProductFee" class="text-2xl font-bold text-primary">
            RM0
          </span>
        </div>
      </div>

      <!-- Butang: rounded-xl[cite: 1] -->
      <button
        id="payBtn"
        class="w-full bg-[#153638] hover:bg-[#1d4a4d] transition text-white py-4 rounded-xl font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
        Bayar Sekarang
      </button>
    </div>

    <!-- Mesej Jika Tiada Produk -->
    <div id="noProductBox" class="hidden text-center py-6 text-red-600 font-semibold">
      Anda tiada produk aktif untuk diperbaharui.
    </div>
  </div>

  <script type="module">
// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import { 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import { 
    doc, 
    updateDoc, 
    getDoc, 
    addDoc, 
    collection 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let currentUser = null;
    let ownedProducts = [];
    let compSettings = {};

    // Konfigurasi 4 Produk AQMS dipadankan dengan Code COA & Field Settings
    const productConfig = {
      wasiat: {
        name: "Wasiat",
        code: "WASIAT_RENEWAL",
        prefix: "WAS",
        feeField: "wasiatRenewal",
        accountCode: "4210" // Selaras dengan doc 4210 dalam chartOfAccounts
      },
      hibah: {
        name: "Hibah",
        code: "HIBAH_RENEWAL",
        prefix: "HIB",
        feeField: "hibahRenewal",
        accountCode: "4220"
      },
      sepencarian: {
        name: "Harta Sepencarian",
        code: "SEPENCARIAN_RENEWAL",
        prefix: "SEP",
        feeField: "sepencarianRenewal",
        accountCode: "4230"
      },
      mawaris: {
        name: "Mawaris",
        code: "MAWARIS_RENEWAL",
        prefix: "MAW",
        feeField: "mawarisRenewal",
        accountCode: "4240"
      },
       mawaris: {
        name: "Mawaris Korporat",
        code: "CORPORATE_RENEWAL",
        prefix: "MCO",
        feeField: "corporateRenewal",
        accountCode: "4250"
      }
    };

    const loadingBox = document.getElementById("loadingBox");
    const mainContent = document.getElementById("mainContent");
    const noProductBox = document.getElementById("noProductBox");
    const multiProductBox = document.getElementById("multiProductBox");
    const productSelect = document.getElementById("productSelect");
    const displayProductName = document.getElementById("displayProductName");
    const displayProductFee = document.getElementById("displayProductFee");
    const payBtn = document.getElementById("payBtn");

    function getProductFee(key) {
      const fieldName = productConfig[key].feeField;
      return compSettings[fieldName] || 0;
    }

    function updateDisplay(key) {
      const selected = productConfig[key];
      const fee = getProductFee(key);
      displayProductName.textContent = `${selected.name} Renewal`;
      displayProductFee.textContent = `RM${fee}`;
    }

    productSelect.addEventListener("change", (e) => {
      updateDisplay(e.target.value);
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await initPageData();
    });

    async function initPageData() {
      try {
        const compSnap = await getDoc(doc(db, "settings", "compensation"));
        if (compSnap.exists()) {
          compSettings = compSnap.data();
        }

        const keys = Object.keys(productConfig);
        const checks = await Promise.all(
          keys.map(key => getDoc(doc(db, "users", currentUser.uid, key, "maklumat")))
        );

        ownedProducts = [];
        checks.forEach((snap, idx) => {
          if (snap.exists()) {
            ownedProducts.push(keys[idx]);
          }
        });

        loadingBox.classList.add("hidden");

        if (ownedProducts.length === 0) {
          noProductBox.classList.remove("hidden");
          return;
        }

        mainContent.classList.remove("hidden");

        const urlParams = new URLSearchParams(window.location.search);
        const urlParamProduct = urlParams.get("product");
        let defaultKey = ownedProducts[0];

        if (urlParamProduct && ownedProducts.includes(urlParamProduct)) {
          defaultKey = urlParamProduct;
        }

        if (ownedProducts.length === 1) {
          multiProductBox.classList.add("hidden");
          updateDisplay(defaultKey);
          productSelect.innerHTML = `<option value="${defaultKey}" selected>${productConfig[defaultKey].name}</option>`;
        } else {
          multiProductBox.classList.remove("hidden");
          productSelect.innerHTML = ownedProducts.map(key => 
            `<option value="${key}" ${key === defaultKey ? 'selected' : ''}>${productConfig[key].name}</option>`
          ).join("");
          updateDisplay(defaultKey);
        }
      } catch (error) {
        console.error("Ralat memuatkan data:", error);
        loadingBox.innerText = "Gagal memuatkan data. Sila refresh halaman.";
      }
    }

    // 3. Proses Pembaharuan & Rekod Ledger Mengikut COA Firestore
    payBtn.addEventListener("click", async () => {
      if (!currentUser) return;

      const selectedKey = productSelect.value;
      const config = productConfig[selectedKey];
      const renewalFee = getProductFee(selectedKey);

      if (renewalFee <= 0) {
        alert("Ralat pada nilai pembaharuan. Sila hubungi pihak admin.");
        return;
      }

      try {
        payBtn.disabled = true;
        payBtn.textContent = "Memproses...";

        // 1. Tarik maklumat Pengguna
        const userSnap = await getDoc(doc(db, "users", currentUser.uid));
        const userData = userSnap.exists() ? userSnap.data() : {};

        // 2. Tarik spesifikasi COA untuk Akaun Income (contoh: 4210) & Bank (1000)
        const [incomeCoaSnap, bankCoaSnap] = await Promise.all([
          getDoc(doc(db, "chartOfAccounts", config.accountCode)),
          getDoc(doc(db, "chartOfAccounts", "1000"))
        ]);

        const incomeCoa = incomeCoaSnap.exists() ? incomeCoaSnap.data() : {
          name: `${config.name} Renewal`,
          category: "Service Revenue",
          type: "Income"
        };

        const bankCoa = bankCoaSnap.exists() ? bankCoaSnap.data() : {
          name: "Bank",
          category: "Current Asset",
          type: "Asset"
        };

        const productDocRef = doc(db, "users", currentUser.uid, selectedKey, "maklumat");

        const validityDays = compSettings.memberValidity || 365;
        let expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + validityDays);

        // 3. Update tarikh luput pada subcollection produk[cite: 1]
        await updateDoc(productDocRef, {
          expiryDate: expiryDate.toISOString(),
          renewedAt: new Date().toISOString()
        });

        // 4. Rekod Ledger: Kredit (Income selaras dengan COA)
        await addDoc(collection(db, "ledger"), {
          date: new Date(),
          accountCode: config.accountCode, // 4210 / 4220 / 4230 / 4240
          account: incomeCoa.name,         // Contoh: "Renewal Wasiat" dari Firestore
          category: incomeCoa.category,    // Contoh: "Service Revenue" dari Firestore
          description: `${config.name} Membership Renewal`,
          debit: 0,
          credit: renewalFee,
          paymentType: "CUSTOMER",
          sourceAccount: config.accountCode,
          transactionGroup: currentUser.uid
        });

        // 5. Rekod Ledger: Debit (Bank selaras dengan COA)
        await addDoc(collection(db, "ledger"), {
          date: new Date(),
          accountCode: "1000",
          account: bankCoa.name,           // "Bank" dari Firestore
          category: bankCoa.category,      // Kategori tepat dari Firestore
          description: `${config.name} Membership Renewal`,
          debit: renewalFee,
          credit: 0,
          paymentType: "CUSTOMER",
          sourceAccount: config.accountCode,
          transactionGroup: currentUser.uid
        });

        // 6. Rekod Resit[cite: 1]
        await addDoc(collection(db, "receipts"), {
          receiptNo: `${config.prefix}-REN-${Date.now()}`,
          uid: currentUser.uid,
          payerName: userData.nama || "-",
          customerPhone: userData.telefon || "",
          serviceCode: config.code,
          serviceName: `${config.name} Membership Renewal`,
          amount: renewalFee,
          paymentMethod: "ToyyibPay",
          status: "PAID",
          paymentDate: new Date()
        });

        alert(`Keahlian ${config.name} berjaya diperbaharui sehingga ${expiryDate.toLocaleDateString("ms-MY")}`);
        window.location.href = "dashboard.html";

      } catch (error) {
        console.error("Ralat pembaharuan:", error);
        alert("Berlaku ralat semasa memproses data. Sila cuba lagi.");
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = "Bayar Sekarang";
      }
    });
  </script>
</body>
</html>
