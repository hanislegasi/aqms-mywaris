<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultant Renewal Payment</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family: Inter, sans-serif;
}
</style>

</head>

<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">
Consultant Renewal Payment
</h1>

<p>
Renewal Tahunan Konsultan
</p>

</div>

<div class="max-w-4xl mx-auto p-5">

<div
id="paymentCard"
class="bg-white rounded-2xl border border-gray-200 p-6">

Loading...

</div>

</div>

<script type="module">

// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    getDoc,
    updateDoc,
    addDoc,
    collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
// FIX 1: Tambah helper formatRM supaya tidak ReferenceError
    const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2 });
  
onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const consultantSnap =
await getDoc(
doc(db,"consultants",user.uid)
);

const data = consultantSnap.data();


// Ambil compensation dari Firestore
const compensationSnap = await getDoc(
    doc(db, "settings", "compensation")
);

const compensation = compensationSnap.data();


let renewalFee = 0;


if (data.consultantLevel === "AQC") {
    renewalFee = compensation.renewalAQC;
}

if (data.consultantLevel === "AQC-AS") {
    renewalFee = compensation.renewalAQCAS;
}

if (data.consultantLevel === "AQC-UM") {
    renewalFee = compensation.renewalAQCUM;
}

if (data.consultantLevel === "MGAM") {
    renewalFee = compensation.renewalMGAM;
}
  
document.getElementById("paymentCard").innerHTML = `
        <div class="font-bold text-xl text-[#153638] mb-4">
          RM${formatRM(renewalFee)}
        </div>

<h2 class="text-2xl font-bold text-[#153638] mb-5">

Renewal Summary

</h2>

<div class="space-y-3">

<p>
<b>Consultant No:</b>
${data.consultantNo || "-"}
</p>

<p>
<b>Level:</b>
${data.consultantLevel}
</p>

<p>
<b>Status:</b>
ACTIVE
</p>

<p>
<b>Renewal Fee:</b>
RM${renewalFee}
</p>

</div>

<button
id="payRenewalBtn"
class="mt-6 bg-[#153638] text-white px-6 py-3 rounded-xl">

Pay Renewal Fee

</button>

`;  


  
document
.getElementById("payRenewalBtn")
?.addEventListener("click", async()=>{

const currentExpiry =
new Date(data.renewalDate);

const newExpiry =
new Date(currentExpiry);

newExpiry.setFullYear(
newExpiry.getFullYear() + 1
);

await updateDoc(
doc(db,"consultants",user.uid),
{
consultantPaymentStatus:"paid",
renewalDate:newExpiry,
lastRenewalDate:new Date(),
renewalFeePaid:renewalFee,

// --- TAMBAH KOD RESET EXAM DI SINI ---
"training.wasiat.status": "pending",
"training.wasiat.bestScore": 0,

"training.hibah.status": "pending",
"training.hibah.bestScore": 0,

"training.faraid.status": "pending",
"training.faraid.bestScore": 0,

"training.amla.status": "pending",
"training.amla.bestScore": 0
// -------------------------------------
}
);

// ===============================
// ACCOUNTING ENTRY
// Dr Bank
// Cr Consultant Renewal Fee
// ===============================

await addDoc(collection(db,"ledger"),{

date:new Date(),

accountCode:"4310",
account:"Renewal AQC",

category:"income",

description:
data.consultantNo + " Renewal",

debit:0,

credit:renewalFee,

paymentType:"CUSTOMER",

sourceAccount:"4250",

transactionGroup:data.consultantNo

});


await addDoc(collection(db,"ledger"),{

date:new Date(),

accountCode:"1000",
account:"Bank",

category:"asset",

description:
data.consultantNo + " Renewal",

debit:renewalFee,

credit:0,

paymentType:"CUSTOMER",

sourceAccount:"4250",

transactionGroup:data.consultantNo

});

  
await addDoc(
collection(db,"receipts"),
{

receiptNo:
"REN-" + Date.now(),

uid:user.uid,

consultantNo:data.consultantNo,

payerName:data.nama,

serviceCode:"RENEWAL",

serviceName:"Consultant Renewal Fee",

amount:renewalFee,

paymentMethod:"ToyyibPay",

status:"PAID",

paymentDate:new Date(),

consultantLevel:data.consultantLevel,

referenceNo:data.consultantNo

}
);

  
alert(
`Renewal Berjaya!

Tarikh Tamat Baru:
${newExpiry.toLocaleDateString("ms-MY")}`
);

window.location.href =
"consultant-dashboard.html";

});
  
});
  
</script>
  
</body>
</html>
