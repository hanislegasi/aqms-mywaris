<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Pembaharuan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, sans-serif; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <div class="bg-[#153638] text-white p-5 shadow-md">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-xl md:text-2xl font-bold">Pembayaran Pembaharuan (Renewal)</h1>
            <p class="text-sm text-green-100">AQMS - Pengurusan Rakan Niaga</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto p-5 mt-4">
        <div id="paymentCard" class="bg-white rounded-3xl border border-gray-100 p-6 md:p-8 shadow-xl text-center">
            <div class="animate-pulse flex flex-col items-center justify-center py-10">
                <div class="w-12 h-12 border-4 border-t-transparent border-[#153638] rounded-full animate-spin mb-4"></div>
                <p class="text-gray-500 font-medium">Menyemak maklumat pakej...</p>
            </div>
        </div>
    </div>

<script type="module">
    import { db, auth } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
        
    const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2 });
  
    onAuthStateChanged(auth, async (user) => {
        if(!user){
            window.location.href = "login.html";
            return;
        }

        try {
            const consultantSnap = await getDoc(doc(db, "consultants", user.uid));
            const data = consultantSnap.data();

            const compensationSnap = await getDoc(doc(db, "settings", "compensation"));
            const compensation = compensationSnap.exists() ? compensationSnap.data() : {};

            // ==========================================
            // LOGIK PAKEJ & HARGA DINAMIK (AQC vs AQP)
            // ==========================================
            const level = data.consultantLevel || "AQC";
            const isAQP = (level === "AQP");

            const packageName = isAQP ? "Pembaharuan AQP (Institusi)" : `Pembaharuan ${level}`;
            let renewalFee = 100; // Harga lalai

            if (isAQP) {
                renewalFee = Number(compensation.renewalAQP || 1000);
            } else {
                const levelKey = level.replace(/[^a-zA-Z0-9]/g, "");
                renewalFee = Number(compensation[`renewal${levelKey}`] || 100);
            }

            // ==========================================
            // PAPARAN KAD (UI)
            // ==========================================
            document.getElementById("paymentCard").innerHTML = `
                <div class="text-left mb-6">
                    <a href="consultant-renewal.html" class="inline-flex items-center text-sm font-semibold text-gray-500 hover:text-gray-800 transition">
                        ← Kembali Semakan CPD
                    </a>
                </div>

                <div class="bg-gray-50 rounded-2xl p-6 mb-6 border border-gray-100">
                    <p class="text-gray-500 text-sm font-medium mb-1">Jumlah Perlu Dibayar</p>
                    <div class="font-extrabold text-4xl text-[#153638] tracking-tight">
                        RM ${formatRM(renewalFee)}
                    </div>
                </div>

                <h2 class="text-lg font-bold text-left text-[#153638] mb-4 border-b border-gray-100 pb-2">
                    Ringkasan Akaun
                </h2>

                <div class="space-y-3 text-sm md:text-base text-left mb-8">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">Nama Perunding:</span>
                        <span class="font-bold text-gray-800">${data.nama || "-"}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">No. Rujukan:</span>
                        <span class="font-bold text-gray-800">${data.consultantNo || "-"}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">Pangkat (Level):</span>
                        <span class="font-bold px-3 py-1 bg-[#153638]/10 text-[#153638] rounded-full text-xs">${level}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">Pakej:</span>
                        <span class="font-semibold text-gray-800">${packageName}</span>
                    </div>
                </div>

                <button id="payRenewalBtn" class="w-full bg-[#153638] hover:bg-[#1d4a4d] transition text-white px-6 py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2"></path></svg>
                    Bayar Yuran Pembaharuan
                </button>
            `;

            document.getElementById("payRenewalBtn")?.addEventListener("click", async () => {
                const btn = document.getElementById("payRenewalBtn");
                btn.disabled = true;
                btn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Menjana Invois...`;

                try {
                    const dataPelanggan = {
                        nama: data.nama || "Konsultan AQMS",
                        email: data.email || "tiada@email.com",
                        telefon: data.telefon || "0100000000",
                        pakej: packageName,
                        harga: renewalFee,
                        uid: user.uid
                    };

                    const functions = getFunctions(auth.app);
                    const createToyyibpayBill = httpsCallable(functions, 'createToyyibpayBill');
                    const result = await createToyyibpayBill(dataPelanggan);

                    window.location.href = result.data.paymentUrl;

                } catch (error) {
                    console.error(error);
                    alert("Gagal menghubungi server pembayaran. Sila cuba lagi.");
                    btn.disabled = false;
                    btn.innerHTML = `Bayar Yuran Pembaharuan`;
                }
            });

        } catch (error) {
            console.error(error);
            document.getElementById("paymentCard").innerHTML = `<div class="text-red-500 p-5 font-bold">Ralat memuatkan profil perunding. Sila log masuk semula.</div>`;
        }
    });  
</script>
</body>
</html>
