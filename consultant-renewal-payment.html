<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultant Renewal Payment</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family: Inter, sans-serif;
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">
Consultant Renewal Payment
</h1>

<p>
Renewal Tahunan Konsultan
</p>

</div>

<div class="max-w-4xl mx-auto p-5">

<div
id="paymentCard"
class="bg-white rounded-2xl border border-gray-200 p-6">

Loading...

</div>

</div>

<script type="module">

// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    getDoc,
    updateDoc,
    addDoc,
    collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
    
// FIX 1: Tambah helper formatRM supaya tidak ReferenceError
    const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2 });
  
onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const consultantSnap =
await getDoc(
doc(db,"consultants",user.uid)
);

const data = consultantSnap.data();


// Ambil compensation dari Firestore
const compensationSnap = await getDoc(
    doc(db, "settings", "compensation")
);

const compensation = compensationSnap.data();


let renewalFee = 0;


if (data.consultantLevel === "AQC") {
    renewalFee = compensation.renewalAQC;
}

if (data.consultantLevel === "AQC-AS") {
    renewalFee = compensation.renewalAQCAS;
}

if (data.consultantLevel === "AQC-UM") {
    renewalFee = compensation.renewalAQCUM;
}

if (data.consultantLevel === "MGAM") {
    renewalFee = compensation.renewalMGAM;
}
  
document.getElementById("paymentCard").innerHTML = `
        <div class="font-bold text-xl text-[#153638] mb-4">
          RM${formatRM(renewalFee)}
        </div>

<h2 class="text-2xl font-bold text-[#153638] mb-5">

Renewal Summary

</h2>

<div class="space-y-3">

<p>
<b>Consultant No:</b>
${data.consultantNo || "-"}
</p>

<p>
<b>Level:</b>
${data.consultantLevel}
</p>

<p>
<b>Status:</b>
ACTIVE
</p>

<p>
<b>Renewal Fee:</b>
RM${renewalFee}
</p>

</div>

<button
id="payRenewalBtn"
class="mt-6 bg-[#153638] text-white px-6 py-3 rounded-xl">

Pay Renewal Fee

</button>

`;  


  
document.getElementById("payRenewalBtn")?.addEventListener("click", async () => {
    const btn = document.getElementById("payRenewalBtn");
    btn.disabled = true;
    btn.innerText = "Menjana Invois ToyyibPay...";

    try {
        // Susun data untuk ToyyibPay
        const dataPelanggan = {
            nama: data.nama || "Konsultan AQM",
            email: data.email || "tiada@email.com",
            telefon: data.telefon || "0100000000",
            pakej: "Pembaharuan Konsultan", // Penting: Fail success akan baca nama pakej ini
            harga: renewalFee,
            uid: user.uid
        };

        // Panggil fungsi Cloud Function
        const functions = getFunctions(auth.app);
        const createToyyibpayBill = httpsCallable(functions, 'createToyyibpayBill');
        const result = await createToyyibpayBill(dataPelanggan);

        // Bawa konsultan ke laman pembayaran ToyyibPay
        window.location.href = result.data.paymentUrl;

    } catch (error) {
        console.error(error);
        alert("Gagal menghubungi server pembayaran. Sila cuba lagi.");
        btn.disabled = false;
        btn.innerText = "Pay Renewal Fee";
    }
});
  
</script>
  
</body>
</html>
