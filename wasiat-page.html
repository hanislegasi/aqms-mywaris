<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wasiat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen" style="font-family: 'Inter', sans-serif;">

<div class="bg-[#153638] text-white px-5 py-6 shadow">

<div class="flex justify-between items-center">

<div>

<h1 class="text-2xl font-bold">
my-Wasiat
</h1>

<p id="namaUser">
Memuatkan...
</p>

</div>


</div>

</div>

<div class="p-5">

<a
href="dashboard.html"
class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-5">

← Kembali ke Dashboard

</a>
  
 

<h2 class="font-bold text-xl mb-4">
Wasiat
</h2>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

    <div
    id="profileCard"
    class="h-full">
    Loading...
    </div>

    <div
    id="wasiatTimeline"
    class="h-full">
    </div>

</div>
 

<hr class="my-8">

<div class="flex justify-end gap-3">

<a
href="payment-aqm-receipts.html"
class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold">

<svg
xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="1.5"
stroke="currentColor"
class="w-5 h-5 flex-shrink-0">

<path
stroke-linecap="round"
stroke-linejoin="round"
d="M9 12h6m-6 4h6M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>

</svg>

<span>Resit Saya</span>

</a>

<button
id="logoutBtn"
class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold">

Logout

</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
serverTimestamp,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; 

const firebaseConfig = {

apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
authDomain: "alqawthar-mywaris.firebaseapp.com",
projectId: "alqawthar-mywaris",
storageBucket: "alqawthar-mywaris.firebasestorage.app",
messagingSenderId: "3498810778",
appId: "1:3498810778:web:ee36e0fe42f76698046e23"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

  
onAuthStateChanged(auth, async(user)=>{

if(!user){
window.location.href="login.html";
return;
}

const docSnap =
await getDoc(
doc(db,"users",user.uid)
);

if(docSnap.exists()){

const userData =
docSnap.data();

const consultantQuery = query(
    collection(db, "consultants"),
    where("consultantNo", "==", userData.referral)
);

const consultantSnap = await getDocs(consultantQuery);

let consultantData = {};

if (!consultantSnap.empty) {
    consultantData = consultantSnap.docs[0].data();
}
  
document.getElementById(
"namaUser"
).innerHTML =
"Selamat datang, "
+ userData.nama;

const wasiatSnap =
await getDoc(
   doc(
      db,
      "users",
      user.uid,
      "wasiat",
      "maklumat"
   )
);

const wasiatData =
wasiatSnap.exists()
? wasiatSnap.data()
: {};

let bakiHari = "-";

if(wasiatData.expiryDate){

const today =
new Date();

const expiry =
new Date(
wasiatData.expiryDate
);

bakiHari =
Math.ceil(
(expiry - today)
/ (1000 * 60 * 60 * 24)
);

}

let renewalAlert = "";

if(
bakiHari !== "-" &&
bakiHari <= 30 &&
bakiHari > 0
){

renewalAlert = `

<div
class="bg-orange-50 border border-orange-300 rounded-xl p-4 mb-6">

<h3 class="font-bold text-orange-700">
⚠ Keahlian Akan Tamat
</h3>

<p class="mt-1">
Keahlian anda akan tamat dalam
<strong>${bakiHari} hari</strong>.
</p>

<a
href="renewal.html"
class="inline-block mt-3 bg-orange-500 text-white px-4 py-2 rounded-lg">

Perbaharui Sekarang

</a>

</div>

`;

}
  

const currentStatus = wasiatData.status || "DRAFT";
  
document.getElementById("profileCard").innerHTML =

renewalAlert +

`

<div class="bg-gradient-to-r from-[#153638] to-[#24575a] text-white rounded-2xl p-6 shadow h-full">

<div class="flex justify-between items-start">

<div class="flex-1">

<p class="text-sm font-bold uppercase tracking-widest text-white/60">
Profil Pewasiat
</p>

<h2 class="text-2xl font-bold mt-2">
${userData.nama || "-"}
</h2>

</div>

<div class="ml-8">

<div class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold">

${(userData.nama || "U")[0]}

</div>

</div>

</div>

<div class="mt-5 space-y-3">
<div>

<p class="text-sm font-bold uppercase text-white/50 mb-2">
Maklumat Peribadi
</p>

<div class="space-y-3 text-sm">

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Telefon</span>
<b>${userData.telefon || "-"}</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Emel</span>
<b>${userData.email || "-"}</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Alamat</span>

<b class="text-right max-w-[60%]">
${
[
wasiatData.alamat1,
wasiatData.alamat2,
`${wasiatData.poskod || ""} ${wasiatData.bandar || ""}`.trim(),
wasiatData.negeri
].filter(Boolean).join(", ") || "-"
}
</b>

</div>

</div>


<div class="mt-6">

<p class="text-sm font-bold uppercase text-white/50 mb-2">
Maklumat Keahlian
</p>

<div class="space-y-2 text-sm">

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">No. Ahli</span>
<b>${userData.memberNo || "-"}</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Tamat Keahlian</span>
<b>
${
wasiatData.expiryDate
?
new Date(wasiatData.expiryDate).toLocaleDateString("ms-MY")
:
"-"
}
</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Baki</span>
<b>${bakiHari} Hari</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Status</span>

<span class="inline-block px-3 py-1 rounded-full bg-white/20 text-xs">

${
bakiHari<=0
?
"KEAHLIAN TAMAT"
:
userData.wasiatPaymentStatus==="paid"
?
"AHLI AKTIF"
:
"PROSPEK"
}

</span>

</div>

</div>

</div>

<div class="mt-6">

<p class="text-sm font-bold uppercase text-white/50 mb-2">
Pegawai Perunding
</p>

<div class="space-y-2 text-sm">

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Nama</span>
<b>${consultantData.nama || "-"}</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">Telefon</span>
<b>${consultantData.telefon || "-"}</b>
</div>

</div>

</div>

<div class="mt-6">

<p class="text-sm font-bold uppercase text-white/50 mb-2">
Maklumat Dokumen
</p>

<div class="space-y-3 text-sm">

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">
No. Dokumen
</span>

<b>
${wasiatData.docRef || "-"}
</b>
</div>

<div class="flex justify-between border-b border-white/10 pb-2">
<span class="text-white/70">
Status Dokumen
</span>

<b>
${currentStatus}
</b>

</div> <!-- space-y -->

</div> <!-- Maklumat Dokumen -->

</div> <!-- flex-1 -->


</div> <!-- flex justify-between -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-5">

<a
id="wasiatButton"
href="payment-wasiat.html"
class="bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl px-3 py-2.5 flex items-center gap-4 transition">

<div class="flex items-center gap-4">

<div class="bg-white/20 p-2.5 rounded-xl">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-7 h-7"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622C17.176 19.29 21 14.591 21 9c0-1.042-.133-2.052-.382-3.016z"/>

</svg>

</div>

<div>

<div class="flex items-center gap-2">

<p class="font-semibold text-base">
Wasiat
</p>

<span id="editIcon"></span>

</div>

<p
id="wasiatStatus"
class="hidden">
</p>

</div>

</div>

</a>

${
bakiHari<=0

?

`

<a
href="renewal.html"
class="bg-red-600 hover:bg-red-700 rounded-2xl p-5 flex items-center justify-center font-semibold">

Perbaharui Keahlian

</a>

`

:

`

<a
href="preview-wasiat.html"
class="bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl px-3 py-2.5 flex items-center gap-4 transition">

<div class="flex items-center gap-4">

<div class="bg-green-600 p-2.5 rounded-xl">

<svg xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="1.8"
stroke="currentColor"
class="w-6 h-6 text-white">

<path stroke-linecap="round"
stroke-linejoin="round"
d="M19.5 21h-15A2.25 2.25 0 012.25 18.75v-13.5A2.25 2.25 0 014.5 3h9l6 6v9.75A2.25 2.25 0 0119.5 21z"/>

<path stroke-linecap="round"
stroke-linejoin="round"
d="M9 3v6h6"/>

</svg>

</div>   <!-- <<< NI YANG TERTINGGAL -->
<div>

<p class="font-semibold text-base">
Lihat Dokumen
</p>

</div>

</div>

</a>

`

}

</div> <!-- grid -->

</div> <!-- card -->
`;

const done = (status)=>{

const order = [
    "APPROVED",
    "VERIFIED",
    "PRINTED",
    "SENT",
    "AKAD",
    "STAMPING",
    "HANDOVER",
    "RECEIVED"
];

return order.indexOf(currentStatus)>=order.indexOf(status);

};

function timelineItem(done,title,date,extra=""){

return`

<div class="flex gap-4 mb-6">

<div class="flex flex-col items-center">

<div class="${
done
? "bg-green-600 text-white"
: "bg-gray-200 text-gray-500"
} w-10 h-10 rounded-full flex items-center justify-center font-bold">

✓

</div>



</div>

<div class="flex-1">

<h4 class="font-semibold ${
done
? "text-green-700"
: "text-gray-500"
}">

${title}

</h4>

<p class="text-sm text-gray-500">

${date}

</p>

<div class="text-sm text-gray-600 mt-1">

${extra}

</div>

</div>

</div>

`;

}

  
document.getElementById("wasiatTimeline").innerHTML=`

<div class="bg-white rounded-2xl shadow p-6">

<h3 class="font-bold text-lg mb-5">
Status Timeline
</h3>

${timelineItem(
done("APPROVED"),
"Approved",
wasiatData.approvedAt
? new Date(wasiatData.approvedAt).toLocaleDateString("ms-MY")
: "-"
)}

${timelineItem(
done("PRINTED"),
"Printed",
wasiatData.printedAt
? new Date(wasiatData.printedAt).toLocaleDateString("ms-MY")
: "-"
)}

${timelineItem(
done("SENT"),
"Sent",
wasiatData.sentAt
? new Date(wasiatData.sentAt).toLocaleDateString("ms-MY")
: "-",
`Courier : ${wasiatData.courier || "-"}<br>
Tracking : ${wasiatData.trackingNo || "-"}`
)}

${timelineItem(
done("AKAD"),
"Akad",
wasiatData.akadDate || "-",
wasiatData.akadTime || ""
)}

${timelineItem(
done("STAMPING"),
"Stamping",
wasiatData.stampingDate || "-",
wasiatData.stampingRef || ""
)}

${timelineItem(
done("HANDOVER"),
"Diserahkan Kepada AQM",
wasiatData.handoverDate || "-",
wasiatData.handoverRemarks || ""
)}

${timelineItem(
done("RECEIVED"),
"AQM Terima Dokumen",
wasiatData.receivedDate || "-",
!wasiatData.receivedDate
? `
<input
type="date"
id="receivedDate"
class="border rounded-lg p-2 mt-2 w-full">

<button
id="confirmReceived"
class="bg-green-600 hover:bg-green-700 text-white rounded-lg mt-2 w-full py-2">

Sah Terima

</button>
`
: ""
)}

</div>

`;

  
// PAYMENT STATUS


if(userData.wasiatPaymentStatus === "paid"){

  if(bakiHari <= 0){

    document.getElementById(
      "wasiatButton"
    ).href = "renewal.html";

    document.getElementById(
"wasiatStatus"
).innerHTML = `

<svg
xmlns="http://www.w3.org/2000/svg"
class="w-5 h-5 inline text-amber-600"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M12 11c1.657 0 3-1.343 3-3V7a3 3 0 10-6 0v1c0 1.657 1.343 3 3 3zm-6 0h12a1 1 0 011 1v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7a1 1 0 011-1z"/>

</svg>

Keahlian Tamat

`;

  }

  else{

    document.getElementById(
    "wasiatButton"
).href = "wasiat.html";

document.getElementById("editIcon").innerHTML = `

<svg
xmlns="http://www.w3.org/2000/svg"
class="w-4 h-4 text-blue-300"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M16.862 4.487a2.25 2.25 0 113.182 3.182L8.25 19.463 4.5 20.25l.787-3.75L16.862 4.487z"/>

</svg>

`;
    
  }

}

else{

  document.getElementById(
    "wasiatButton"
  ).href = "payment-wasiat.html";

  document.getElementById(
    "wasiatStatus"
  ).innerHTML =

  "Bayar RM350";

}

const receiveBtn =
document.getElementById("confirmReceived");

if(receiveBtn){

receiveBtn.onclick = async()=>{

const receivedDate =
document.getElementById("receivedDate").value;

if(!receivedDate){

alert("Sila pilih tarikh.");

return;

}

await updateDoc(

doc(
db,
"users",
user.uid,
"wasiat",
"maklumat"
),

{

receivedDate,

status:"RECEIVED",

receivedUpdatedAt:serverTimestamp()

}

);

alert("Dokumen berjaya disahkan diterima.");

location.reload();

};

}
  
document
.getElementById("logoutBtn")
.addEventListener("click", async()=>{

  try{

    await signOut(auth);

    localStorage.clear();

    sessionStorage.clear();

    window.location.replace(
      "index.html"
    );

  }

  catch(error){

    console.log(error);

  }

});







} // PENUTUP if(docSnap.exists()){ YANG TERCICIR
}); // PENUTUP onAuthStateChanged YANG TERCICIR
  
</script>
  
</body>
</html>
