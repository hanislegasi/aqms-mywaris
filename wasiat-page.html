<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wasiat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen" style="font-family: 'Inter', sans-serif;">

<div class="bg-[#153638] text-white px-5 py-6 shadow">

<div class="flex justify-between items-center">

<div>

<h1 class="text-2xl font-bold">
my-Wasiat
</h1>

<p id="namaUser">
Memuatkan...
</p>

</div>


</div>

</div>

<div class="p-5">

<a
href="dashboard.html"
class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-5">

← Kembali ke Dashboard

</a>
  
 

<h2 class="font-bold text-xl mb-4">
Wasiat
</h2>

<div
id="profileCard"
class="bg-white rounded-2xl shadow p-5 mb-6">

Loading...

</div>
  


<div
id="wasiatTimeline"
class="mb-6">
</div>
 
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">

<a
id="wasiatButton"
href="payment-wasiat.html"
class="bg-white p-6 rounded-2xl shadow hover:shadow-xl transition border border-gray-100 min-h-[120px]">
<div class="flex items-center gap-4">

  <!-- ICON -->
  <div class="bg-[#153638]/10 p-3 rounded-xl">

    <svg xmlns="http://www.w3.org/2000/svg"
class="w-8 h-8"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622C17.176 19.29 21 14.591 21 9c0-1.042-.133-2.052-.382-3.016z"/>

</svg>

  </div>

  <div>

    <p class="text-base md:text-lg font-semibold">
      Wasiat
    </p>

    <p
      id="wasiatStatus"
      class="text-xs md:text-sm text-gray-500 mt-1">

      Memuatkan status...

    </p>

  </div>

</div>

</a>

 
</div>

<hr class="my-8">

<div class="flex justify-end gap-3">

<a
href="payment-aqm-receipts.html"
class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold">

<svg
xmlns="http://www.w3.org/2000/svg"
fill="none"
viewBox="0 0 24 24"
stroke-width="1.5"
stroke="currentColor"
class="w-5 h-5 flex-shrink-0">

<path
stroke-linecap="round"
stroke-linejoin="round"
d="M9 12h6m-6 4h6M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>

</svg>

<span>Resit Saya</span>

</a>

<button
id="logoutBtn"
class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold">

Logout

</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  

const firebaseConfig = {

apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
authDomain: "alqawthar-mywaris.firebaseapp.com",
projectId: "alqawthar-mywaris",
storageBucket: "alqawthar-mywaris.firebasestorage.app",
messagingSenderId: "3498810778",
appId: "1:3498810778:web:ee36e0fe42f76698046e23"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

  
onAuthStateChanged(auth, async(user)=>{

if(!user){
window.location.href="login.html";
return;
}

const docSnap =
await getDoc(
doc(db,"users",user.uid)
);

if(docSnap.exists()){

const userData =
docSnap.data();
  
document.getElementById(
"namaUser"
).innerHTML =
"Selamat datang, "
+ userData.nama;

const wasiatSnap =
await getDoc(
   doc(
      db,
      "users",
      user.uid,
      "wasiat",
      "maklumat"
   )
);

const wasiatData =
wasiatSnap.exists()
? wasiatSnap.data()
: {};

let bakiHari = "-";

if(wasiatData.expiryDate){

const today =
new Date();

const expiry =
new Date(
wasiatData.expiryDate
);

bakiHari =
Math.ceil(
(expiry - today)
/ (1000 * 60 * 60 * 24)
);

}

let renewalAlert = "";

if(
bakiHari !== "-" &&
bakiHari <= 30 &&
bakiHari > 0
){

renewalAlert = `

<div
class="bg-orange-50 border border-orange-300 rounded-xl p-4 mb-6">

<h3 class="font-bold text-orange-700">
⚠ Keahlian Akan Tamat
</h3>

<p class="mt-1">
Keahlian anda akan tamat dalam
<strong>${bakiHari} hari</strong>.
</p>

<a
href="renewal.html"
class="inline-block mt-3 bg-orange-500 text-white px-4 py-2 rounded-lg">

Perbaharui Sekarang

</a>

</div>

`;

}
  
if(wasiatData.docRef){

document.getElementById(
"wasiatStatus"
).innerHTML =
wasiatData.docRef;

}else{

document.getElementById(
"wasiatStatus"
).innerHTML =
"DRAFT";

}

  
document.getElementById(
"profileCard"
).innerHTML =

renewalAlert +

`

<div
class="bg-gradient-to-r from-[#153638] to-[#24575a]
text-white rounded-2xl p-6 mb-6 shadow">
<div class="flex justify-between items-center">

<div>

<p class="text-sm opacity-80">
Profil Pewasiat
</p>

<h2 class="text-2xl font-bold mt-1">
${userData.nama || "-"}
</h2>

<p class="opacity-90 mt-1">
${userData.ic || "-"}
</p>

<p class="opacity-90">
${userData.telefon || "-"}
</p>

<p class="opacity-80 text-sm">
No Ahli: ${userData.memberNo || "Belum Aktif"}
</p>

<p class="opacity-80 text-sm">
Tamat Keahlian:
${
wasiatData.expiryDate
? new Date(wasiatData.expiryDate)
.toLocaleDateString("ms-MY")
: "-"
}
</p>

<p class="opacity-80 text-sm">
Baki:
${bakiHari} Hari
</p>

<span class="
inline-block
mt-2
px-3
py-1
rounded-full
bg-white/20
text-sm">

${
bakiHari <= 0
? "KEAHLIAN TAMAT"
: userData.wasiatPaymentStatus === "paid"
? "AHLI AKTIF"
: "PROSPEK"
}

</span>

</div>

<div
class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold">

${(userData.nama || "U")[0]}

</div>

</div>

</div>

`;



const currentStatus = wasiatData.status || "DRAFT";

const done = (status)=>{

const order=[

"APPROVED",
"PRINTED",
"SENT",
"COMPLETED",
"RECEIVED"

];

return order.indexOf(currentStatus)>=order.indexOf(status);

};

document.getElementById("wasiatTimeline").innerHTML=`

<div class="bg-white rounded-2xl shadow p-6">

<h3 class="font-bold text-lg mb-6">

Status Dokumen Wasiat

</h3>

<div class="flex items-center justify-between">

<div class="text-center flex-1">

<div class="${done("APPROVED")?"bg-green-600 text-white":"bg-gray-200"} w-12 h-12 rounded-full flex items-center justify-center mx-auto">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-6 h-6"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M9 12.75L11.25 15 15 9.75M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/>

</svg>

</div>

<p class="mt-2 text-md font-medium">
Approved
</p>

<p class="text-md text-gray-500 mt-1">
${
wasiatData.approvedAt
? new Date(wasiatData.approvedAt).toLocaleDateString("ms-MY")
: "-"
}
</p>

</div>

<div class="h-1 flex-1 ${done("PRINTED")?"bg-green-600":"bg-gray-300"}"></div>

<div class="text-center flex-1">

<div class="${done("PRINTED")?"bg-green-600 text-white":"bg-gray-200"} w-12 h-12 rounded-full flex items-center justify-center mx-auto">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-6 h-6"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M6 9V4h12v5M6 18h12v2H6v-2zm-2-7h16a2 2 0 012 2v3H2v-3a2 2 0 012-2z"/>

</svg>

</div>

<p class="mt-2 text-md font-medium">
Printed
</p>

<p class="text-md text-gray-500 mt-1">
${
wasiatData.printedAt
? new Date(wasiatData.printedAt).toLocaleDateString("ms-MY")
: "-"
}
</p>

</div>

<div class="h-1 flex-1 ${done("SENT")?"bg-green-600":"bg-gray-300"}"></div>

<div class="text-center flex-1">

<div class="${done("SENT")?"bg-green-600 text-white":"bg-gray-200"} w-12 h-12 rounded-full flex items-center justify-center mx-auto">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-6 h-6"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M3 7.5L12 3l9 4.5M3 7.5V16.5L12 21m-9-13.5L12 12m9-4.5V16.5L12 21m0-9V21"/>

</svg>

</div>

<p class="mt-2 text-md font-medium">
Sent
</p>

<p class="text-md text-gray-500 mt-1">
${
wasiatData.sentAt
? new Date(wasiatData.sentAt).toLocaleDateString("ms-MY")
: "-"
}
</p>

<p class="text-md text-gray-600">
${wasiatData.courier || "-"}
</p>

<p class="text-md font-medium text-[#153638]">
${wasiatData.trackingNo || "-"}
</p>

</div>

<div class="h-1 flex-1 ${done("COMPLETED")?"bg-green-600":"bg-gray-300"}"></div>

<div class="text-center flex-1">

<div class="${done("COMPLETED")?"bg-green-600 text-white":"bg-gray-200"} w-12 h-12 rounded-full flex items-center justify-center mx-auto">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-6 h-6"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M5 3v18M5 4h10l-2 4 2 4H5"/>

</svg>

</div>

<p class="mt-2 text-sm">
Completed
</p>

<p class="text-xs text-gray-500 mt-1">
${
wasiatData.receivedDate
? new Date(wasiatData.receivedDate).toLocaleDateString("ms-MY")
: "-"
}
</p>

</div>

</div>

<div class="mt-8 border-t pt-5">

<p><b>No Dokumen :</b> ${wasiatData.docRef||"-"}</p>

<p class="mt-1">
<b>Status :</b> ${currentStatus}
</p>

${
currentStatus=="COMPLETED"

?

`

<div class="bg-green-50 border border-green-200 rounded-xl p-5 mt-5">

<h3 class="font-bold text-green-700 mb-4">

Proses Dokumen Lengkap

</h3>

<div class="space-y-3 text-sm">

<div class="flex justify-between border-b pb-2">

<span>Tarikh Akad</span>

<b>

${wasiatData.akadDate || "-"}

${wasiatData.akadTime || ""}

</b>

</div>

<div class="flex justify-between border-b pb-2">

<span>Stamping</span>

<b>

${wasiatData.stampingDate || "-"}

</b>

</div>

<div class="flex justify-between border-b pb-2">

<span>Diserahkan Kepada AQM</span>

<b>

${wasiatData.handoverDate || "-"}

</b>

</div>

<div class="flex justify-between">

<span>AQM Terima Dokumen</span>

<b>

${wasiatData.receivedDate || "-"}

</b>

</div>

</div>

</div>

`

:

""

}

<div class="mt-5">

${
bakiHari <= 0

?

`

<a
href="renewal.html"
class="inline-block bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold">

Perbaharui Keahlian

</a>

`

:

`

<a
href="preview-wasiat.html"
class="inline-block bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold">

Lihat Dokumen

</a>

`

}

</div>

</div>

`;

  
// PAYMENT STATUS


if(userData.wasiatPaymentStatus === "paid"){

  if(bakiHari <= 0){

    document.getElementById(
      "wasiatButton"
    ).href = "renewal.html";

    document.getElementById(
"wasiatStatus"
).innerHTML = `

<svg
xmlns="http://www.w3.org/2000/svg"
class="w-5 h-5 inline text-amber-600"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path
stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M12 11c1.657 0 3-1.343 3-3V7a3 3 0 10-6 0v1c0 1.657 1.343 3 3 3zm-6 0h12a1 1 0 011 1v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7a1 1 0 011-1z"/>

</svg>

Keahlian Tamat

`;

  }

  else{

    document.getElementById(
    "wasiatButton"
).href = "wasiat.html";

  }

}

else{

  document.getElementById(
    "wasiatButton"
  ).href = "payment-wasiat.html";

  document.getElementById(
    "wasiatStatus"
  ).innerHTML =

  "Bayar RM350";

}

const receiveBtn =
document.getElementById("confirmReceived");

if(receiveBtn){

receiveBtn.onclick = async()=>{

const receivedDate =
document.getElementById("receivedDate").value;

if(!receivedDate){

alert("Sila pilih tarikh.");

return;

}

await updateDoc(

doc(
db,
"users",
user.uid,
"wasiat",
"maklumat"
),

{

receivedDate,

status:"RECEIVED",

receivedUpdatedAt:serverTimestamp()

}

);

alert("Dokumen berjaya disahkan diterima.");

location.reload();

};

}
  
document
.getElementById("logoutBtn")
.addEventListener("click", async()=>{

  try{

    await signOut(auth);

    localStorage.clear();

    sessionStorage.clear();

    window.location.replace(
      "index.html"
    );

  }

  catch(error){

    console.log(error);

  }

});







} // PENUTUP if(docSnap.exists()){ YANG TERCICIR
}); // PENUTUP onAuthStateChanged YANG TERCICIR
  
</script>
  
</body>
</html>
