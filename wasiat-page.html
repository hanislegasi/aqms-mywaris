const app =

getAuth(app);

function timeAgo(timestamp){

if(!timestamp?.seconds) return "Baru sahaja";

const date = new Date(timestamp.seconds * 1000);
const diff = Math.floor((Date.now() - date.getTime()) / 1000);

if(diff < 60) return "Baru sahaja";

if(diff < 3600)
return Math.floor(diff/60) + " minit lalu";

if(diff < 86400)
return Math.floor(diff/3600) + " jam lalu";

if(diff < 604800)
return Math.floor(diff/86400) + " hari lalu";

return date.toLocaleDateString("ms-MY");

}
  
let currentUser = null;  

onAuthStateChanged(auth, async(user)=>{

if(!user){
window.location.href="login.html";
return;
}

currentUser = user;

const docSnap =
await getDoc(
doc(db,"users",user.uid)
);

if(docSnap.exists()){

const userData =
docSnap.data();
  
document.getElementById(
"namaUser"
).innerHTML =
"Selamat datang, "
+ userData.nama;

const wasiatSnap =
await getDoc(
   doc(
      db,
      "users",
      user.uid,
      "wasiat",
      "maklumat"
   )
);

const wasiatData =
wasiatSnap.exists()
? wasiatSnap.data()
: {};

let bakiHari = "-";

if(wasiatData.expiryDate){

const today =
new Date();

const expiry =
new Date(
wasiatData.expiryDate
);

bakiHari =
Math.ceil(
(expiry - today)
/ (1000 * 60 * 60 * 24)
);

}

`;

"wasiatStatus"

"profileCard"

`

document

.addEventListener("click", async()=>{

db,

currentUser.uid,

location.reload();

} // tutup if(latestNotif)

}); // PENUTUP onAuthStateChanged YANG TERCICIR
  
</script>
