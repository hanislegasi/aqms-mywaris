<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Bonus Payable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Inter, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="bg-gray-100">

    <div class="bg-[#153638] text-white p-5">
        <h1 class="text-2xl font-bold">
            KPI Bonus Payable (RM240k)
        </h1>
        <p class="text-sm text-gray-300">Pengurusan Agihan Bonus Pasukan</p>
    </div>

    <div class="max-w-7xl mx-auto p-5">

        <a href="accounts-dashboard.html" class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-5 text-gray-800 hover:bg-gray-300 transition">
            &larr; Akaun
        </a>

        <!-- Mobile Scroll Instruction -->
        <div class="flex items-center text-sm text-gray-500 mb-2 md:hidden">
            <svg class="w-4 h-4 mr-2 text-blue-500 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
            </svg>
            <span>Tatal (scroll) ke kanan untuk melihat jadual penuh.</span>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full min-w-[600px]">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <th class="p-3 text-left">Team (MGAM)</th>
                            <th class="p-3 text-center">Ahli Pasukan</th>
                            <th class="p-3 text-right">Total Bonus (RM)</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="payableTable">
                        <!-- Loading placeholder -->
                        <tr>
                            <td colspan="4" class="p-5 text-center text-gray-500">Memuatkan data bonus...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, getDocs, doc, addDoc, updateDoc, query, where, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
            authDomain: "alqawthar-mywaris.firebaseapp.com",
            projectId: "alqawthar-mywaris",
            storageBucket: "alqawthar-mywaris.firebasestorage.app",
            messagingSenderId: "3498810778",
            appId: "1:3498810778:web:ee36e0fe42f76698046e23"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // Tarik data dari koleksi bonusPayable (Tanya rekod yang berstatus PENDING_PAYMENT)
        async function loadBonusData() {
            try {
                const snap = await getDocs(query(
                    collection(db, "bonusPayable"),
                    where("status", "==", "PENDING_PAYMENT")
                ));

                const mgamGroups = {};

                // Group data mengikut Team (Upline/MGAM)
                snap.forEach((d) => {
                    const row = d.data();
                    const teamId = row.team; 

                    if (!mgamGroups[teamId]) {
                        mgamGroups[teamId] = {
                            teamId: teamId,
                            totalBonusPool: 0,
                            docIds: [], // Simpan ID dokumen untuk di-update bila bayaran dibuat
                            members: []
                        };
                    }

                    mgamGroups[teamId].totalBonusPool += Number(row.bonusAmount || 0);
                    mgamGroups[teamId].docIds.push(d.id);
                    mgamGroups[teamId].members.push({
                        aqcNo: row.aqcNo,
                        nama: row.nama,
                        sales: row.totalSales,
                        percent: row.bonusPercent,
                        amount: row.bonusAmount
                    });
                });

                let html = "";

                // Bina HTML untuk setiap Kumpulan MGAM
                Object.keys(mgamGroups).forEach((teamId) => {
                    const group = mgamGroups[teamId];
                    const docIdsString = JSON.stringify(group.docIds).replace(/"/g, '&quot;');

                    html += `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-4 font-bold text-[#153638]">${group.teamId}</td>
                            <td class="p-4 text-center text-gray-700">${group.members.length} Orang</td>
                            <td class="p-4 text-right font-bold text-green-600">RM${formatRM(group.totalBonusPool)}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="toggleDetail('${group.teamId}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow">
                                    View
                                </button>
                                <button onclick="generatePV('${group.teamId}', ${group.totalBonusPool}, '${docIdsString}', this)" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition shadow">
                                    Generate PV
                                </button>
                            </td>
                        </tr>

                        <!-- Sub-Jadual (Senarai Downline & Pecahan Bonus) -->
                        <tr id="${group.teamId}" class="hidden bg-blue-50 border-b-2 border-blue-200">
                            <td colspan="4" class="p-6">
                                <h4 class="font-bold text-gray-800 mb-3">Pecahan Bonus Pasukan ${group.teamId}</h4>
                                <table class="w-full text-sm text-left text-gray-600 bg-white rounded-lg shadow-sm overflow-hidden">
                                    <thead class="bg-blue-100 text-gray-700">
                                        <tr>
                                            <th class="px-4 py-3">No. AQC</th>
                                            <th class="px-4 py-3">Nama</th>
                                            <th class="px-4 py-3 text-right">Sumbangan Sales</th>
                                            <th class="px-4 py-3 text-right">% Kelayakan</th>
                                            <th class="px-4 py-3 text-right">Jumlah Bonus</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${group.members.map(m => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-4 py-3 font-semibold">${m.aqcNo}</td>
                                                <td class="px-4 py-3">${m.nama}</td>
                                                <td class="px-4 py-3 text-right">RM${formatRM(m.sales)}</td>
                                                <td class="px-4 py-3 text-right font-semibold text-blue-600">${Number(m.percent).toFixed(2)}%</td>
                                                <td class="px-4 py-3 text-right font-bold text-green-600">RM${formatRM(m.amount)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("payableTable").innerHTML = html || '<tr><td colspan="4" class="p-5 text-center text-gray-500 font-medium">Tiada KPI Bonus yang tertunggak buat masa ini.</td></tr>';

            } catch (err) {
                console.error("Ralat menarik data bonus: ", err);
                document.getElementById("payableTable").innerHTML = '<tr><td colspan="4" class="p-5 text-center text-red-500 font-bold">Gagal memuatkan rekod pangkalan data.</td></tr>';
            }
        }

        // Jalankan fungsi load data
        loadBonusData();

        // Logik Buka/Tutup Sub-Jadual
        window.toggleDetail = function(id) {
            document.getElementById(id).classList.toggle("hidden");
        };

        // Logik Hasilkan Baucar Bayaran (Payment Voucher)
        window.generatePV = async (teamId, totalAmount, docIdsJson, button) => {
            try {
                if (!confirm(`Sahkan penjanaan PV untuk Pasukan ${teamId} berjumlah RM${formatRM(totalAmount)}?`)) {
                    return;
                }
                
                button.disabled = true;
                button.innerText = "Memproses...";

                const docIds = JSON.parse(docIdsJson);
                const currentPeriod = new Date().getFullYear() + "-" + String(new Date().getMonth() + 1).padStart(2, "0");
                const pvNo = "PV-KPI-" + Date.now();

                // 1. Cipta Payment Voucher
                await addDoc(collection(db, "paymentVouchers"), {
                    pvNo: pvNo,
                    consultantNo: teamId,
                    consultantName: "Kumpulan " + teamId,
                    type: "KPI_BONUS",
                    period: currentPeriod,
                    description: "Bayaran KPI Bonus Pasukan " + teamId,
                    amount: Number(totalAmount),
                    accountCode: "2160", // Kod untuk Bonus Payable
                    accountName: "KPI Bonus Payable",
                    category: "Liability",
                    cashFlowType: "Operating",
                    normalBalance: "Credit",
                    reportGroup: "Balance Sheet",
                    status: "PENDING",
                    createdAt: new Date()
                });

                // 2. Kemaskini status dokumen di bonusPayable kepada 'PV_GENERATED' (supaya tak masuk list lagi)
                for (let i = 0; i < docIds.length; i++) {
                    const docRef = doc(db, "bonusPayable", docIds[i]);
                    await updateDoc(docRef, { status: "PV_GENERATED" });
                }

                alert(`Berjaya! Payment Voucher (${pvNo}) telah dicipta untuk pasukan ${teamId}.`);
                location.reload(); // Refresh page untuk kemaskini jadual
                
            } catch (err) {
                button.disabled = false;
                button.innerText = "Generate PV";
                console.error(err);
                alert("Ralat: " + err.message);
            }
        };
    </script>

</body>
</html>
