<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Inter, sans-serif;
        }
        /* Elak jadual terpotong separuh muka surat bila export PDF */
        .ledger-card {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

    <div class="bg-[#153638] text-white p-5">
        <h1 class="text-2xl font-bold">General Ledger</h1>
    </div>

    <div class="p-5">
        <div class="flex items-center gap-3 mb-6">
            <a href="accounts-dashboard.html"
                class="h-12 px-6 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-xl font-medium">
                ← Akaun
            </a>
            <button id="exportPdfBtn"
                class="h-12 px-6 flex items-center justify-center bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium">
                Export PDF
            </button>
        </div>

        <div class="grid md:grid-cols-4 gap-3 mb-6">
            <input type="date" id="dateFrom" class="border rounded-xl p-3 h-12" title="Tarikh Mula">
            <input type="date" id="dateTo" class="border rounded-xl p-3 h-12" title="Tarikh Akhir">
            <input type="text" id="ledgerSearch" placeholder="Cari kod, nama atau description..."
                class="border rounded-xl p-3 h-12 md:col-span-2">
        </div>

        <div id="plCard" class="space-y-5">
            <div class="text-center py-10 text-gray-500 font-medium">
                Memuat turun rekod lejar...
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Global variables untuk simpan data asal
        let rawLedgerData = [];
        let coaMap = {};

        function money(value) {
            return Number(value || 0).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Parse tarikh Firestore dengan selamat kepada ISO String YYYY-MM-DD
        function parseDate(dateObj) {
            if (!dateObj) return "";
            if (dateObj.toDate) return dateObj.toDate().toISOString().substring(0, 10);
            return new Date(dateObj).toISOString().substring(0, 10);
        }

        // Format tarikh untuk paparan (DD/MM/YYYY)
        function formatDateDisplay(isoString) {
            if (!isoString) return "-";
            const [year, month, day] = isoString.split("-");
            return `${day}/${month}/${year}`;
        }

        async function init() {
            try {
                // 1. Tarik Chart of Accounts (COA)
                const coaSnap = await getDocs(collection(db, "chartOfAccounts"));
                coaSnap.forEach((d) => {
                    const coaData = d.data();
                    coaMap[coaData.code] = coaData.name;
                });

                // 2. Tarik Ledger Data
                const snap = await getDocs(collection(db, "ledger"));
                snap.forEach((d) => {
                    const row = d.data();
                    row.isoDate = parseDate(row.date); // Simpan ISO date untuk mudahkan filter
                    rawLedgerData.push(row);
                });

                // 3. Render pertama kali (tanpa filter)
                renderLedger();

            } catch (error) {
                console.error("Ralat menarik data:", error);
                document.getElementById("plCard").innerHTML = `<div class="text-red-500 p-5">Gagal memuat turun data. Sila semak sambungan / rules Firebase anda.</div>`;
            }
        }

        function renderLedger() {
            const keyword = document.getElementById("ledgerSearch").value.toLowerCase();
            const from = document.getElementById("dateFrom").value;
            const to = document.getElementById("dateTo").value;

            const accounts = {};

            // Proses data mengikut filter
            rawLedgerData.forEach((row) => {
                const code = String(row.accountCode);
                const desc = (row.description || "").toLowerCase();
                const accName = (coaMap[code] || row.account || "Tiada Nama Akaun").toLowerCase();

                if (!accounts[code]) {
                    accounts[code] = {
                        accountName: coaMap[code] || row.account || "Tiada Nama Akaun",
                        rows: [],
                        openingBalance: 0
                    };
                }

                const isBeforeFrom = from && row.isoDate < from;
                const isAfterTo = to && row.isoDate > to;

                // Logik untuk Baki Bawa Hadapan (Brought Forward)
                if (isBeforeFrom) {
                    // Jika tarikh transaksi adalah sebelum dateFrom, kita sumbang pada Opening Balance
                    accounts[code].openingBalance += (Number(row.debit || 0) - Number(row.credit || 0));
                } 
                else if (!isAfterTo) {
                    // Cek keyword jika ada
                    let matchSearch = true;
                    if (keyword && !desc.includes(keyword) && !code.toLowerCase().includes(keyword) && !accName.includes(keyword)) {
                        matchSearch = false;
                    }

                    if (matchSearch) {
                        accounts[code].rows.push(row);
                    }
                }
            });

            let html = "";
            let hasData = false;

            Object.keys(accounts).sort().forEach((code) => {
                const acc = accounts[code];
                
                // Abaikan akaun jika tiada transaksi dan tiada opening balance
                if (acc.rows.length === 0 && acc.openingBalance === 0) return;
                
                hasData = true;

                // Susun transaksi berdasarkan tarikh secara menaik (chronological)
                acc.rows.sort((a, b) => a.isoDate.localeCompare(b.isoDate));

                let runningBalance = acc.openingBalance;
                let totalDebit = 0;
                let totalCredit = 0;

                html += `
                <div class="ledger-card bg-white rounded-xl shadow-sm border p-4 mb-4">
                    <h2 class="text-xl font-bold mb-3 uppercase text-[#153638]">
                        ${code} - ${acc.accountName}
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-[#153638] text-white">
                                    <th class="p-3 text-left w-32">Tarikh</th>
                                    <th class="p-3 text-left">Penerangan</th>
                                    <th class="p-3 text-right w-32">Debit (RM)</th>
                                    <th class="p-3 text-right w-32">Kredit (RM)</th>
                                    <th class="p-3 text-right w-32">Baki (RM)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                // Render Baki Bawa Hadapan (Jika filter 'Date From' digunakan)
                if (from) {
                    html += `
                        <tr class="border-b bg-gray-50">
                            <td class="p-3 font-semibold">-</td>
                            <td class="p-3 font-semibold italic">Baki Bawa Hadapan (B/F)</td>
                            <td class="p-3 text-right">-</td>
                            <td class="p-3 text-right">-</td>
                            <td class="p-3 text-right font-semibold ${runningBalance < 0 ? 'text-red-600' : 'text-[#153638]'}">
                                ${money(runningBalance)}
                            </td>
                        </tr>
                    `;
                }

                // Loop setiap transaksi yang lepas filter
                acc.rows.forEach((row) => {
                    const debit = Number(row.debit || 0);
                    const credit = Number(row.credit || 0);
                    
                    runningBalance += (debit - credit);
                    totalDebit += debit;
                    totalCredit += credit;

                    html += `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-3 whitespace-nowrap">
                                ${formatDateDisplay(row.isoDate)}
                            </td>
                            <td class="p-3 text-gray-700">
                                ${row.description || "-"}
                            </td>
                            <td class="p-3 text-right text-gray-800">
                                ${debit > 0 ? money(debit) : "-"}
                            </td>
                            <td class="p-3 text-right text-gray-800">
                                ${credit > 0 ? money(credit) : "-"}
                            </td>
                            <td class="p-3 text-right font-semibold ${runningBalance < 0 ? 'text-red-600' : 'text-[#153638]'}">
                                ${money(runningBalance)}
                            </td>
                        </tr>
                    `;
                });

                // Total Bar
                html += `
                                <tr class="font-bold bg-gray-100 text-[#153638]">
                                    <td colspan="2" class="p-3 text-right uppercase border-t-2 border-gray-300">
                                        Jumlah Tempoh Ini
                                    </td>
                                    <td class="p-3 text-right border-t-2 border-gray-300">
                                        ${money(totalDebit)}
                                    </td>
                                    <td class="p-3 text-right border-t-2 border-gray-300">
                                        ${money(totalCredit)}
                                    </td>
                                    <td class="p-3 text-right border-t-2 border-gray-300">
                                        ${money(runningBalance)}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                `;
            });

            if (!hasData) {
                html = `<div class="text-center py-10 text-gray-500 font-medium">Tiada rekod dijumpai berdasarkan carian/tarikh ini.</div>`;
            }

            document.getElementById("plCard").innerHTML = html;
        }

        // Listeners: Guna 'renderLedger' setiap kali ada perubahan
        document.getElementById("ledgerSearch").addEventListener("input", renderLedger);
        document.getElementById("dateFrom").addEventListener("change", renderLedger);
        document.getElementById("dateTo").addEventListener("change", renderLedger);

        // Export PDF
        document.getElementById("exportPdfBtn").addEventListener("click", () => {
            const element = document.getElementById("plCard");
            html2pdf().set({
                margin: 0.4,
                filename: "General-Ledger.pdf",
                image: { type: "jpeg", quality: 1 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: "in", format: "a4", orientation: "portrait" }
            }).from(element).save();
        });

        // Mula jalankan aplikasi
        init();

    </script>
</body>
</html>
