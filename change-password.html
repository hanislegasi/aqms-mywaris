<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tukar Kata Laluan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#153638">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQMS">
<script src="/pwa.js" defer></script>
</head>

<body class="m-kemas min-h-screen bg-[#f5f7f9] flex items-center justify-center p-5">

  <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl border border-gray-100">
    <h2 class="text-3xl font-bold mb-2 text-center text-[#153638]">Tukar Kata Laluan</h2>
    <p id="emailText" class="text-sm text-gray-500 text-center mb-6">Memuatkan...</p>

    <form id="changeForm" class="space-y-4">
      <input id="currentPw" type="password" placeholder="Kata laluan semasa" autocomplete="current-password"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]" required>
      <input id="newPw" type="password" placeholder="Kata laluan baharu (min. 6 aksara)" autocomplete="new-password" minlength="6"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]" required>
      <input id="confirmPw" type="password" placeholder="Sahkan kata laluan baharu" autocomplete="new-password" minlength="6"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]" required>

      <label class="flex items-center gap-2 text-sm text-gray-500">
        <input id="showPw" type="checkbox" class="rounded"> Papar kata laluan
      </label>

      <button id="saveBtn" type="submit"
        class="w-full bg-[#153638] hover:bg-[#1d4a4d] transition text-white py-4 rounded-xl font-semibold shadow-lg disabled:opacity-60">
        Simpan Kata Laluan Baharu
      </button>
    </form>

    <div id="msgBox" class="hidden mt-4 p-4 rounded-xl text-sm"></div>

    <div class="mt-6 border-t border-gray-100 pt-4 text-center space-y-2">
      <a id="backLink" href="dashboard.html" class="block text-sm text-gray-500 hover:text-[#153638] hover:underline">← Kembali ke Dashboard</a>
      <a href="forgot-password.html" class="block text-xs text-gray-400 hover:text-[#153638] hover:underline">Lupa kata laluan semasa?</a>
    </div>
  </div>

  <script type="module">
    import { db, auth } from './firebase.js';
    import { onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const form = document.getElementById("changeForm");
    const btn = document.getElementById("saveBtn");
    const msgBox = document.getElementById("msgBox");

    function papar(teks, jenis) {
      msgBox.className = "mt-4 p-4 rounded-xl text-sm " +
        (jenis === "ok" ? "bg-emerald-50 text-emerald-800 border border-emerald-200"
                        : "bg-red-50 text-red-700 border border-red-200");
      msgBox.textContent = teks;
    }

    document.getElementById("showPw").addEventListener("change", (e) => {
      ["currentPw", "newPw", "confirmPw"].forEach(id => {
        document.getElementById(id).type = e.target.checked ? "text" : "password";
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById("emailText").textContent = user.email || "";

      // Tentukan dashboard asal ikut peranan (sama seperti login.html)
      let back = "dashboard.html";
      try {
        const adminDoc = await getDoc(doc(db, "admins", user.uid));
        if (adminDoc.exists()) {
          back = "admin-dashboard.html";
        } else {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          const role = userDoc.exists() ? (userDoc.data().role || "customer") : "customer";
          if (role === "consultant") back = "consultant-dashboard.html";
          else if (role === "aqp") back = "aqp-dashboard.html";
        }
      } catch (e) { console.error(e); }
      document.getElementById("backLink").href = back;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) { window.location.href = "login.html"; return; }

      const currentPw = document.getElementById("currentPw").value;
      const newPw = document.getElementById("newPw").value;
      const confirmPw = document.getElementById("confirmPw").value;

      if (newPw.length < 6) return papar("Kata laluan baharu mesti sekurang-kurangnya 6 aksara.", "err");
      if (newPw !== confirmPw) return papar("Pengesahan kata laluan tidak sama.", "err");
      if (newPw === currentPw) return papar("Kata laluan baharu mesti berbeza daripada yang semasa.", "err");

      btn.disabled = true;
      btn.textContent = "Menyimpan...";
      try {
        // Firebase perlukan pengesahan semula sebelum tukar kata laluan
        const credential = EmailAuthProvider.credential(user.email, currentPw);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPw);
        form.reset();
        papar("Kata laluan berjaya ditukar. Gunakan kata laluan baharu untuk log masuk seterusnya.", "ok");
      } catch (error) {
        console.error(error);
        if (error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
          papar("Kata laluan semasa salah.", "err");
        } else if (error.code === "auth/weak-password") {
          papar("Kata laluan baharu terlalu lemah. Gunakan gabungan huruf dan nombor.", "err");
        } else if (error.code === "auth/too-many-requests") {
          papar("Terlalu banyak percubaan. Sila cuba lagi selepas beberapa minit.", "err");
        } else {
          papar("Gagal menukar kata laluan. Sila cuba lagi.", "err");
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan Kata Laluan Baharu";
      }
    });
  </script>
</body>
</html>
