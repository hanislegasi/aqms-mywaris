<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ================= FIREBASE CONFIG =================

const firebaseConfig = {
            apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
            authDomain: "alqawthar-mywaris.firebaseapp.com",
            projectId: "alqawthar-mywaris",
            storageBucket: "alqawthar-mywaris.firebasestorage.app",
            messagingSenderId: "3498810778",
            appId: "1:3498810778:web:ee36e0fe42f76698046e23"
        };


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// ================= DEFAULT SETTINGS =================

const defaultCompanySettings = {

companyName:"AL-QAWTHAR MAWARIS SYNERGY SDN. BHD.",
registrationNo:"",
companyEmail:"",
companyAddress:""

};


const defaultCompensationSettings = {

wasiatPrice:350,
hibahPrice:2500,
sepencarianPrice:800,
mawarisPrice:3000,

wasiatRenewal:50,
hibahRenewal:50,
sepencarianRenewal:50,
mawarisRenewal:80,

commissionAQC:35,
commissionAQCAS:38,
commissionAQCUM:40,
commissionMGAM:45,

overrideAQC:0,
overrideAQCAS:3,
overrideAQCUM:4,
overrideMGAM:5,

companyPool:48,
commissionPool:35,
overridePool:12,

adminOperation:30,
allowance:10,
royalty:8,

memberValidity:365,

consultantRegistrationFee:200,

renewalAQC:100,
renewalAQCAS:150,
renewalAQCUM:250,
renewalMGAM:500,

};


// ================= INPUT LIST =================

const companyFields = [
"companyName",
"registrationNo",
"companyEmail",
"companyAddress"
];


const compensationFields = [

"wasiatPrice",
"hibahPrice",
"sepencarianPrice",
"mawarisPrice",

"wasiatRenewal",
"hibahRenewal",
"sepencarianRenewal",
"mawarisRenewal",

"commissionAQC",
"commissionAQCAS",
"commissionAQCUM",
"commissionMGAM",

"overrideAQC",
"overrideAQCAS",
"overrideAQCUM",
"overrideMGAM",

"memberValidity",
"consultantRegistrationFee",
"renewalAQC",
"renewalAQCAS",
"renewalAQCUM",
"renewalMGAM",

];

// ================= LOAD SETTINGS =================


async function loadSettings(){

const companyRef = doc(db,"settings","company");
const compensationRef = doc(db,"settings","compensation");

const companySnap = await getDoc(companyRef);
const compensationSnap = await getDoc(compensationRef);


let companyData;
let compensationData;


// COMPANY

if(companySnap.exists()){

companyData = companySnap.data();

}else{

companyData = defaultCompanySettings;

await setDoc(companyRef, companyData);

}


// COMPENSATION

if(compensationSnap.exists()){

compensationData = compensationSnap.data();

}else{

compensationData = defaultCompensationSettings;

await setDoc(compensationRef, compensationData);

}



// Load Company

companyFields.forEach(field=>{

let input=document.getElementById(field);

if(input){

input.value=companyData[field] ?? "";

}

});



// Load Compensation

compensationFields.forEach(field=>{

let input=document.getElementById(field);

if(input){

input.value=compensationData[field] ?? "";

}

});



// Revenue

companyPool.value =
compensationData.companyPool ?? 0;


commissionPool.value =
compensationData.commissionPool ?? 0;


overridePool.value =
compensationData.overridePool ?? 0;


adminOperation.value =
compensationData.adminOperation ?? 0;


allowance.value =
compensationData.allowance ?? 0;


royalty.value =
compensationData.royalty ?? 0;


checkRevenue();

}


function checkRevenue(){

const company =
Number(adminOperation.value)+
Number(allowance.value)+
Number(royalty.value);


const total =
Number(companyPool.value)+
Number(commissionPool.value)+
Number(overridePool.value);



if(
company !== Number(companyPool.value)
||
total !== 95
){

revenueCheck.innerHTML = `

<div class="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">

<div class="font-bold">
⚠️ Allocation Tidak Sah
</div>

<div class="text-sm mt-2">

Company Breakdown:
${company}% / ${companyPool.value}%


<br>

Total Allocation:
${total}%


<br><br>

Pastikan:

<br>
• Company Breakdown = Company Pool
<br>
• Total Allocation = 95%

</div>

</div>

`;

saveSettings.disabled=true;


}else{


revenueCheck.innerHTML="";

saveSettings.disabled=false;


}


}

// ================= SALES SIMULATION =================


function calculateSimulation(){


const sales =

(
Number(document.getElementById("simWasiat").value || 0) *
Number(document.getElementById("wasiatPrice").value || 0)
)

+

(
Number(document.getElementById("simHibah").value || 0) *
Number(document.getElementById("hibahPrice").value || 0)
)

+

(
Number(document.getElementById("simSepencarian").value || 0) *
Number(document.getElementById("sepencarianPrice").value || 0)
)

+

(
Number(document.getElementById("simMawaris").value || 0) *
Number(document.getElementById("mawarisPrice").value || 0)
);



const commission =

sales *
Number(document.getElementById("commissionPool").value || 0)
/100;



const override =

sales *
Number(document.getElementById("overridePool").value || 0)
/100;



const companyPoolAmount =

sales *
Number(document.getElementById("companyPool").value || 0)
/100;



const adminAmount =

companyPoolAmount *
Number(document.getElementById("adminOperation").value || 0)
/100;



const allowanceAmount =

companyPoolAmount *
Number(document.getElementById("allowance").value || 0)
/100;



const royaltyAmount =

companyPoolAmount *
Number(document.getElementById("royalty").value || 0)
/100;



const profit =

companyPoolAmount
-
adminAmount
-
allowanceAmount
-
royaltyAmount;



const margin = sales > 0

?
(profit / sales) * 100

:
0;



document.getElementById("simSales").innerHTML =
"RM " + sales.toLocaleString();



document.getElementById("simCommission").innerHTML =
"RM " + commission.toLocaleString();



document.getElementById("simOverride").innerHTML =
"RM " + override.toLocaleString();



document.getElementById("simCompanyPool").innerHTML =
"RM " + companyPoolAmount.toLocaleString();



document.getElementById("simProfit").innerHTML =
"RM " + profit.toLocaleString();



document.getElementById("simMargin").innerHTML =
margin.toFixed(1)+"%";


}

// warna margin

if(margin < 20){

marginCard.className =
"bg-red-100 rounded-xl p-4";

}

else if(margin < 30){

marginCard.className =
"bg-yellow-100 rounded-xl p-4";

}

else{

marginCard.className =
"bg-green-100 rounded-xl p-4";

}


}



// LIVE UPDATE

[
"simWasiat",
"simHibah",
"simSepencarian",
"simMawaris"

].forEach(id=>{

document
.getElementById(id)
.addEventListener(
"input",
calculateSimulation
);

});

[
"wasiatPrice",
"hibahPrice",
"sepencarianPrice",
"mawarisPrice",
"companyPool",
"commissionPool",
"overridePool",
"adminOperation",
"allowance",
"royalty"

].forEach(id=>{

document
.getElementById(id)
.addEventListener(
"input",
calculateSimulation
);

});
  
// ================= SAVE SETTINGS =================


document
.getElementById("saveSettings")
.addEventListener("click",async()=>{


let companyData = {};

let compensationData = {};


// ================= COMPANY DATA =================

companyData = {

companyName: companyName.value,

registrationNo: registrationNo.value,

companyEmail: companyEmail.value,

companyAddress: companyAddress.value

};



// ================= COMPENSATION DATA =================

compensationData = {

wasiatPrice:Number(wasiatPrice.value),
hibahPrice:Number(hibahPrice.value),
sepencarianPrice:Number(sepencarianPrice.value),
mawarisPrice:Number(mawarisPrice.value),


wasiatRenewal:Number(wasiatRenewal.value),
hibahRenewal:Number(hibahRenewal.value),
sepencarianRenewal:Number(sepencarianRenewal.value),
mawarisRenewal:Number(mawarisRenewal.value),



commissionAQC:Number(commissionAQC.value),
commissionAQCAS:Number(commissionAQCAS.value),
commissionAQCUM:Number(commissionAQCUM.value),
commissionMGAM:Number(commissionMGAM.value),



overrideAQC:Number(overrideAQC.value),
overrideAQCAS:Number(overrideAQCAS.value),
overrideAQCUM:Number(overrideAQCUM.value),
overrideMGAM:Number(overrideMGAM.value),



companyPool:Number(companyPool.value),

commissionPool:Number(commissionPool.value),

overridePool:Number(overridePool.value),



adminOperation:Number(adminOperation.value),

allowance:Number(allowance.value),

royalty:Number(royalty.value),



memberValidity:Number(memberValidity.value),

consultantRegistrationFee:Number(consultantRegistrationFee.value),

renewalAQC:Number(renewalAQC.value),
renewalAQCAS:Number(renewalAQCAS.value),
renewalAQCUM:Number(renewalAQCUM.value),
renewalMGAM:Number(renewalMGAM.value),
};



// SAVE FIRESTORE

await setDoc(
doc(db,"settings","company"),
companyData,
{merge:true}
);;


await setDoc(
doc(db,"settings","compensation"),
compensationData,
{merge:true}
);



alert("Settings berjaya disimpan");


});





// ================= RESET =================


document
.getElementById("resetSettings")
.addEventListener("click",()=>{


fields.forEach(field=>{


let input=document.getElementById(field);


if(input){

input.value=defaultSettings[field];

}


});

companyPool.value =
defaultSettings.revenueDistribution.companyPool;

commissionPool.value =
defaultSettings.revenueDistribution.commissionPool;

overridePool.value =
defaultSettings.revenueDistribution.overridePool;


adminOperation.value =
defaultSettings.revenueDistribution.companyBreakdown.adminOperation;


allowance.value =
defaultSettings.revenueDistribution.companyBreakdown.allowance;


royalty.value =
defaultSettings.revenueDistribution.companyBreakdown.royalty;


checkRevenue();

});

// INIT

loadSettings();


</script>
  
</body>
