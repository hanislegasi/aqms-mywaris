<!DOCTYPE html>
<html lang="ms">

<style>

<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">

Admin Settings

</h1>

</div>

<div class="p-5">

<a
href="admin-dashboard.html"
class="bg-gray-200 px-5 py-3 rounded-xl inline-block mb-5">

← Dashboard

</a>
<div class="p-5">

    
    <!-- ================= COMPANY ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">
            Maklumat Syarikat
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>
                <label class="font-medium">Nama Syarikat</label>

                <input
                    id="companyName"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Telefon</label>

                <input
                    id="companyPhone"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Email</label>

                <input
                    id="companyEmail"
                    type="email"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Alamat</label>

                <input
                    id="companyAddress"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

        </div>

    </div>



    <!-- ================= PRODUCT ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Harga Produk

        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>

                <label>Wasiat (RM)</label>

                <input
                    id="wasiatPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Hibah (RM)</label>

                <input
                    id="hibahPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Sepencarian (RM)</label>

                <input
                    id="sepencarianPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Mawaris (RM)</label>

                <input
                    id="mawarisPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= RENEWAL ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Renewal Produk

        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>

                <label>Renewal Wasiat</label>

                <input
                    id="wasiatRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Hibah</label>

                <input
                    id="hibahRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Sepencarian</label>

                <input
                    id="sepencarianRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Mawaris</label>

                <input
                    id="mawarisRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= COMMISSION ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Commission (%)

        </h2>

        <div class="grid md:grid-cols-4 gap-4">

            <div>

                <label>AQC</label>

                <input
                    id="commissionAQC"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-AS</label>

                <input
                    id="commissionAQCAS"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-UM</label>

                <input
                    id="commissionAQCUM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>MGAM</label>

                <input
                    id="commissionMGAM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= OVERRIDE ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Override (%)

        </h2>

        <div class="grid md:grid-cols-4 gap-4">

            <div>

                <label>AQC</label>

                <input
                    id="overrideAQC"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-AS</label>

                <input
                    id="overrideAQCAS"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-UM</label>

                <input
                    id="overrideAQCUM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>MGAM</label>

                <input
                    id="overrideMGAM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>


<!-- ================= REVENUE DISTRIBUTION ================= -->

<div class="bg-white rounded-2xl shadow p-6 mb-6">

<h2 class="text-xl font-bold mb-5">
Revenue Allocation (%)
</h2>


<div class="grid md:grid-cols-3 gap-4">


<div>

<label>
Company Pool
</label>

<input
id="companyPool"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


<div>

<label>
Commission Pool
</label>

<input
id="commissionPool"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


<div>

<label>
Override Pool
</label>

<input
id="overridePool"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


</div>


<div class="mt-5 bg-gray-100 p-4 rounded-xl">

<h3 class="font-bold mb-3">
Company Pool Breakdown
</h3>


<div class="grid md:grid-cols-3 gap-4">


<div>

<label>
Admin Operation
</label>

<input
id="adminOperation"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


<div>

<label>
Allowance
</label>

<input
id="allowance"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


<div>

<label>
Royalty
</label>

<input
id="royalty"
type="number"
class="w-full border rounded-xl p-3 mt-1">

</div>


</div>


<p id="revenueCheck"
class="mt-4 font-bold">
</p>


</div>


</div>
  

    <!-- ================= MEMBERSHIP ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-8">

        <h2 class="text-xl font-bold mb-5">

            Membership

        </h2>

        <div class="grid md:grid-cols-3 gap-4">

            <div>

                <label>Tempoh (Hari)</label>

                <input
                    id="memberValidity"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Yuran Daftar Consultant</label>

                <input
                    id="consultantRegistrationFee"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Yuran Renewal Consultant</label>

                <input
                    id="consultantRenewalFee"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <div class="text-right">

        <button id="saveSettings"
class="bg-[#153638] text-white px-6 py-3 rounded-xl">
💾 Simpan Settings
</button>


<button id="resetSettings"
class="bg-gray-300 px-6 py-3 rounded-xl">
Reset
</button>

    </div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ================= FIREBASE CONFIG =================

const firebaseConfig = {
            apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
            authDomain: "alqawthar-mywaris.firebaseapp.com",
            projectId: "alqawthar-mywaris",
            storageBucket: "alqawthar-mywaris.firebasestorage.app",
            messagingSenderId: "3498810778",
            appId: "1:3498810778:web:ee36e0fe42f76698046e23"
        };


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// ================= DEFAULT SETTINGS =================

const defaultCompanySettings = {

companyName:"AL-QAWTHAR MAWARIS SYNERGY SDN. BHD.",
companyPhone:"",
companyEmail:"",
companyAddress:""

};


const defaultCompensationSettings = {

wasiatPrice:350,
hibahPrice:2500,
sepencarianPrice:800,
mawarisPrice:3000,

wasiatRenewal:50,
hibahRenewal:50,
sepencarianRenewal:50,
mawarisRenewal:80,

commissionAQC:35,
commissionAQCAS:38,
commissionAQCUM:40,
commissionMGAM:45,

overrideAQC:0,
overrideAQCAS:3,
overrideAQCUM:4,
overrideMGAM:5,

companyPool:48,
commissionPool:35,
overridePool:12,

adminOperation:30,
allowance:10,
royalty:8,

memberValidity:365,

consultantRegistrationFee:200,

consultantRenewalFee:50

};


// ================= INPUT LIST =================

const companyFields = [
"companyName",
"companyPhone",
"companyEmail",
"companyAddress"
];


const compensationFields = [

"wasiatPrice",
"hibahPrice",
"sepencarianPrice",
"mawarisPrice",

"wasiatRenewal",
"hibahRenewal",
"sepencarianRenewal",
"mawarisRenewal",

"commissionAQC",
"commissionAQCAS",
"commissionAQCUM",
"commissionMGAM",

"overrideAQC",
"overrideAQCAS",
"overrideAQCUM",
"overrideMGAM",

"memberValidity",
"consultantRegistrationFee",
"consultantRenewalFee"

];

// ================= LOAD SETTINGS =================


async function loadSettings(){

const companyRef = doc(db,"settings","company");
const compensationRef = doc(db,"settings","compensation");

const companySnap = await getDoc(companyRef);
const compensationSnap = await getDoc(compensationRef);


let companyData;
let compensationData;


// COMPANY

if(companySnap.exists()){

companyData = companySnap.data();

}else{

companyData = defaultCompanySettings;

await setDoc(companyRef, companyData);

}


// COMPENSATION

if(compensationSnap.exists()){

compensationData = compensationSnap.data();

}else{

compensationData = defaultCompensationSettings;

await setDoc(compensationRef, compensationData);

}



// Load Company

companyFields.forEach(field=>{

let input=document.getElementById(field);

if(input){

input.value=companyData[field] ?? "";

}

});



// Load Compensation

compensationFields.forEach(field=>{

let input=document.getElementById(field);

if(input){

input.value=compensationData[field] ?? "";

}

});



// Revenue

companyPool.value =
compensationData.companyPool ?? 0;


commissionPool.value =
compensationData.commissionPool ?? 0;


overridePool.value =
compensationData.overridePool ?? 0;


adminOperation.value =
compensationData.adminOperation ?? 0;


allowance.value =
compensationData.allowance ?? 0;


royalty.value =
compensationData.royalty ?? 0;


checkRevenue();

}


function checkRevenue(){

let company =
Number(adminOperation.value)+
Number(allowance.value)+
Number(royalty.value);


let total =
Number(companyPool.value)+
Number(commissionPool.value)+
Number(overridePool.value);


revenueCheck.innerHTML =
`
Company Breakdown:
${company}% / ${companyPool.value}%

<br>

Total Allocation:
${total}%

`;
    

if(
company != Number(companyPool.value)
||
total != 95
){

revenueCheck.className=
"text-red-600";

saveSettings.disabled=true;

}else{


revenueCheck.className=
"text-green-600";

saveSettings.disabled=false;

}


}

[
companyPool,
commissionPool,
overridePool,
adminOperation,
allowance,
royalty

].forEach(x=>{

x.oninput=checkRevenue;

});

  
// ================= SAVE SETTINGS =================


document
.getElementById("saveSettings")
.addEventListener("click",async()=>{


let companyData = {};

let compensationData = {};


// ================= COMPANY DATA =================

companyData = {

companyName: companyName.value,

companyPhone: companyPhone.value,

companyEmail: companyEmail.value,

companyAddress: companyAddress.value

};



// ================= COMPENSATION DATA =================

compensationData = {

wasiatPrice:Number(wasiatPrice.value),
hibahPrice:Number(hibahPrice.value),
sepencarianPrice:Number(sepencarianPrice.value),
mawarisPrice:Number(mawarisPrice.value),


wasiatRenewal:Number(wasiatRenewal.value),
hibahRenewal:Number(hibahRenewal.value),
sepencarianRenewal:Number(sepencarianRenewal.value),
mawarisRenewal:Number(mawarisRenewal.value),



commissionAQC:Number(commissionAQC.value),
commissionAQCAS:Number(commissionAQCAS.value),
commissionAQCUM:Number(commissionAQCUM.value),
commissionMGAM:Number(commissionMGAM.value),



overrideAQC:Number(overrideAQC.value),
overrideAQCAS:Number(overrideAQCAS.value),
overrideAQCUM:Number(overrideAQCUM.value),
overrideMGAM:Number(overrideMGAM.value),



companyPool:Number(companyPool.value),

commissionPool:Number(commissionPool.value),

overridePool:Number(overridePool.value),



adminOperation:Number(adminOperation.value),

allowance:Number(allowance.value),

royalty:Number(royalty.value),



memberValidity:Number(memberValidity.value),

consultantRegistrationFee:Number(consultantRegistrationFee.value),

consultantRenewalFee:Number(consultantRenewalFee.value)

};



// SAVE FIRESTORE

await setDoc(
doc(db,"settings","company"),
companyData,
{merge:true}
);;


await setDoc(
doc(db,"settings","compensation"),
compensationData,
{merge:true}
);



alert("Settings berjaya disimpan");


});





// ================= RESET =================


document
.getElementById("resetSettings")
.addEventListener("click",()=>{


fields.forEach(field=>{


let input=document.getElementById(field);


if(input){

input.value=defaultSettings[field];

}


});

companyPool.value =
defaultSettings.revenueDistribution.companyPool;

commissionPool.value =
defaultSettings.revenueDistribution.commissionPool;

overridePool.value =
defaultSettings.revenueDistribution.overridePool;


adminOperation.value =
defaultSettings.revenueDistribution.companyBreakdown.adminOperation;


allowance.value =
defaultSettings.revenueDistribution.companyBreakdown.allowance;


royalty.value =
defaultSettings.revenueDistribution.companyBreakdown.royalty;


checkRevenue();

});

// INIT

loadSettings();


</script>
  
</body>
</html>
