<!DOCTYPE html>

<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AQM Management</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>
body{
font-family: Inter, sans-serif;
}

#listContainer{
    overflow-y:auto;
    overflow-x:auto;
    max-height:700px;
}

#listContainer table{
    border-collapse:separate;
    border-spacing:0;
}

#listContainer thead th{
    position:sticky;
    top:0;
    background:#153638;
    color:#fff;
    z-index:100;
}
  
</style>  
  
</head>

 
<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">
AQM Management
</h1>

<p>
Customers Management Centre
</p>

</div>

<div class="p-5">

<div class="flex justify-between items-center mb-5">

<a
href="admin-dashboard.html"
class="bg-gray-200 px-5 py-3 rounded-xl">

← Dashboard

</a>

<button
id="pdfBtn"
class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-xl">

Export PDF

</button>

</div>


<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500 text-sm">
Jumlah Pelanggan
</p>

<p
id="totalCustomer"
class="text-3xl font-bold">

0

</p>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500 text-sm">
Prospek
</p>

<p
id="prospekCustomer"
class="text-3xl font-bold text-yellow-600">

0

</p>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500 text-sm">
Ahli Aktif
</p>

<p
id="aktifCustomer"
class="text-3xl font-bold text-green-600">

0

</p>

</div>

<div class="bg-white p-5 rounded-xl shadow">

<p class="text-gray-500 text-sm">
Keahlian Tamat
</p>

<p
id="expiredCustomer"
class="text-3xl font-bold text-red-600">

0

</p>

</div>

</div>

  
<div
id="sectionTitle">

<h2
class="text-3xl font-bold mb-4 text-[#153638]">

Pengurusan Pelanggan (AQM)

</h2>

<input
id="searchInput"
type="text"
placeholder="Cari nama, email, no AQM, no AQC, referral atau tarikh daftar..."
class="w-full p-4 rounded-xl border border-gray-300 shadow-sm mb-6">

</div>

<div
id="printArea">

<div
id="listContainer"
class="bg-white rounded-xl shadow max-h-[700px] overflow-y-auto overflow-x-auto">

<table class="min-w-full bg-white border-separate border-spacing-0">


<thead>
  
<tr>
  
<th class="w-12 p-3 text-center">Bil</th>

<th class="w-28 p-3 text-left">Tarikh Daftar</th>

<th class="w-28 p-3 text-left">No AQM</th>

<th class="w-52 p-3 text-left">Nama</th>

<th class="w-72 p-3 text-left">Email</th>

<th class="w-28 p-3 text-center">Referral</th>

<th class="w-28 p-3 text-center">Status Ahli</th>

<th class="w-48 p-3 text-center">Status Dokumen</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>
  
<script type="module">  

// 1. Tarik db dan auth dari firebase.js (Letak kat atas sekali)
import { db, auth } from './firebase.js';

// 2. Tarik fungsi database (Buang getFirestore)
import {
    collection,
    getDocs,
    getDoc,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 3. Tarik fungsi login/user (Buang getAuth)
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// -- Selepas baris ini, awak dah boleh terus tulis kod fungsi awak --
// Contoh: onAuthStateChanged(auth, ... )
  
const params =
new URLSearchParams(location.search);

const filterStatus =
params.get("status");

onAuthStateChanged(auth, async (user) => {
    // Pastikan user wujud (sudah login) sebelum panggil database
    if (user) {
        const adminSnap = await getDoc(doc(db, "admins", user.uid));
        
        // Pastikan dokumen admin wujud dalam database
        if (adminSnap.exists()) {
            const admin = adminSnap.data();

            // Benarkan akses JIKA role adalah "admin" ATAU "superadmin"
            if (!["admin", "admin_ops", "superadmin"].includes(admin.role)) {
                window.location.href = "dashboard.html";
                return;
            }
        } else {
            // Jika tiada rekod dalam collection 'admins'
            window.location.href = "dashboard.html";
            return;
        }
    } else {
        // Jika belum login, tendang ke login page
        window.location.href = "login.html"; // Tukar ikut nama fail login awak
    }
});

  
const snapshot =
await getDocs(
collection(db,"users")
);

let html = "";

window.customerHTML = "";

let allCustomers = [];

const users =
snapshot.docs;

users.sort((a,b)=>{

const dateA =
a.data().createdAt?.toDate() || new Date(0);

const dateB =
b.data().createdAt?.toDate() || new Date(0);

return dateB - dateA;

});
  
let totalCustomer = 0;
let prospek = 0;
let aktif = 0;
let expired = 0;
  
let bil = 1;

// ===== STATUS BADGE =====
function getStatusBadge(status){

const color = {
    DRAFT:"bg-gray-100 text-gray-600",
    UNDER_REVIEW:"bg-yellow-100 text-yellow-700",
    APPROVED:"bg-blue-100 text-blue-700",
    VERIFIED:"bg-green-100 text-green-700",
    PRINTED:"bg-indigo-100 text-indigo-700",
    SENT:"bg-orange-100 text-orange-700",
    COMPLETED:"bg-emerald-100 text-emerald-700"
};

return `
<span class="inline-block mt-1 px-2 py-1 rounded-full text-[10px] font-semibold ${color[status] || color.DRAFT}">
${status || "DRAFT"}
</span>
`;

}

for(const userDoc of users){

const user = userDoc.data();

// Skip admin & consultant
if(
user.role==="admin" ||
user.role==="consultant"
){
continue;
}

totalCustomer++;

const memberNo = user.memberNo || "-";

const isActive =

user.wasiatPaymentStatus === "paid" ||

user.hibahPaymentStatus === "paid" ||

user.sepencarianPaymentStatus === "paid" ||

user.mawarisPaymentStatus === "paid";

const status =

isActive

? "AHLI AKTIF"

: "PROSPEK";



const isExpired =
user.expiryDate &&
new Date(user.expiryDate) < new Date();

if(isExpired){

    expired++;

}
else if(isActive){

    aktif++;

}
else{

    prospek++;

}
  
let registerDate = "-";

if(user.createdAt){

registerDate =
user.createdAt
.toDate()
.toLocaleDateString("ms-MY");

}

let matchFilter = !filterStatus;  
let pendingList = [];

const [
    wasiatSnap,
    hibahSnap,
    sepencarianSnap,
    mawarisSnap
] = await Promise.all([
    getDoc(doc(db,"users",userDoc.id,"wasiat","maklumat")),
    getDoc(doc(db,"users",userDoc.id,"hibah","maklumat")),
    getDoc(doc(db,"users",userDoc.id,"sepencarian","maklumat")),
    getDoc(doc(db,"users",userDoc.id,"mawaris","maklumat"))
]);
  
// =====================
// WASIAT
// =====================

if (wasiatSnap.exists()) {

    const data = wasiatSnap.data();

if(filterStatus && data.status === filterStatus){
    matchFilter = true;
}
  
    const icon = {
    DRAFT: "📝",
    UNDER_REVIEW: "🟡",
    APPROVED: "👍",
    VERIFIED: "🟢",
    PRINTED: "🖨",
    SENT: "📦",
    COMPLETED: "✅"
};

pendingList.push(`
<div class="text-left">
    <div>${icon[data.status] || "📄"} ${data.docRef || "-"}</div>
    <div class="text-xs text-gray-500">
${getStatusBadge(data.status) || "DRAFT"}
</div>
</div>
`);
}

// =====================
// HIBAH
// =====================

if (hibahSnap.exists()) {

    const data = hibahSnap.data();

if(filterStatus && data.status === filterStatus){
    matchFilter = true;
}
  
    const icon = {
    DRAFT: "📝",
    UNDER_REVIEW: "🟡",
    APPROVED: "👍",
    VERIFIED: "🟢",
    PRINTED: "🖨",
    SENT: "📦",
    COMPLETED: "✅"
};

pendingList.push(`
<div class="text-left">
    <div>${icon[data.status] || "📄"} ${data.docRef || "-"}</div>
    <div class="text-xs text-gray-500">
${getStatusBadge(data.status) || "DRAFT"}
</div>
</div>
`);
}

// =====================
// HARTA SEPENCARIAN
// =====================

if (sepencarianSnap.exists()) {

    const data = sepencarianSnap.data();

if(filterStatus && data.status === filterStatus){
    matchFilter = true;
}
  
    const icon = {
    DRAFT: "📝",
    UNDER_REVIEW: "🟡",
    APPROVED: "👍",
    VERIFIED: "🟢",
    PRINTED: "🖨",
    SENT: "📦",
    COMPLETED: "✅"
};

pendingList.push(`
<div class="text-left">
    <div>${icon[data.status] || "📄"} ${data.docRef || "-"}</div>
    <div class="text-xs text-gray-500">
${getStatusBadge(data.status) || "DRAFT"}
</div>
</div>
`);
}

// =====================
// MAWARIS
// =====================

if (mawarisSnap.exists()) {

    const data = mawarisSnap.data();

if(filterStatus && data.status === filterStatus){
    matchFilter = true;
}
  
    const icon = {
    DRAFT: "📝",
    UNDER_REVIEW: "🟡",
    APPROVED: "👍",
    VERIFIED: "🟢",
    PRINTED: "🖨",
    SENT: "📦",
    COMPLETED: "✅"
};

pendingList.push(`
<div class="text-left">
    <div>${icon[data.status] || "📄"} ${data.docRef || "-"}</div>
    <div class="text-xs text-gray-500">
${getStatusBadge(data.status) || "DRAFT"}
</div>
</div>
`);
}

const pending =
pendingList.length
? pendingList.join("<br>")
: "-";

if(!matchFilter){
    continue;
}
  
html += `

<tr
class="border-b hover:bg-gray-50 cursor-pointer"
onclick="window.location='customer-details.html?id=${userDoc.id}'">

<td class="p-3">
${bil++}
</td>


<td class="p-3">

${registerDate}

</td>

<td class="p-3">

${memberNo}

</td>

<td class="p-3 font-semibold">

${user.nama || "-"}

</td>

<td class="p-3">

${user.email || "-"}

</td>

<td class="p-3">

${user.referral || "-"}

</td>

<td class="p-3 text-center">

<span
class="
inline-flex
items-center
justify-center
px-2
py-1
rounded-full
text-[11px]
font-semibold
whitespace-nowrap
${isActive
? "bg-green-100 text-green-700"
: "bg-yellow-100 text-yellow-700"}
">

${status}

</span>

</td>

<td class="p-3 text-center">

${pending}

</td>

</tr>

`;
  
}

document
.getElementById("pdfBtn")
.addEventListener("click",()=>{

const element =
document.getElementById("printArea");

html2pdf()
.set({

margin:0.3,

filename:"AQM-Customer-List.pdf",

image:{
type:"jpeg",
quality:1
},

html2canvas:{
scale:2
},

jsPDF:{
unit:"in",
format:"a4",
orientation:"landscape"
}

})
.from(element)
.save();

});

  
document.getElementById(
"tableBody"
).innerHTML = html;

document.getElementById(
"totalCustomer"
).innerHTML =
totalCustomer;

document.getElementById(
"prospekCustomer"
).innerHTML =
prospek;

document.getElementById(
"aktifCustomer"
).innerHTML =
aktif;

document.getElementById(
"expiredCustomer"
).innerHTML =
expired;

  
document
.getElementById("searchInput")
.addEventListener("keyup",(e)=>{

const keyword =
e.target.value.toLowerCase();

const rows =
document.querySelectorAll(
"#tableBody tr"
);

rows.forEach((row)=>{

const text =
row.innerText.toLowerCase();

row.style.display =
text.includes(keyword)
? ""
: "none";

});

});
  
});

</script>

</body>

</html>
