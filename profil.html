<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen" style="font-family: 'Inter', sans-serif;">

<header class="bg-[#153638] text-white px-5 pt-5 pb-6">
  <div class="max-w-md mx-auto">
    <a href="dashboard.html" class="hidden md:inline-block text-sm text-white/80 hover:text-white mb-3">&larr; Kembali ke Dashboard</a>
    <div class="flex items-center gap-4">
      <div id="avatar" class="w-14 h-14 rounded-full bg-white/15 flex items-center justify-center text-xl font-bold">-</div>
      <div>
        <h1 id="nama" class="text-xl font-bold">Memuatkan...</h1>
        <p id="noAhli" class="text-sm text-white/80"></p>
      </div>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 py-5 pb-32 flex flex-col gap-4">

  <section class="bg-white rounded-2xl p-4 shadow-sm">
    <h2 class="text-xs font-bold tracking-wider text-gray-600 mb-3">MAKLUMAT AHLI</h2>
    <dl class="flex flex-col divide-y divide-gray-100 text-sm">
      <div class="flex justify-between gap-4 py-2.5"><dt class="text-gray-600">Telefon</dt><dd id="telefon" class="font-semibold text-gray-800 text-right">-</dd></div>
      <div class="flex justify-between gap-4 py-2.5"><dt class="text-gray-600">Emel</dt><dd id="email" class="font-semibold text-gray-800 text-right break-all">-</dd></div>
      <div class="flex justify-between gap-4 py-2.5"><dt class="text-gray-600">Perunding</dt><dd id="perunding" class="font-semibold text-gray-800 text-right">-</dd></div>
    </dl>
  </section>

  <nav aria-label="Menu profil" class="bg-white rounded-2xl shadow-sm divide-y divide-gray-100">
    <a href="payment-aqm-receipts.html" class="flex items-center justify-between px-4 min-h-[56px] text-gray-800 font-semibold">
      Resit Saya
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="introducer.html" id="pautanIntroducer" class="hidden items-center justify-between px-4 min-h-[56px] text-indigo-700 font-semibold">
      myIntroducer
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="change-password.html" class="flex items-center justify-between px-4 min-h-[56px] text-gray-800 font-semibold">
      Tukar Kata Laluan
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </nav>

  <button type="button" id="logoutBtn" class="w-full min-h-[52px] rounded-2xl bg-red-600 hover:bg-red-700 text-white font-bold">Log Keluar</button>
</main>

<div id="mNav"></div>

<script type="module">
import { db, auth } from './firebase.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { navMobile, bacaPautanDipilih } from './aqm-mobile.js';

document.getElementById("mNav").innerHTML = navMobile("profil", bacaPautanDipilih());

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }

  const snap = await getDoc(doc(db, "users", user.uid));
  if (snap.exists()) {
    const u = snap.data();
    const nama = u.nama || "-";
    document.getElementById("avatar").textContent = (nama.trim()[0] || "A").toUpperCase();
    document.getElementById("nama").textContent = nama;
    document.getElementById("noAhli").textContent = "No. Ahli: " + (u.memberNo || "-");
    document.getElementById("telefon").textContent = u.telefon || "-";
    document.getElementById("email").textContent = u.email || "-";
    document.getElementById("perunding").textContent = u.referral || "-";
    if (u.isIntroducer === true) {
      const p = document.getElementById("pautanIntroducer");
      p.classList.remove("hidden"); p.classList.add("flex");
    }
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    localStorage.clear();
    sessionStorage.clear();
    window.location.replace("index.html");
  } catch (e) {
    console.error(e);
    alert("Gagal log keluar. Sila cuba lagi.");
  }
});
</script>
</body>
</html>
