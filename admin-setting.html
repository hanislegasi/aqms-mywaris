<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Settings</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
font-family: Inter, sans-serif;
}
</style>  
  
</head>

<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">

Admin Settings

</h1>

</div>

<div class="max-w-6xl mx-auto p-5">

<a
href="admin-dashboard.html"
class="bg-gray-200 px-5 py-3 rounded-xl inline-block mb-5">

← Dashboard

</a>
<div class="max-w-6xl mx-auto p-6">

    
    <!-- ================= COMPANY ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">
            Maklumat Syarikat
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>
                <label class="font-medium">Nama Syarikat</label>

                <input
                    id="companyName"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Telefon</label>

                <input
                    id="companyPhone"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Email</label>

                <input
                    id="companyEmail"
                    type="email"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

            <div>
                <label class="font-medium">Alamat</label>

                <input
                    id="companyAddress"
                    type="text"
                    class="w-full border rounded-xl p-3 mt-1">
            </div>

        </div>

    </div>



    <!-- ================= PRODUCT ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Harga Produk

        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>

                <label>Wasiat (RM)</label>

                <input
                    id="wasiatPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Hibah (RM)</label>

                <input
                    id="hibahPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Sepencarian (RM)</label>

                <input
                    id="sepencarianPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Mawaris (RM)</label>

                <input
                    id="mawarisPrice"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= RENEWAL ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Renewal Produk

        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>

                <label>Renewal Wasiat</label>

                <input
                    id="wasiatRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Hibah</label>

                <input
                    id="hibahRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Sepencarian</label>

                <input
                    id="sepencarianRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Renewal Mawaris</label>

                <input
                    id="mawarisRenewal"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= COMMISSION ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Commission (%)

        </h2>

        <div class="grid md:grid-cols-4 gap-4">

            <div>

                <label>AQC</label>

                <input
                    id="commissionAQC"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-AS</label>

                <input
                    id="commissionAQCAS"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-UM</label>

                <input
                    id="commissionAQCUM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>MGAM</label>

                <input
                    id="commissionMGAM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= OVERRIDE ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-6">

        <h2 class="text-xl font-bold mb-5">

            Override (%)

        </h2>

        <div class="grid md:grid-cols-4 gap-4">

            <div>

                <label>AQC</label>

                <input
                    id="overrideAQC"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-AS</label>

                <input
                    id="overrideAQCAS"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>AQC-UM</label>

                <input
                    id="overrideAQCUM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>MGAM</label>

                <input
                    id="overrideMGAM"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <!-- ================= MEMBERSHIP ================= -->

    <div class="bg-white rounded-2xl shadow p-6 mb-8">

        <h2 class="text-xl font-bold mb-5">

            Membership

        </h2>

        <div class="grid md:grid-cols-3 gap-4">

            <div>

                <label>Tempoh (Hari)</label>

                <input
                    id="memberValidity"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Yuran Daftar Consultant</label>

                <input
                    id="consultantRegistrationFee"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

            <div>

                <label>Yuran Renewal Consultant</label>

                <input
                    id="consultantRenewalFee"
                    type="number"
                    class="w-full border rounded-xl p-3 mt-1">

            </div>

        </div>

    </div>



    <div class="text-right">

        <button id="saveSettings">
    💾 Simpan Settings
</button>

<button id="resetSettings">
    Reset
</button>

    </div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ================= FIREBASE CONFIG =================

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// ================= DEFAULT SETTINGS =================

const defaultSettings = {


companyName:"Hans Legasi Resources Sdn Bhd",

companyPhone:"",

companyEmail:"",

companyAddress:"",



wasiatPrice:200,

hibahPrice:2500,

sepencarianPrice:2000,

mawarisPrice:0,



wasiatRenewal:100,

hibahRenewal:500,

sepencarianRenewal:500,

mawarisRenewal:0,



commissionAQC:40,

commissionAQCAS:35,

commissionAQCUM:20,

commissionMGAM:5,



overrideAQC:2,

overrideAQCAS:2,

overrideAQCUM:2,

overrideMGAM:1,



memberValidity:365,

consultantRegistrationFee:200,

consultantRenewalFee:50


};



// ================= INPUT LIST =================

const fields = Object.keys(defaultSettings);



// ================= LOAD SETTINGS =================


async function loadSettings(){


const ref = doc(db,"settings","system");


const snap = await getDoc(ref);



let data;



if(snap.exists()){

data=snap.data();

}

else{

data=defaultSettings;

await setDoc(ref,data);

}




fields.forEach(field=>{


let input=document.getElementById(field);


if(input){

input.value=data[field] ?? "";

}


});


}




// ================= SAVE SETTINGS =================


document
.getElementById("saveSettings")
.addEventListener("click",async()=>{


let data={};


fields.forEach(field=>{


let input=document.getElementById(field);


if(input){

data[field]=
input.type==="number"
?
Number(input.value)
:
input.value;


}


});



await setDoc(
doc(db,"settings","system"),
data
);



alert("Settings berjaya disimpan");


});





// ================= RESET =================


document
.getElementById("resetSettings")
.addEventListener("click",()=>{


fields.forEach(field=>{


let input=document.getElementById(field);


if(input){

input.value=defaultSettings[field];

}


});


});




// INIT

loadSettings();


</script>
