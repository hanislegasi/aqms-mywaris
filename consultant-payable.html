<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultant Payable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jsPDF & AutoTable untuk Penjanaan PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: Inter, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="bg-gray-100">

    <div class="bg-[#153638] text-white p-5">
        <h1 class="text-2xl font-bold">Consultant Payable</h1>
        <p class="text-sm text-gray-300">Pengurusan Agihan Komisen & Override Konsultan</p>
    </div>

    <div class="p-5">

        <!-- Top Bar: Navigasi & Butang Batch PDF -->
        <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
            <a href="accounts-dashboard.html" class="inline-block bg-gray-200 px-5 py-3 rounded-xl text-gray-800 hover:bg-gray-300 transition font-medium">
                &larr; Akaun
            </a>
            
            <button onclick="generateBatchPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl shadow-lg transition font-semibold flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                Cetak PDF Pilihan (Batch)
            </button>
        </div>

        <div class="flex items-center text-sm text-gray-500 mb-2 md:hidden">
            <svg class="w-4 h-4 mr-2 text-blue-500 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
            </svg>
            <span>Tatal ke kanan untuk melihat jadual penuh.</span>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full min-w-[750px]">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <!-- Checkbox Select All -->
                            <th class="p-3 text-center w-12">
                                <input type="checkbox" id="selectAll" onclick="toggleAll(this)" class="w-4 h-4 cursor-pointer accent-indigo-500 rounded">
                            </th>
                            <th class="p-3 text-left">Consultant</th>
                            <th class="p-3 text-left">Nama</th>
                            <th class="p-3 text-right">Amount (RM)</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="payableTable">
                        <tr>
                            <td colspan="5" class="p-5 text-center text-gray-500">Memuatkan data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. Tarik 'db' dari fail konfigurasi berpusat
import { db } from './firebase.js';

// 2. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    collection, 
    getDocs, 
    doc, 
    getDoc, 
    addDoc, 
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        let globalConsultantData = {};
        let companyProfile = {
            companyName: "AL-QAWTHAR MAWARIS SDN. BHD.",
            registrationNo: "123456AQMS"
        };

        async function loadCompanySettings() {
            try {
                const docRef = doc(db, "settings", "company");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    companyProfile.companyName = data.companyName || companyProfile.companyName;
                    companyProfile.registrationNo = data.registrationNo || companyProfile.registrationNo;
                }
            } catch (err) {
                console.error("Gagal menarik tetapan syarikat:", err);
            }
        }

        async function loadData() {
            try {
                await loadCompanySettings();

                // 1. Tarik maklumat bank konsultan
                const consultantsSnap = await getDocs(collection(db, "consultants"));
                const bankDetailsMap = {};
                consultantsSnap.forEach(d => {
                    const data = d.data();
                    const key = data.consultantNo || data.aqcNo || d.id;
                    if (key) {
                        bankDetailsMap[key] = {
                            ic: data.ic || "-",
                            bankName: data.bankName || "-",
                            bankAccount: data.bankAccount || "-"
                        };
                    }
                });

                const groupedData = {};

                // 2. Tarik KOMISEN dari `ledger`
                const ledgerSnap = await getDocs(collection(db, "ledger"));
                ledgerSnap.forEach((d) => {
                    const row = d.data();

                    if(row.accountCode !== "2000" || !row.description || !row.description.startsWith("AQC")) return;

                    const status = String(row.status || "").toUpperCase();
                    if (status === "PV_GENERATED" || status === "PAID") return;

                    const rawType = String(row.type || "").toUpperCase();
                    const rawDesc = String(row.description || "").toUpperCase();
                    
                    if (rawType.includes("USB") || rawDesc.includes("USB")) return; 

                    const consultantStr = row.description;
                    const cNo = consultantStr.split(" ")[0]; 
                    const cName = consultantStr.substring(cNo.length).trim(); 

                    if(!groupedData[cNo]){
                        const bankInfo = bankDetailsMap[cNo] || { ic: "-", bankName: "-", bankAccount: "-" };
                        groupedData[cNo] = {
                            consultantNo: cNo,
                            nama: cName || consultantStr,
                            ic: bankInfo.ic,
                            bankName: bankInfo.bankName,
                            bankAccount: bankInfo.bankAccount,
                            commission: 0,
                            override: 0,
                            totalAmount: 0,
                            docIds: [],        // ID utk ledger
                            overrideDocIds: [] // ID utk overrideHistory
                        };
                    }

                    const amt = Number(row.credit || 0);

                    // Just in case override masih ada sisa dlm ledger, kita asingkan juga.
                    if (rawType.includes("OVERRIDE") || rawDesc.includes("OVERRIDE")) {
                        groupedData[cNo].override += amt;
                    } else {
                        groupedData[cNo].commission += amt;
                    }

                    groupedData[cNo].totalAmount += amt;
                    groupedData[cNo].docIds.push(d.id);
                });

                // 3. Tarik OVERRIDE dari `overrideHistory`
                const overrideSnap = await getDocs(collection(db, "overrideHistory"));
                overrideSnap.forEach((d) => {
                    const row = d.data();
                    
                    // Semak status, jika dah dibayar/generate PV, abaikan
                    const status = String(row.status || "").toUpperCase();
                    if (status === "PV_GENERATED" || status === "PAID") return;

                    const cNo = row.receiver; // Rujuk gambar: field 'receiver' pegang AQC No.
                    if (!cNo) return;

                    if(!groupedData[cNo]){
                        const bankInfo = bankDetailsMap[cNo] || { ic: "-", bankName: "-", bankAccount: "-" };
                        groupedData[cNo] = {
                            consultantNo: cNo,
                            nama: row.receiverName || cNo,
                            ic: bankInfo.ic,
                            bankName: bankInfo.bankName,
                            bankAccount: bankInfo.bankAccount,
                            commission: 0,
                            override: 0,
                            totalAmount: 0,
                            docIds: [],
                            overrideDocIds: []
                        };
                    }

                    const amt = Number(row.override || 0); // Rujuk gambar: field 'override' pegang nilai amount
                    groupedData[cNo].override += amt;
                    groupedData[cNo].totalAmount += amt;
                    groupedData[cNo].overrideDocIds.push(d.id);
                });

                globalConsultantData = groupedData;
                let html = "";

                Object.keys(groupedData).forEach((cNo) => {
                    const item = groupedData[cNo];
                    if (item.totalAmount <= 0) return; 

                    const docIdsString = JSON.stringify(item.docIds).replace(/"/g, '&quot;');
                    const overrideDocIdsString = JSON.stringify(item.overrideDocIds).replace(/"/g, '&quot;');

                    html += `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-4 text-center">
                                <input type="checkbox" value="${item.consultantNo}" class="batch-checkbox w-4 h-4 cursor-pointer accent-indigo-500 rounded">
                            </td>
                            <td class="p-4 font-bold text-[#153638]">${item.consultantNo}</td>
                            <td class="p-4 font-semibold text-gray-800">${item.nama}</td>
                            <td class="p-4 text-right font-bold text-green-600">RM${formatRM(item.totalAmount)}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="toggleDetail('${item.consultantNo}')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 transition shadow text-xs md:text-sm mb-1">
                                    View
                                </button>
                                <button onclick="downloadSinglePDF('${item.consultantNo}')" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg hover:bg-purple-700 transition shadow text-xs md:text-sm mb-1">
                                    PDF Single
                                </button>
                                <button onclick="generatePV('${item.consultantNo}', '${item.nama}', ${item.totalAmount}, '${docIdsString}', '${overrideDocIdsString}', this)" class="bg-green-600 text-white px-3 py-1.5 rounded-lg hover:bg-green-700 transition shadow text-xs md:text-sm mb-1">
                                    Generate PV
                                </button>
                            </td>
                        </tr>

                        <!-- Sub-Jadual -->
                        <tr id="${item.consultantNo}" class="hidden bg-blue-50 border-b-2 border-blue-200">
                            <td colspan="5" class="p-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm bg-white p-4 rounded-lg shadow-sm">
                                    <div>
                                        <p class="text-gray-500 font-medium">Commission</p>
                                        <p class="text-lg font-bold text-gray-800">RM${formatRM(item.commission)}</p>
                                    </div>
                                    <div>
                                        <p class="text-gray-500 font-medium">Override</p>
                                        <p class="text-lg font-bold text-gray-800">RM${formatRM(item.override)}</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("payableTable").innerHTML = html || '<tr><td colspan="5" class="p-5 text-center text-gray-500 font-medium">Tiada bayaran tertunggak.</td></tr>';

            } catch (err) {
                console.error("Ralat:", err);
                document.getElementById("payableTable").innerHTML = '<tr><td colspan="5" class="p-5 text-center text-red-500 font-bold">Gagal memuatkan rekod pangkalan data.</td></tr>';
            }
        }

        loadData();

        window.toggleDetail = function(id) {
            document.getElementById(id).classList.toggle("hidden");
        };

        // Fungsi Checkbox Select All
        window.toggleAll = function(source) {
            const checkboxes = document.querySelectorAll('.batch-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = source.checked;
            });
        };

        // Fungsi Penjanaan Batch PDF (Gabung berbilang pilihan)
        window.generateBatchPDF = function() {
            const checkboxes = document.querySelectorAll('.batch-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Sila tandakan (tick) sekurang-kurangnya satu nama konsultan untuk dicetak.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text((companyProfile.companyName || "").toUpperCase(), 14, 15);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`No. Pendaftaran Syarikat: ${companyProfile.registrationNo || "-"}`, 14, 21);
            doc.text("SENARAI BAYARAN KOMISEN & OVERRIDE (BERKELOMPOK) UNTUK URUSAN BANK", 14, 26);

            doc.setLineWidth(0.5);
            doc.line(14, 29, 196, 29);

            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text(`Tarikh Cetakan : ${new Date().toLocaleDateString('ms-MY')}`, 14, 36);

            let totalKeseluruhan = 0;
            const tableRows = [];

            checkboxes.forEach((cb, index) => {
                const cNo = cb.value;
                const item = globalConsultantData[cNo];
                
                totalKeseluruhan += item.totalAmount;
                
                tableRows.push([
                    index + 1,
                    item.consultantNo,
                    item.nama.toUpperCase(),
                    item.ic,
                    item.bankName,
                    item.bankAccount,
                    formatRM(item.commission),
                    formatRM(item.override),
                    formatRM(item.totalAmount)
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['Bil', 'No. AQC', 'Nama Penerima', 'No. IC', 'Nama Bank', 'No. Akaun', 'Komisen (RM)', 'Override (RM)', 'Jumlah (RM)']],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [21, 54, 56], textColor: [255, 255, 255], fontStyle: 'bold' },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 8 },
                    1: { cellWidth: 20 },
                    2: { cellWidth: 38 },
                    3: { cellWidth: 26 },
                    4: { cellWidth: 22 },
                    5: { cellWidth: 24 },
                    6: { halign: 'right', cellWidth: 20 },
                    7: { halign: 'right', cellWidth: 20 },
                    8: { halign: 'right', cellWidth: 22 }
                },
                styles: { fontSize: 7.5, cellPadding: 2 }
            });

            const finalY = doc.lastAutoTable.finalY + 8;
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text(`JUMLAH KESELURUHAN KELOMPOK: RM ${formatRM(totalKeseluruhan)}`, 196, finalY, { align: "right" });

            const signY = finalY + 20;
            if (signY < 260) {
                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text("Disediakan Oleh:", 14, signY);
                doc.text("_______________________", 14, signY + 15);
                doc.text("Bahagian Akaun & Kewangan", 14, signY + 20);

                doc.text("Disahkan Oleh:", 130, signY);
                doc.text("_______________________", 130, signY + 15);
                doc.text("Pengarah / Kelulusan", 130, signY + 20);
            }

            doc.save(`Bank_Listing_Batch_${Date.now()}.pdf`);
        };

        // Fungsi Penjanaan PDF Single (Satu Persatu)
        window.downloadSinglePDF = function(cNo) {
            const item = globalConsultantData[cNo];
            if (!item) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text((companyProfile.companyName || "").toUpperCase(), 14, 15);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`No. Pendaftaran Syarikat: ${companyProfile.registrationNo || "-"}`, 14, 21);
            doc.text("SENARAI BAYARAN KOMISEN & OVERRIDE KONSULTAN (UNTUK URUSAN BANK)", 14, 26);

            doc.setLineWidth(0.5);
            doc.line(14, 29, 196, 29);

            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text(`Tarikh Cetakan : ${new Date().toLocaleDateString('ms-MY')}`, 14, 36);

            doc.autoTable({
                startY: 42,
                head: [['Bil', 'No. AQC', 'Nama Penerima', 'No. IC', 'Nama Bank', 'No. Akaun', 'Komisen (RM)', 'Override (RM)', 'Jumlah (RM)']],
                body: [[1, item.consultantNo, item.nama.toUpperCase(), item.ic, item.bankName, item.bankAccount, formatRM(item.commission), formatRM(item.override), formatRM(item.totalAmount)]],
                theme: 'grid',
                headStyles: { fillColor: [21, 54, 56], textColor: [255, 255, 255], fontStyle: 'bold' },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 8 }, 1: { cellWidth: 20 }, 2: { cellWidth: 38 }, 3: { cellWidth: 26 },
                    4: { cellWidth: 22 }, 5: { cellWidth: 24 }, 6: { halign: 'right', cellWidth: 20 }, 7: { halign: 'right', cellWidth: 20 }, 8: { halign: 'right', cellWidth: 22 }
                },
                styles: { fontSize: 7.5, cellPadding: 2 }
            });

            const finalY = doc.lastAutoTable.finalY + 8;
            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text(`JUMLAH KESELURUHAN: RM ${formatRM(item.totalAmount)}`, 196, finalY, { align: "right" });

            const signY = finalY + 20;
            if (signY < 260) {
                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text("Disediakan Oleh:", 14, signY);
                doc.text("_______________________", 14, signY + 15);
                doc.text("Disahkan Oleh:", 130, signY);
                doc.text("_______________________", 130, signY + 15);
            }

            doc.save(`Bank_Listing_${item.consultantNo}.pdf`);
        };

        // Generate PV
        window.generatePV = async (consultantNo, consultantName, amount, docIdsJson, overrideDocIdsJson, button) => {
            try {
                if (!confirm(`Sahkan penjanaan PV untuk ${consultantNo} berjumlah RM${formatRM(amount)}?`)) return;
                
                button.disabled = true;
                button.innerText = "Memproses...";

                const docIds = JSON.parse(docIdsJson);
                const overrideDocIds = JSON.parse(overrideDocIdsJson);
                const pvNo = "PV-" + Date.now();

                // 1. Masukkan rekod ke Payment Vouchers
                await addDoc(collection(db, "paymentVouchers"), {
                    pvNo, consultantNo, consultantName, amount: Number(amount),
                    status: "PENDING", createdAt: new Date(), accountCode: "2000"
                });

                // 2. Update status dalam 'ledger'
                for (let i = 0; i < docIds.length; i++) {
                    const docRef = doc(db, "ledger", docIds[i]);
                    await updateDoc(docRef, { status: "PV_GENERATED" });
                }

                // 3. Update status dalam 'overrideHistory'
                for (let i = 0; i < overrideDocIds.length; i++) {
                    const overrideRef = doc(db, "overrideHistory", overrideDocIds[i]);
                    await updateDoc(overrideRef, { status: "PV_GENERATED" });
                }

                alert(`Berjaya! Payment Voucher (${pvNo}) telah dicipta untuk ${consultantNo}.`);
                location.reload();
                
            } catch (err) {
                button.disabled = false;
                button.innerText = "Generate PV";
                console.error(err);
                alert("Ralat: " + err.message);
            }
        };
    </script>
</body>
</html>
