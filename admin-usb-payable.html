<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - USB Payable & Maturity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">
    
    <div class="bg-[#153638] text-white p-5 shadow mb-5">
        <h1 class="text-2xl font-bold">Pengurusan USB Matured Payable</h1>
        <p class="text-sm opacity-90">Semakan tempoh matang simpanan USB konsultan (Tempoh kunci: <span id="lockYears">3</span> Tahun)</p>
    </div>

    <div class="p-5">
        <a href="accounts-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 transition px-5 py-3 rounded-xl mb-5 text-sm font-semibold text-gray-700">← Dashboard</a>
        
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <th class="p-4 text-left">No. Konsultan</th>
                            <th class="p-4 text-left">Nama Konsultan</th>
                            <th class="p-4 text-center">Tarikh 1st Receive</th>
                            <th class="p-4 text-center">Tempoh Pegangan</th>
                            <th class="p-4 text-right">Jumlah USB (RM)</th>
                            <th class="p-4 text-center">Status Matang</th>
                            <th class="p-4 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsbTableBody">
                        <tr>
                            <td colspan="7" class="p-6 text-center text-gray-500">Memuatkan senarai USB konsultan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
       // 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import { 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import { 
    collection, 
    getDocs, 
    doc, 
    getDoc, 
    addDoc, 
    query, 
    where 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                // 1. Ambil Setting Tempoh Matang (Default 3 tahun)
                const compSnap = await getDoc(doc(db, "settings", "compensation"));
                const compData = compSnap.exists() ? compSnap.data() : {};
               const lockYears = compData.usbLockPeriod !== undefined ? Number(compData.usbLockPeriod) : 3;
                
                // Kemaskini paparan teks tajuk atas
                const lockYearsEl = document.getElementById("lockYears");
                if (lockYearsEl) lockYearsEl.textContent = lockYears;

                // 2. Tarik semua data dari lejer akaun 2150
                const ledgerSnap = await getDocs(query(collection(db, "ledger"), where("accountCode", "==", "2150")));
                
                let consultantUsbMap = {};

                ledgerSnap.forEach(d => {
                    const row = d.data();
                    const cNo = row.consultantNo;
                    if (!cNo) return;

                    if (!consultantUsbMap[cNo]) {
                        consultantUsbMap[cNo] = {
                            balance: 0,
                            firstDate: null,
                            latestPayoutDate: null // TAMBAHAN: Pegang tarikh akhir bayar
                        };
                    }

                    const credit = Number(row.credit || 0);
                    const debit = Number(row.debit || 0);
                    consultantUsbMap[cNo].balance += (credit - debit);

                    if (row.date) {
                        const trxDate = row.date.toDate ? row.date.toDate() : new Date(row.date);
                        
                        // Cari tarikh transaksi paling awal (1st receive)
                        if (!consultantUsbMap[cNo].firstDate || trxDate < consultantUsbMap[cNo].firstDate) {
                            consultantUsbMap[cNo].firstDate = trxDate;
                        }
                        
                        // TAMBAHAN: Cari tarikh pengeluaran terkini (debit)
                        if (debit > 0) {
                            if (!consultantUsbMap[cNo].latestPayoutDate || trxDate > consultantUsbMap[cNo].latestPayoutDate) {
                                consultantUsbMap[cNo].latestPayoutDate = trxDate;
                            }
                        }
                    }
                });

                // Tarik maklumat nama konsultan
                const consultantsSnap = await getDocs(collection(db, "consultants"));
                let nameMap = {};
                consultantsSnap.forEach(d => {
                    const c = d.data();
                    if (c.consultantNo) nameMap[c.consultantNo] = c.nama || "-";
                });

                let html = "";
                const now = new Date();

                // Gelung untuk bina jadual konsultan
                for (const cNo in consultantUsbMap) {
                    const data = consultantUsbMap[cNo];
                    
                    // Kita buang "if (data.balance <= 0) continue;" supaya rekod yang dah dibayar tak ghaib

                    const firstDate = data.firstDate || now;
                    let maturityDate = new Date(firstDate);
                    maturityDate.setFullYear(maturityDate.getFullYear() + lockYears); 
                    
                    const isMatured = now >= maturityDate;
                    const formatDate = (d) => d.toLocaleDateString("ms-MY", { year: 'numeric', month: 'short', day: 'numeric' });

                    // TAMBAHAN: Logik Butang dan Lencana Status
                    let statusBadge = "";
                    let actionBtn = "";

                    if (data.balance <= 0) {
                        if (data.latestPayoutDate) {
                            const payoutStr = formatDate(data.latestPayoutDate);
                            statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">TELAH DIBAYAR: ${payoutStr.toUpperCase()}</span>`;
                        } else {
                            statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-600">BAKI KOSONG</span>`;
                        }
                        actionBtn = `<span class="text-xs text-gray-400 font-medium">Selesai</span>`;
                    } else if (isMatured) {
                        const safeName = (nameMap[cNo] || "-").replace(/'/g, "\\'"); // Elak ralat jika nama ada tanda koma atas
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">MATANG (READY)</span>`;
                        actionBtn = `<button onclick="generatePV('${cNo}', '${safeName}', ${data.balance})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Jana PV</button>`;
                    } else {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700">DALAM TEMPOH SIMPANAN</span>`;
                        actionBtn = `<span class="text-xs text-gray-400">Belum Matang</span>`;
                    }

                    html += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-bold text-[#153638]">${cNo}</td>
                        <td class="p-4">${nameMap[cNo] || "-"}</td>
                        <td class="p-4 text-center">${formatDate(firstDate)}</td>
                        <td class="p-4 text-center">${formatDate(maturityDate)}</td>
                        <td class="p-4 text-right font-bold ${data.balance > 0 ? 'text-green-600' : 'text-gray-400'}">RM${formatRM(data.balance)}</td>
                        <td class="p-4 text-center">
                            ${statusBadge}
                        </td>
                        <td class="p-4 text-center">
                            ${actionBtn}
                        </td>
                    </tr>
                    `;
                }

                if (html === "") {
                    html = `<tr><td colspan="7" class="p-6 text-center text-gray-500">Tiada rekod baki USB aktif dijumpai.</td></tr>`;
                }

                document.getElementById("adminUsbTableBody").innerHTML = html;

            } catch (err) {
                console.error("Ralat memuatkan pengurusan USB:", err);
            }
        });

        // Fungsi global untuk jana Payment Voucher (PV) apabila matang
        window.generatePV = async function(consultantNo, consultantName, amount) {
            if (!confirm(`Sahkan untuk menjana Payment Voucher (PV) bagi USB matang untuk ${consultantNo} sebanyak RM${formatRM(amount)}?`)) return;

            try {
                // Jana Nombor PV unik
                const pvId = "PV-" + Date.now() + Math.floor(Math.random()*100);

                await addDoc(collection(db, "paymentVouchers"), {
                    pvNo: pvId,
                    consultantNo: consultantNo,
                    consultantName: consultantName,
                    payee: consultantName, // Backup untuk serasi dengan jadual PV
                    amount: amount,
                    type: "USB_MATURITY_PAYOUT",
                    status: "PENDING",
                    createdAt: new Date(),
                    description: `Pembayaran USB Matang (Lock-in Payout)`
                });

                alert("Payment Voucher berjaya dijana! Sila semak di modul pengurusan Payment Voucher.");
                window.location.reload();
            } catch (err) {
                alert("Ralat: " + err.message);
            }
        };
        
    </script>
</body>
</html>
