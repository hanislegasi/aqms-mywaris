<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - USB Payable & Maturity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">
    
    <div class="bg-[#153638] text-white p-5 shadow mb-5">
        <h1 class="text-2xl font-bold">Pengurusan USB Matured Payable</h1>
        <p class="text-sm opacity-90">Semakan tempoh matang simpanan USB konsultan (Tempoh kunci: <span id="lockYears">3</span> Tahun)</p>
    </div>

    <div class="p-5">
        <a href="accounts-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 transition px-5 py-3 rounded-xl mb-5 text-sm font-semibold text-gray-700">← Dashboard</a>
        
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <th class="p-4 text-left">No. Konsultan</th>
                            <th class="p-4 text-left">Nama Konsultan</th>
                            <th class="p-4 text-right">Baki USB (RM)</th>
                            <th class="p-4 text-right">Terkunci (RM)</th>
                            <th class="p-4 text-center">Matang Seterusnya</th>
                            <th class="p-4 text-right">Matang Belum PV (RM)</th>
                            <th class="p-4 text-center">Status</th>
                            <th class="p-4 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsbTableBody">
                        <tr>
                            <td colspan="7" class="p-6 text-center text-gray-500">Memuatkan senarai USB konsultan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
       // 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// 2. Tarik fungsi Auth yang berkaitan sahaja (buang getAuth)
import { 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 3. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import { 
    collection, 
    getDocs, 
    doc, 
    getDoc, 
    addDoc, 
    query, 
    where 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                // 1. Ambil Setting Tempoh Matang (Default 3 tahun)
                const compSnap = await getDoc(doc(db, "settings", "compensation"));
                const compData = compSnap.exists() ? compSnap.data() : {};
               const lockYears = compData.usbLockPeriod !== undefined ? Number(compData.usbLockPeriod) : 3;
                
                // Kemaskini paparan teks tajuk atas
                const lockYearsEl = document.getElementById("lockYears");
                if (lockYearsEl) lockYearsEl.textContent = lockYears;

                // 2. Tarik semua data dari lejer akaun 2150
                const ledgerSnap = await getDocs(query(collection(db, "ledger"), where("accountCode", "==", "2150")));
                
                // Setiap entri USB (kredit) dikunci ikut tarikhnya sendiri
                let consultantUsbMap = {};
                const now = new Date();

                ledgerSnap.forEach(d => {
                    const row = d.data();
                    const cNo = row.consultantNo;
                    if (!cNo) return;
                    if (!consultantUsbMap[cNo]) {
                        consultantUsbMap[cNo] = { balance: 0, terkunci: 0, matang: 0, nextDate: null, latestPayoutDate: null, adaPV: false };
                    }
                    const c = consultantUsbMap[cNo];
                    const credit = Number(row.credit || 0);
                    const debit = Number(row.debit || 0);
                    c.balance += (credit - debit);
                    const trxDate = row.date ? (row.date.toDate ? row.date.toDate() : new Date(row.date)) : null;

                    if (debit > 0 && trxDate && (!c.latestPayoutDate || trxDate > c.latestPayoutDate)) c.latestPayoutDate = trxDate;

                    if (credit > 0 && trxDate) {
                        if (row.usbPvId) { c.adaPV = true; return; }
                        const matang = new Date(trxDate); matang.setFullYear(matang.getFullYear() + lockYears);
                        if (now >= matang) c.matang += credit;
                        else {
                            c.terkunci += credit;
                            if (!c.nextDate || matang < c.nextDate) c.nextDate = matang;
                        }
                    }
                });

                // Tarik maklumat nama konsultan
                const consultantsSnap = await getDocs(collection(db, "consultants"));
                let nameMap = {};
                consultantsSnap.forEach(d => {
                    const c = d.data();
                    if (c.consultantNo) nameMap[c.consultantNo] = c.nama || "-";
                });

                let html = "";
                const formatDate = (d) => d.toLocaleDateString("ms-MY", { year: 'numeric', month: 'short', day: 'numeric' });

                for (const cNo in consultantUsbMap) {
                    const data = consultantUsbMap[cNo];
                    let statusBadge = "", actionBtn = `<span class="text-xs text-gray-400">-</span>`;

                    if (data.matang > 0) {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">MATANG (READY)</span>`;
                        actionBtn = `<button onclick="generatePV('${cNo}')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Jana PV</button>`;
                    } else if (data.terkunci > 0) {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700">DALAM TEMPOH SIMPANAN</span>`;
                    } else if (data.balance > 0 && data.adaPV) {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">PV DIJANA (MENUNGGU BAYARAN)</span>`;
                    } else if (data.latestPayoutDate) {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700">TELAH DIBAYAR: ${formatDate(data.latestPayoutDate).toUpperCase()}</span>`;
                    } else {
                        statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-600">BAKI KOSONG</span>`;
                    }

                    html += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-bold text-[#153638]">${cNo}</td>
                        <td class="p-4">${nameMap[cNo] || "-"}</td>
                        <td class="p-4 text-right font-bold ${data.balance > 0 ? 'text-green-600' : 'text-gray-400'}">RM${formatRM(data.balance)}</td>
                        <td class="p-4 text-right">RM${formatRM(data.terkunci)}</td>
                        <td class="p-4 text-center">${data.nextDate ? formatDate(data.nextDate) : "-"}</td>
                        <td class="p-4 text-right font-bold ${data.matang > 0 ? 'text-green-600' : 'text-gray-400'}">RM${formatRM(data.matang)}</td>
                        <td class="p-4 text-center">${statusBadge}</td>
                        <td class="p-4 text-center">${actionBtn}</td>
                    </tr>
                    `;
                }

                if (html === "") {
                    html = `<tr><td colspan="8" class="p-6 text-center text-gray-500">Tiada rekod baki USB aktif dijumpai.</td></tr>`;
                }

                document.getElementById("adminUsbTableBody").innerHTML = html;

            } catch (err) {
                console.error("Ralat memuatkan pengurusan USB:", err);
            }
        });

        // Fungsi global untuk jana Payment Voucher (PV) apabila matang
        window.generatePV = async function(consultantNo) {
            if (!confirm(`Jana Payment Voucher untuk USB MATANG ${consultantNo}? (Hanya entri yang telah melepasi tempoh kunci.)`)) return;
            try {
                // Dijana di server: hanya entri matang, dan entri ditanda supaya tidak dilepaskan dua kali
                const fn = httpsCallable(getFunctions(auth.app, 'asia-southeast1'), 'janaPVUSB');
                const res = await fn({ consultantNo });
                const h = (res.data && res.data.hasil) || [];
                alert(h.length ? `PV ${h[0].pvId} dijana: RM${formatRM(h[0].jumlah)} (${h[0].bilangan} entri).` : "Tiada entri matang untuk dijana.");
                window.location.reload();
            } catch (err) {
                alert("Ralat: " + err.message);
            }
        };
        
    </script>
</body>
</html>
