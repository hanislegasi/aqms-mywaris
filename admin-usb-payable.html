<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - USB Payable & Maturity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">
    
    <div class="bg-[#153638] text-white p-5 shadow mb-5">
        <h1 class="text-2xl font-bold">Pengurusan USB Matured Payable</h1>
        <p class="text-sm opacity-90">Semakan tempoh matang simpanan USB konsultan (Tempoh kunci: <span id="lockYearText">3</span> Tahun)</p>
    </div>

    <div class="p-5">
        <a href="admin-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 transition px-5 py-3 rounded-xl mb-5 text-sm font-semibold text-gray-700">← Admin Dashboard</a>
        
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <th class="p-4 text-left">No. Konsultan</th>
                            <th class="p-4 text-left">Nama Konsultan</th>
                            <th class="p-4 text-center">Tarikh 1st Receive</th>
                            <th class="p-4 text-center">Tempoh Pegangan</th>
                            <th class="p-4 text-right">Jumlah USB (RM)</th>
                            <th class="p-4 text-center">Status Matang</th>
                            <th class="p-4 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsbTableBody">
                        <tr>
                            <td colspan="7" class="p-6 text-center text-gray-500">Memuatkan senarai USB konsultan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
            authDomain: "alqawthar-mywaris.firebaseapp.com",
            projectId: "alqawthar-mywaris",
            storageBucket: "alqawthar-mywaris.firebasestorage.app",
            messagingSenderId: "3498810778",
            appId: "1:3498810778:web:ee36e0fe42f76698046e23"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                // 1. Ambil Setting Tempoh Matang (Default 3 tahun)
                const compSnap = await getDoc(doc(db, "settings", "compensation"));
                const compData = compSnap.exists() ? compSnap.data() : {};
                const lockYears = Number(compData.usbLockPeriod || 3);
                document.getElementById("lockYearText").textContent = lockYears;

                // 2. Tarik semua data dari lejer akaun 2150
                const ledgerSnap = await getDocs(query(collection(db, "ledger"), where("accountCode", "==", "2150")));
                
                let consultantUsbMap = {};

                ledgerSnap.forEach(d => {
                    const row = d.data();
                    const cNo = row.consultantNo;
                    if (!cNo) return;

                    if (!consultantUsbMap[cNo]) {
                        consultantUsbMap[cNo] = {
                            balance: 0,
                            firstDate: null
                        };
                    }

                    const credit = Number(row.credit || 0);
                    const debit = Number(row.debit || 0);
                    consultantUsbMap[cNo].balance += (credit - debit);

                    // Cari tarikh transaksi paling awal (1st receive)
                    if (row.date) {
                        const trxDate = row.date.toDate ? row.date.toDate() : new Date(row.date);
                        if (!consultantUsbMap[cNo].firstDate || trxDate < consultantUsbMap[cNo].firstDate) {
                            consultantUsbMap[cNo].firstDate = trxDate;
                        }
                    }
                });

                // Tarik maklumat nama konsultan
                const consultantsSnap = await getDocs(collection(db, "consultants"));
                let nameMap = {};
                consultantsSnap.forEach(d => {
                    const c = d.data();
                    if (c.consultantNo) nameMap[c.consultantNo] = c.nama || "-";
                });

                let html = "";
                const now = new Date();

                for (const cNo in consultantUsbMap) {
                    const data = consultantUsbMap[cNo];
                    if (data.balance <= 0) continue; // Abaikan baki kosong/negatif

                    const firstDate = data.firstDate || now;
                    
                    // Kira tarikh matang (firstDate + lockYears)
                    let maturityDate = new Date(firstDate);
                    maturityDate.setFullYear(maturityDate.getFullYear() + lockYears);

                    const isMatured = now >= maturityDate;

                    const formatDate = (d) => d.toLocaleDateString("ms-MY", { year: 'numeric', month: 'short', day: 'numeric' });

                    html += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-bold text-[#153638]">${cNo}</td>
                        <td class="p-4">${nameMap[cNo] || "-"}</td>
                        <td class="p-4 text-center">${formatDate(firstDate)}</td>
                        <td class="p-4 text-center">${formatDate(maturityDate)}</td>
                        <td class="p-4 text-right font-bold text-green-600">RM${formatRM(data.balance)}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${isMatured ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                                ${isMatured ? 'MATANG (READY)' : 'DALAM TEMPOH SIMPANAN'}
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            ${isMatured ? `<button onclick="generatePV('${cNo}', ${data.balance})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Jana PV Bayaran</button>` : `<span class="text-xs text-gray-400">Belum Matang</span>`}
                        </td>
                    </tr>
                    `;
                }

                if (html === "") {
                    html = `<tr><td colspan="7" class="p-6 text-center text-gray-500">Tiada rekod baki USB aktif dijumpai.</td></tr>`;
                }

                document.getElementById("adminUsbTableBody").innerHTML = html;

            } catch (err) {
                console.error("Ralat memuatkan pengurusan USB:", err);
            }
        });

        // Fungsi global untuk jana Payment Voucher (PV) apabila matang
        window.generatePV = async function(consultantNo, amount) {
            if (!confirm(`Sahkan untuk menjana Payment Voucher (PV) bagi USB matang untuk ${consultantNo} sebanyak RM${formatRM(amount)}?`)) return;

            try {
                // Masukkan ke paymentVouchers supaya masuk senarai bayaran HQ
                await addDoc(collection(db, "paymentVouchers"), {
                    consultantNo: consultantNo,
                    amount: amount,
                    type: "USB_MATURITY_PAYOUT",
                    status: "PENDING",
                    createdAt: new Date(),
                    description: `PBayaran USB Matang (Lock-in Payout)`
                });

                alert("Payment Voucher berjaya dijana! Sila semak di modul pengurusan Payment Voucher.");
                window.location.reload();
            } catch (err) {
                alert("Ralat: " + err.message);
            }
        };
    </script>
</body>
</html>
