<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyata USB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">
    
    <!-- HEADER RASMI (Ikut tema page lain) -->
    <div class="bg-[#153638] text-white p-5 shadow mb-5">
        <h1 class="text-2xl font-bold">Penyata Upline Supporting Benefit (USB)</h1>
        <p class="text-sm opacity-90">Sejarah terperinci penerimaan USB (Akaun 2150)</p>
    </div>

    <div class="p-5 max-w-5xl mx-auto">
        <a href="consultant-dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 transition px-5 py-3 rounded-xl mb-5 text-sm font-semibold text-gray-700">← Dashboard</a>
        
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-[#153638] text-white">
                        <tr>
                            <th class="p-4 text-left">Tarikh</th>
                            <th class="p-4 text-left">Terima Dari AQC</th>
                            <th class="p-4 text-left">Keterangan</th>
                            <th class="p-4 text-right">Jumlah (RM)</th>
                        </tr>
                    </thead>
                    <tbody id="usbTableBody">
                        <tr>
                            <td colspan="4" class="p-6 text-center text-gray-500">Memuatkan penyata USB...</td>
                        </tr>
                    </tbody>
                    <tfoot id="usbTableFoot" class="bg-gray-50 border-t-2 border-gray-200 font-bold hidden">
                        <tr>
                            <td colspan="3" class="p-4 text-right">JUMLAH KESELURUHAN BAKI USB:</td>
                            <td id="totalUsbFooter" class="p-4 text-right text-blue-600">RM0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",
            authDomain: "alqawthar-mywaris.firebaseapp.com",
            projectId: "alqawthar-mywaris",
            storageBucket: "alqawthar-mywaris.firebasestorage.app",
            messagingSenderId: "3498810778",
            appId: "1:3498810778:web:ee36e0fe42f76698046e23"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const formatRM = (val) => Number(val || 0).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                const userSnap = await getDoc(doc(db, "consultants", user.uid));
                if (!userSnap.exists()) {
                    document.getElementById("usbTableBody").innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Profil konsultan tidak dijumpai.</td></tr>`;
                    return;
                }
                const consultantData = userSnap.data();
                const myConsultantNo = consultantData.consultantNo;

                const q = query(
                    collection(db, "ledger"),
                    where("accountCode", "==", "2150"),
                    where("consultantNo", "==", myConsultantNo)
                );
                const querySnapshot = await getDocs(q);

                let html = "";
                let totalUsbBalance = 0;

                if (querySnapshot.empty) {
                    document.getElementById("usbTableBody").innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">Tiada rekod transaksi USB dijumpai.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const row = docSnap.data();
                    
                    let dateStr = "-";
                    if (row.date) {
                        const d = row.date.toDate ? row.date.toDate() : new Date(row.date);
                        dateStr = d.toLocaleDateString("ms-MY", { year: 'numeric', month: 'short', day: 'numeric' });
                    }

                    // Cari ID pengirim dari field fromConsultant atau transactionGroup
                    let fromAqc = row.fromConsultant || row.transactionGroup || "-";
                    if (fromAqc.startsWith("AQM")) {
                        // Jika rujukan transaksi pelanggan, cuba kekalkan atau paparkan sebagai rujukan
                        fromAqc = row.fromConsultant || "-";
                    }

                    const desc = row.description || "USB Transaction";
                    const credit = Number(row.credit || 0);
                    const debit = Number(row.debit || 0);
                    const netAmount = credit - debit;

                    totalUsbBalance += netAmount;

                    html += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4 text-gray-700">${dateStr}</td>
                        <td class="p-4 font-semibold text-[#153638]">${fromAqc}</td>
                        <td class="p-4 text-gray-800">${desc}</td>
                        <td class="p-4 text-right font-bold ${netAmount >= 0 ? 'text-green-600' : 'text-red-600'}">
                            ${netAmount >= 0 ? '+' : ''}RM${formatRM(netAmount)}
                        </td>
                    </tr>
                    `;
                });

                document.getElementById("usbTableBody").innerHTML = html;
                document.getElementById("totalUsbFooter").textContent = "RM" + formatRM(totalUsbBalance);
                document.getElementById("usbTableFoot").classList.remove("hidden");

            } catch (err) {
                console.error("Ralat memuatkan penyata USB:", err);
                document.getElementById("usbTableBody").innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Ralat memuatkan data dari pangkalan data.</td></tr>`;
            }
        });
    </script>
</body>
</html>
