<!DOCTYPE html>

<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Voucher</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
<style>
body{
font-family:Inter,sans-serif;
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div class="bg-[#153638] text-white p-5">

<h1 class="text-2xl font-bold">
Payment Voucher Details
</h1>

</div>

<div class="max-w-4xl mx-auto p-5">

<a
href="payment-voucher.html"
class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-5">

← Payment Voucher

</a>

<div
id="voucherArea"
class="bg-white rounded-xl shadow p-4">

<div class="text-center mb-4">
                <h1 id="companyName" class="text-2xl font-bold uppercase">
                    Memuatkan...
                </h1>
                
                <p class="text-lg font-semibold mt-2">PAYMENT VOUCHER</p>
                <p class="text-gray-500 text-sm">Financial Management Centre</p>
            </div>

  
<div class="grid md:grid-cols-2 gap-4 mb-6">

<div>

<label class="font-semibold">
PV No
</label>

<p id="pvNo">
-
</p>

</div>

<div>

<label class="font-semibold">
Status
</label>

<p id="status">
-
</p>

</div>

<div>

<label class="font-semibold">
Payee
</label>

<p id="consultant">
-
</p>

</div>

<div>

<label class="font-semibold">
Amount
</label>

<p id="amount">
RM0.00
</p>

</div>

</div>

<div id="beneficiarySection" class="hidden">

<hr class="my-3">

<h2 class="font-bold text-lg mb-4">
Beneficiaries
</h2>

<table class="w-full border mb-6">

<thead class="bg-gray-100">

<tr>

<th class="border p-3 text-left">
Name
</th>

<th class="border p-3 text-right">
Amount
</th>

</tr>

</thead>

<tbody id="beneficiaryTable">

</tbody>

</table>

</div>
  
<hr class="my-3">

<h2 class="font-bold text-lg mb-4">
Payment Breakdown
</h2>

<table class="w-full border mb-6">

<thead class="bg-gray-100">

<tr>

<th class="border p-3 text-left">

Account

</th>

<th class="border p-3 text-right">

Amount

</th>

</tr>

</thead>

<tbody id="accountTable">

</tbody>

</table>

<!-- ============================================== -->
            <!-- BAHAGIAN LAMPIRAN RESIT (DITAMBAH DI SINI) -->
            <!-- ============================================== -->
            <hr class="my-3">
            <h2 class="font-bold text-lg mb-4">Lampiran Resit (Bukti Bayaran)</h2>
            <div id="receiptSection" class="mb-6 p-4 border rounded-xl bg-gray-50 flex items-center justify-between">
                <p class="text-sm text-gray-500 italic">Tiada lampiran resit untuk PV ini.</p>
            </div>
            <!-- ============================================== -->
  
<hr class="my-3">

<h2 class="font-bold text-lg mb-4">
Payment Information
</h2>

<div class="space-y-2">

<div>

<label>
Payment Method
</label>

<select
id="paymentMethod"
class="w-full border rounded-lg p-2">

<option value="">
Pilih
</option>

<option>
Maybank Transfer
</option>

<option>
Cheque
</option>

<option>
DuitNow
</option>

<option>
IBG
</option>

</select>

</div>

<div>

<label>
Reference No
</label>

<input
id="referenceNo"
type="text"
class="w-full border rounded-lg p-3">

</div>

<div>

<label>
Payment Date
</label>

<input
id="paymentDate"
type="date"
class="w-full border rounded-lg p-3">

</div>

<div>

<label>
Remarks
</label>

<textarea
id="remarks"
class="w-full border rounded-lg p-3"></textarea>

</div>

</div>

<div
id="actionButtons"
class="mt-6 flex gap-3">

<button
id="saveBtn"
class="bg-blue-600 text-white px-5 py-3 rounded-xl">

Save

</button>

<button
id="pdfBtn"
class="bg-red-600 text-white px-5 py-3 rounded-xl">

Export PDF

</button>

</div>
  
</div>

</div>

<script type="module">

// 1. Tarik 'db' dari fail konfigurasi berpusat
import { db } from './firebase.js';

// 2. Tarik fungsi Firestore yang berkaitan sahaja (buang getFirestore)
import {
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params =
new URLSearchParams(
window.location.search
);

const pvId =
params.get("id");

const pvRef =
doc(
db,
"paymentVouchers",
pvId
);

const pvSnap =
await getDoc(
pvRef
);

const pv =
pvSnap.data();

// ==============================================
        // TARIK NAMA SYARIKAT DARI SETTINGS
        // ==============================================
        try {
            // Andaikan data syarikat disimpan dalam collection "settings", document "company"
            const companyRef = doc(db, "settings", "company");
            const companySnap = await getDoc(companyRef);
            
            if (companySnap.exists() && companySnap.data().companyName) {
                document.getElementById("companyName").innerText = companySnap.data().companyName;
            } else {
                // Fallback (jika data belum diset dalam database)
                document.getElementById("companyName").innerText = "AL-QAWTHAR MAWARIS SYNERGY SDN. BHD.";
            }
        } catch (error) {
            console.error("Gagal menarik nama syarikat:", error);
            document.getElementById("companyName").innerText = "AL-QAWTHAR MAWARIS SYNERGY SDN. BHD.";
        }
        // ==============================================
  
document.getElementById("pvNo").innerHTML =
pv.pvNo;

document.getElementById("status").innerHTML =
pv.status;

document.getElementById("consultant").innerHTML =
pv.payee || pv.consultantName;

document.getElementById("amount").innerHTML =
"RM" + Number(pv.amount).toFixed(2);

if((pv.beneficiaries || []).length){

document.getElementById("beneficiarySection")
.classList.remove("hidden");

let benHTML="";

pv.beneficiaries.forEach(item=>{

benHTML += `

<tr>

<td class="border p-2">
${item.name}
</td>

<td class="border p-2 text-right">
RM${Number(item.amount).toFixed(2)}
</td>

</tr>

`;

});

document.getElementById("beneficiaryTable").innerHTML =
benHTML;

}
  
let accountHTML="";

(pv.accounts||[]).forEach(item=>{

accountHTML+=`

<tr>

<td class="border p-2">

${item.accountName}

</td>

<td class="border p-2 text-right">

RM${Number(item.amount).toFixed(2)}

</td>

</tr>

`;

});

document.getElementById("accountTable").innerHTML=
accountHTML;

// ==============================================
        // LOGIK MEMAPARKAN RESIT (DITAMBAH DI SINI)
        // ==============================================
        if (pv.receiptUrl) {
            document.getElementById("receiptSection").innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="bg-[#153638] text-white p-3 rounded-lg text-xl shadow-md">
                        📄
                    </div>
                    <div>
                        <p class="font-bold text-gray-800">Resit Stamping LHDN</p>
                        <a href="${pv.receiptUrl}" target="_blank" class="text-blue-600 text-sm hover:underline">
                            Lihat Dokumen
                        </a>
                    </div>
                </div>
                <a href="${pv.receiptUrl}" target="_blank" class="bg-blue-100 hover:bg-blue-200 text-blue-800 px-5 py-2 rounded-lg text-sm font-bold transition border border-blue-200 shadow-sm">
                    Buka Resit ↗
                </a>
            `;
        }
        // ==============================================
  
document.getElementById("paymentMethod").value =
pv.paymentMethod || "";

document.getElementById("referenceNo").value =
pv.referenceNo || "";

document.getElementById("remarks").value =
pv.remarks || "";

document.getElementById("paymentDate").value =
pv.paymentDate || "";
  
document.getElementById("saveBtn")
.addEventListener(
"click",
async()=>{

await updateDoc(
pvRef,
{

paymentMethod:
document.getElementById("paymentMethod").value,

referenceNo:
document.getElementById("referenceNo").value,

paymentDate:
document.getElementById("paymentDate").value,

remarks:
document.getElementById("remarks").value

}
);

alert(
"Saved"
);

}
);

document
.getElementById("pdfBtn")
.addEventListener("click",()=>{

const buttons =
document.getElementById("actionButtons");

buttons.style.display="none";

const element =
document.getElementById("voucherArea");

const opt = {

margin: 0.2,

filename: pv.pvNo + ".pdf",

image: {
    type: "jpeg",
    quality: 1
},

html2canvas: {
    scale: 1.5,
    useCORS: true
},

jsPDF: {
    unit: "mm",
    format: "a4",
    orientation: "portrait"
},

pagebreak: {
    mode: ["avoid-all"]
}

};

html2pdf()
.set(opt)
.from(element)
.save()
.then(()=>{

buttons.style.display="flex";

});

});
  
</script>

</body>
</html>
