<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="description" content="Perkhidmatan perancangan harta pusaka Islam meliputi Wasiat, Hibah, Faraid, Harta Sepencarian dan Pengurusan Pusaka di Mahkamah. Elakkan harta beku dan lindungi waris anda hari ini.">
  <meta name="keywords" content="wasiat, hibah, faraid, urus pusaka, pengurusan pusaka islam, harta pusaka, harta beku, perancang pusaka, perunding hibah, wasiat malaysia, hibah malaysia, pengurusan harta pusaka, surat kuasa mentadbir, pusaka kecil, mahkamah pusaka, harta sepencarian, pewarisan islam, perancangan harta, pewarisan harta islam">
  <meta name="author" content="Al-Qawthar Mawaris Synergy">
  
  <title>AQMS-myWaris</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-gray-50 selection:bg-[#d8ae81] selection:text-[#153638]">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 shadow-md font-inter bg-[#153638]">
    <div class="w-full px-4 sm:px-8 lg:px-12">
      <div class="flex justify-between items-center h-24 sm:h-24">
        
        <!-- Logo Area -->
        <div class="flex items-center h-full py-2 cursor-pointer" onclick="window.location.reload()">
          <img src="https://i.postimg.cc/9MttwjKF/Copy-of-A-(4).png" alt="AQMS Logo" class="h-full max-h-16 sm:max-h-20 w-auto object-contain">
        </div>

        <!-- Login / Register Dropdown Area -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button onclick="window.location.href='login.html'"
            class="px-3 sm:px-4 py-1.5 sm:py-2 text-sm sm:text-base border border-[#d8ae81] text-[#d8ae81] rounded-lg hover:bg-[#d8ae81] hover:text-[#153638] transition font-medium">
            Login
          </button>

          <!-- DROPDOWN DAFTAR AKAUN (BERMULA DI SINI) -->
          <div class="relative group">
            <button type="button"
              class="px-3 sm:px-4 py-1.5 sm:py-2 text-sm sm:text-base bg-[#d8ae81] text-[#153638] font-semibold rounded-lg hover:opacity-90 transition inline-flex items-center gap-1.5">
              <span>Daftar Akaun</span>
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>

            <!-- Menu Dropdown -->
            <div class="hidden group-hover:block group-focus-within:block absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-xl ring-1 ring-black/5 z-50 overflow-hidden py-1">
              <a href="register.html" class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#d8ae81]/20 hover:text-[#153638] transition font-medium">
                <i data-lucide="user" class="w-4 h-4 text-[#153638]"></i>
                Daftar <strong>AQM</strong> (Client)
              </a>
              <a href="consultant-registration.html" class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#d8ae81]/20 hover:text-[#153638] transition font-medium border-t border-gray-100">
                <i data-lucide="briefcase" class="w-4 h-4 text-[#153638]"></i>
                Daftar <strong>AQC</strong> (Consultant)
              </a>
            </div>
          </div>
          <!-- DROPDOWN DAFTAR AKAUN (TAMAT DI SINI) -->

        </div>
        
      </div>
    </div>
  </header>
  
  <!-- MAIN CONTENT AREA -->
  <main class="relative flex items-center justify-center overflow-hidden h-[calc(100vh-160px)] sm:h-[calc(100vh-192px)]">
    
    <!-- Background Image -->
    <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat" 
         style="background-image: url('https://i.postimg.cc/L6ML9HRR/Chat-GPT-Image-May-20-2026-12-45-46-PM.png');">
    </div>
    
    <!-- Dark overlay -->
    <div class="absolute inset-0 z-0 bg-black/40"></div>

    <!-- Logo di Tengah -->
    <div class="relative z-10 px-4 transform hover:scale-105 transition-transform duration-700">
      <img src="https://i.postimg.cc/HxNP7q6R/Copy-of-A-6-removebg-preview.png" alt="AQMS Logo Tengah" class="w-64 sm:w-80 md:w-[400px] drop-shadow-[0_10px_35px_rgba(0,0,0,0.5)]">
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="h-24 bg-[#153638] flex items-center justify-center">
    <div class="flex items-center justify-center h-20 sm:h-24">
        <div class="text-center text-xs text-gray-300 font-bold uppercase tracking-widest">
            &copy; <span id="current-year"></span> Al-Qawthar Mawaris Synergy. HCH @ Hak Cipta Terpelihara.
        </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Set current year in footer
      document.getElementById('current-year').innerText = new Date().getFullYear();
      
      // Initialize Lucide icons
      lucide.createIcons();
    });
  </script>
</body>
</html>
