<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resit Pembayaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#153638">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQMS">
<script src="/pwa.js" defer></script>
</head>

<body class="m-kemas bg-gray-100 pb-28 md:pb-0">

<div class="max-w-7xl mx-auto p-6">

    <a href="dashboard.html" class="inline-block bg-gray-200 px-5 py-3 rounded-xl mb-6 hover:bg-gray-300 transition font-semibold text-gray-700">
        ← Dashboard
    </a>

    <h1 class="text-3xl font-bold text-[#153638]">Resit Pembayaran</h1>
    <p class="text-gray-500 mt-2 mb-6">Resit Pendaftaran, Pembaharuan & Produk</p>

    <div class="bg-white rounded-2xl shadow p-5 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 md:gap-4">
            
            <select id="yearFilter" class="w-full min-w-0 border rounded-xl p-3 focus:ring-2 focus:ring-[#153638] outline-none">
                <option>2026</option>
                <option>2027</option>
                <option>2028</option>
            </select>

            <select id="monthFilter" class="w-full min-w-0 border rounded-xl p-3 focus:ring-2 focus:ring-[#153638] outline-none">
                <option value="">Semua Bulan</option>
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Mac</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Jun</option>
                <option value="6">Julai</option>
                <option value="7">Ogos</option>
                <option value="8">September</option>
                <option value="9">Oktober</option>
                <option value="10">November</option>
                <option value="11">Disember</option>
            </select>

            <!-- TUKAR VALUE DI SINI SUPAYA SAMA DENGAN DATABASE -->
            <select id="typeFilter" class="w-full min-w-0 border rounded-xl p-3 focus:ring-2 focus:ring-[#153638] outline-none">
                <option value="">Semua Kategori</option>
                <option value="REGISTRATION">Yuran Pendaftaran</option>
                <option value="RENEWAL">Pembaharuan Tahunan</option>
                <option value="WASIAT">Wasiat</option>
                <option value="WASIAT_RENEWAL">Pembaharuan Wasiat</option>
                <option value="HIBAH">Hibah</option>
                <option value="HIBAH_RENEWAL">Pembaharuan Hibah</option>
                
                <option value="SEPENCARIAN">Harta Sepencarian</option>
                <option value="SEPENCARIAN_RENEWAL">Pembaharuan Harta Sepencarian</option>
                
                <option value="MAWARIS">Mawaris</option>
                <option value="MAWARIS_RENEWAL">Pembaharuan Mawaris</option>
                
                <!-- PAKEJ CORPORATE LAMA/PREMIUM -->
                <option value="MAWARIS KORPORAT">Mawaris Korporat (Legacy)</option>
                <option value="KORPORAT">Mawaris Korporat</option>
                <option value="CORPORATE_RENEWAL">Pembaharuan Mawaris Korporat</option>
                
                <!-- 3 PAKEJ CORPORATE BAHARU -->
                <option value="KORPORAT TUNGGAL">Mawaris Korporat (Tunggal)</option>
                <option value="CORPORATE_TUNGGAL_RENEWAL">Pembaharuan Mawaris Korporat (Tunggal)</option>
                
                <option value="KORPORAT KONGSI">Mawaris Korporat (Kongsi)</option>
                <option value="CORPORATE_KONGSI_RENEWAL">Pembaharuan Mawaris Korporat (Kongsi)</option>
                
                <option value="KORPORAT ZURRI">Mawaris Korporat (Wakaf Zurri)</option>
                <option value="CORPORATE_ZURRI_RENEWAL">Pembaharuan Mawaris Korporat (Wakaf Zurri)</option>
                <option value="TRUSTEE_FEE">Lantikan RTB</option>
                <option value="LEGAL_FEE">Pengesahan Mahkamah</option>
            </select>

            <button id="searchBtn" class="min-h-[48px] bg-[#153638] hover:bg-[#1d4a4d] transition text-white rounded-xl font-semibold">
                Cari
            </button>

        </div>
    </div>

    <div id="receiptCards" class="md:hidden flex flex-col gap-3"></div>

    <div class="hidden md:block bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="p-4 text-left">No. Resit</th>
                    <th class="p-4 text-left">Tarikh</th>
                    <th class="p-4 text-left">Keterangan</th>
                    <th class="p-4 text-right">Jumlah</th>
                    <th class="p-4 text-center">Status</th>
                    <th class="p-4 text-center">Tindakan</th>
                </tr>
            </thead>
            <tbody id="receiptTable">
                <tr>
                    <td colspan="6" class="text-center py-10 text-gray-400">Memuatkan...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div id="mNav"></div>
<script type="module">
import { db, auth } from './firebase.js';
import { navMobile, bacaPautanDipilih } from './aqm-mobile.js';
document.getElementById("mNav").innerHTML = navMobile("resit", bacaPautanDipilih());
import { collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Simpan currentUser global supaya tidak perlu panggil auth berulang kali
let currentUser = null;
        
async function loadReceipts(user) {
    document.getElementById("receiptTable").innerHTML = `<tr><td colspan="6" class="text-center py-10 text-gray-400">Memuatkan resit...</td></tr>`;
    document.getElementById("receiptCards").innerHTML = `<p class="text-center py-10 text-gray-500">Memuatkan resit...</p>`;
    
    const year = Number(document.getElementById("yearFilter").value);
    const month = document.getElementById("monthFilter").value;
    const type = document.getElementById("typeFilter").value;

    try {
        const receiptSnap = await getDocs(query(collection(db, "receipts"), where("uid", "==", user.uid)));
        
        // Kumpulkan data dalam array supaya boleh di-sort ikut tarikh terkini (optional tapi digalakkan)
        let receiptsArray = [];
        receiptSnap.forEach((d) => receiptsArray.push({ id: d.id, ...d.data() }));
        
        // Sort dari yang paling baru ke lama
        receiptsArray.sort((a, b) => b.paymentDate.toDate() - a.paymentDate.toDate());

        let html = "";
        let kad = "";

        receiptsArray.forEach((r) => {
            const payDate = r.paymentDate.toDate();

            // Penapis Tahun, Bulan & Jenis
            if (payDate.getFullYear() !== year) return;
            if (month !== "" && payDate.getMonth() !== Number(month)) return;
            if (type !== "" && r.serviceCode !== type) return;

            html += `
            <tr class="border-b hover:bg-gray-50 transition">
                <td class="p-4 font-medium text-gray-800">${r.receiptNo}</td>
                <td class="p-4 text-gray-600">${payDate.toLocaleDateString("ms-MY")}</td>
                <td class="p-4 text-gray-600">${r.serviceName}</td>
                <td class="p-4 text-right font-semibold text-[#153638]">RM${Number(r.amount).toFixed(2)}</td>
                <td class="p-4 text-center">
                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">${r.status === "PAID" ? "DIBAYAR" : r.status}</span>
                </td>
                <td class="p-4 text-center">
                    <button onclick="window.location.href='receipt-aqm-view.html?id=${r.id}'" class="bg-gray-100 hover:bg-gray-200 text-[#153638] px-4 py-2 rounded-lg text-sm font-semibold transition">
                        Lihat
                    </button>
                </td>
            </tr>`;

            kad += `
            <a href="receipt-aqm-view.html?id=${r.id}" class="bg-white rounded-2xl shadow-sm p-4 flex flex-col gap-2">
                <div class="flex justify-between items-start gap-3">
                    <span class="text-sm font-semibold text-gray-800">${r.serviceName}</span>
                    <span class="font-bold text-[#153638] whitespace-nowrap">RM${Number(r.amount).toFixed(2)}</span>
                </div>
                <div class="flex justify-between items-center gap-3 text-xs text-gray-600">
                    <span class="break-all">${r.receiptNo} · ${payDate.toLocaleDateString("ms-MY")}</span>
                    <span class="bg-green-100 text-green-700 px-2.5 py-0.5 rounded-full font-bold">${r.status === "PAID" ? "DIBAYAR" : r.status}</span>
                </div>
            </a>`;
        });

        if (html === "") {
            html = `<tr><td colspan="6" class="text-center py-10 text-gray-400">Tiada resit dijumpai.</td></tr>`;
        }

        document.getElementById("receiptTable").innerHTML = html;
        document.getElementById("receiptCards").innerHTML = kad || `<p class="text-center py-10 text-gray-500">Tiada resit dijumpai.</p>`;
        
    } catch (error) {
        console.error("Gagal menarik rekod resit:", error);
        document.getElementById("receiptTable").innerHTML = `<tr><td colspan="6" class="text-center py-10 text-red-500">Gagal memuatkan data.</td></tr>`;
        document.getElementById("receiptCards").innerHTML = `<p class="text-center py-10 text-red-600">Gagal memuatkan data.</p>`;
    }
}

// Hanya panggil sekali apabila halaman dimuatkan
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user; // Simpan rujukan ke user
    loadReceipts(user);
});

// Butang carian kini hanya panggil loadReceipts tanpa panggil auth semula
document.getElementById("searchBtn").addEventListener("click", () => {
    if (currentUser) {
        loadReceipts(currentUser);
    }
});
</script>
</body>
</html>
