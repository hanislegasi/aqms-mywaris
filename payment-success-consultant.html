<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Status Pembayaran Konsultan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: Inter, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl text-center">
        <div id="loadingIcon" class="mb-4 text-[#153638]">
            <svg class="w-16 h-16 mx-auto animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </div>
        <h1 id="statusTajuk" class="text-2xl font-bold text-[#153638] mb-4">Mengesahkan Pembayaran...</h1>
        <p id="statusMesej" class="text-gray-500">Sila tunggu. Sistem sedang mengemaskini lejar perakaunan dan akaun upline anda.</p>
    </div>

    <script type="module">
        import { db, auth } from './firebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc, updateDoc, setDoc, increment, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const status_id = urlParams.get('status_id');
        const namaPakej = urlParams.get('pakej') || "";

        if (status_id === "1") {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const txnDate = new Date();
                    const isRenewal = namaPakej.includes("Pembaharuan");
                    
                    try {
                        const consSnap = await getDoc(doc(db, "consultants", user.uid));
                        const consData = consSnap.data();

                        // Halang double-entry jika user refresh page
                        const timeSinceLastUpdate = consData.lastRenewalDate ? (txnDate.getTime() - consData.lastRenewalDate.toDate().getTime()) : 999999;
                        if (timeSinceLastUpdate < 60000) { 
                            window.location.href = "consultant-dashboard.html";
                            return;
                        }

                        // Tetapkan Tarikh Luput
                        const currentExpiry = consData?.renewalDate?.toDate ? consData.renewalDate.toDate() : new Date();
                        const newExpiry = new Date(isRenewal ? currentExpiry : txnDate);
                        newExpiry.setFullYear(newExpiry.getFullYear() + 1);

                        // Tarik Data Settings (Compensation) untuk digunakan oleh Daftar & Renewal
                        const compSnap = await getDoc(doc(db, "settings", "compensation"));
                        const compensation = compSnap.exists() ? compSnap.data() : {};
                        const levelKey = (consData.consultantLevel || "AQC").replace(/[^a-zA-Z0-9]/g, "");

                        // ==========================================
                        // A. LOGIK JIKA PENDAFTARAN BARU (BUKAN RENEWAL)
                        // ==========================================
                        if (!isRenewal) {
                            const counterRef = doc(db, "system", "counter");
                            const counterSnap = await getDoc(counterRef);
                            const currentNo = counterSnap.exists() ? (counterSnap.data().consultantCounter || 0) : 0;
                            const consultantNo = "AQC" + String(currentNo + 1).padStart(4, "0");
                            
                            const registrationFee = Number(compensation[`registration${levelKey}`] || compensation.consultantRegistrationFee || 200);
                            const usbAmount = Number(compensation.usbRegistrationAmount || 50);
                            const companyRevenue = registrationFee - usbAmount;
                            const uplineCode = consData.upline ? consData.upline.trim() : "-";

                            // 1. Kemaskini Profil Sendiri
                            await updateDoc(doc(db, "consultants", user.uid), {
                                consultantNo: consultantNo, consultantLevel: "AQC", consultantPaymentStatus: "paid",
                                joinDate: txnDate, renewalDate: newExpiry, lastRenewalDate: txnDate,
                                downlineCount: 0, activeClients: 0, careerSales: 0, totalSales: 0, totalCommission: 0, 
                                totalUSB: 0, totalOverriding: 0, lifetimeCommission: 0, lifetimeUSB: 0, lifetimeOverride: 0
                            });

                            // 2. Tukar peranan di koleksi 'users'
                            await setDoc(doc(db, "users", user.uid), { role: "consultant" }, { merge: true });

                            // 3. Jurnal Perakaunan (Pendaftaran Baru Split)
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "1000", account: "Bank", category: "asset",
                                description: consultantNo + " Registration", debit: registrationFee, credit: 0,
                                paymentType: "CONSULTANT", sourceAccount: "4120", transactionGroup: consultantNo
                            });
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "4120", account: "Registration AQC", category: "income",
                                description: consultantNo + " Registration", debit: 0, credit: companyRevenue,
                                paymentType: "CONSULTANT", sourceAccount: "4120", transactionGroup: consultantNo
                            });
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "2150", account: "USB Payable", category: "liability",
                                description: consultantNo + " Registration - Upline Supporting Benefit",
                                debit: 0, credit: usbAmount, paymentType: "CONSULTANT", sourceAccount: "4120",
                                transactionGroup: consultantNo, consultantNo: uplineCode, fromConsultant: consultantNo
                            });

                            // 4. Proses USB Kepada Upline
                            if (uplineCode !== "-") {
                                const uplineQuery = query(collection(db, "consultants"), where("consultantNo", "==", uplineCode));
                                const uplineSnap = await getDocs(uplineQuery);
                                
                                if (!uplineSnap.empty) {
                                    const uplineDoc = uplineSnap.docs[0];
                                    
                                    await updateDoc(uplineDoc.ref, {
                                        totalUSB: increment(usbAmount),
                                        lifetimeUSB: increment(usbAmount),
                                        downlineCount: increment(1)
                                    });

                                    await addDoc(collection(db, "overrideHistory"), {
                                        uplineId: uplineDoc.id, uplineNo: uplineDoc.data().consultantNo,
                                        downlineId: user.uid, downlineNo: consultantNo, downlineName: consData.nama || "-",
                                        type: "USB_REGISTRATION", amount: usbAmount, status: "PENDING", date: txnDate
                                    });
                                }
                            }

                            // 5. Update Kaunter & Resit
                            await updateDoc(counterRef, { consultantCounter: increment(1) });
                            await addDoc(collection(db, "receipts"), {
                                receiptNo: "REG-" + Date.now(), uid: user.uid, consultantNo, payerName: consData.nama || "-",
                                serviceCode: "REGISTRATION", serviceName: "Consultant Registration Fee", amount: registrationFee,
                                paymentMethod: "ToyyibPay", status: "PAID", paymentDate: txnDate, referenceNo: consultantNo
                            });

                        } 
                        // ==========================================
                        // B. LOGIK JIKA PEMBAHARUAN SAHAJA (RENEWAL)
                        // ==========================================
                        else {
                            // Harga ditarik dari database mengikut level konsultan semasa
                            const amount = Number(compensation[`renewal${levelKey}`] || 100);
                            
                            await updateDoc(doc(db, "consultants", user.uid), {
                                consultantPaymentStatus: "paid", renewalDate: newExpiry, lastRenewalDate: txnDate,
                                "training.wasiat.status": "pending", "training.wasiat.bestScore": 0,
                                "training.hibah.status": "pending", "training.hibah.bestScore": 0,
                                "training.faraid.status": "pending", "training.faraid.bestScore": 0,
                                "training.amla.status": "pending", "training.amla.bestScore": 0
                            });

                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "1000", account: "Bank", category: "asset",
                                description: `${consData.consultantNo} - Renewal AQC`, debit: amount, credit: 0,
                                paymentType: "CUSTOMER", transactionGroup: consData.consultantNo
                            });
                            await addDoc(collection(db, "ledger"), {
                                date: txnDate, accountCode: "4310", account: "Renewal AQC", category: "income",
                                description: `${consData.consultantNo} - Renewal AQC`, debit: 0, credit: amount,
                                paymentType: "CUSTOMER", transactionGroup: consData.consultantNo
                            });

                            await addDoc(collection(db, "receipts"), {
                                receiptNo: "REN-" + Date.now(), uid: user.uid, consultantNo: consData.consultantNo, payerName: consData.nama,
                                serviceCode: "RENEWAL", serviceName: "Consultant Renewal Fee", amount: amount,
                                paymentMethod: "ToyyibPay", status: "PAID", paymentDate: txnDate, referenceNo: consData.consultantNo
                            });
                        }

                        // PENUTUP UI
                        document.getElementById('statusMesej').innerText = "Akaun dikemaskini berjaya! Memuatkan portal...";
                        document.getElementById('loadingIcon').innerHTML = `<svg class="w-16 h-16 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                        setTimeout(() => { window.location.href = "consultant-dashboard.html"; }, 2500);

                    } catch (error) {
                        console.error(error);
                        document.getElementById('statusMesej').innerText = "Ralat memproses data. Sila hubungi admin.";
                    }
                }
            });
        } else {
            document.getElementById('statusTajuk').innerText = "Pembayaran Gagal";
            document.getElementById('statusMesej').innerText = "Transaksi dibatalkan. Mengembalikan anda...";
            setTimeout(() => { window.location.href = "consultant-dashboard.html"; }, 3000);
        }
    </script>
</body>
</html>
