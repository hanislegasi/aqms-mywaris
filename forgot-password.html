<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Laluan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-[#f5f7f9] flex items-center justify-center p-5">

  <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl border border-gray-100">
    <h2 class="text-3xl font-bold mb-2 text-center text-[#153638]">Lupa Kata Laluan</h2>
    <p class="text-sm text-gray-500 text-center mb-6">
      Masukkan e-mel akaun anda. Kami akan hantar pautan untuk menetapkan kata laluan baharu.
    </p>

    <form id="resetForm" class="space-y-4">
      <input id="email" type="email" placeholder="Email" autocomplete="email"
        class="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#153638]" required>

      <button id="resetBtn" type="submit"
        class="w-full bg-[#153638] hover:bg-[#1d4a4d] transition text-white py-4 rounded-xl font-semibold shadow-lg disabled:opacity-60">
        Hantar Pautan
      </button>
    </form>

    <div id="msgBox" class="hidden mt-4 p-4 rounded-xl text-sm"></div>

    <div class="mt-6 border-t border-gray-100 pt-4 text-center">
      <a href="login.html" class="text-sm text-gray-500 hover:text-[#153638] hover:underline">← Kembali ke Login</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './firebase.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    auth.languageCode = "ms"; // E-mel Firebase dalam Bahasa Melayu

    const form = document.getElementById("resetForm");
    const btn = document.getElementById("resetBtn");
    const msgBox = document.getElementById("msgBox");

    function papar(teks, jenis) {
      msgBox.className = "mt-4 p-4 rounded-xl text-sm " +
        (jenis === "ok" ? "bg-emerald-50 text-emerald-800 border border-emerald-200"
                        : "bg-red-50 text-red-700 border border-red-200");
      msgBox.textContent = teks;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      btn.disabled = true;
      btn.textContent = "Menghantar...";

      try {
        await sendPasswordResetEmail(auth, email, { url: window.location.origin + "/login.html" });
        papar("Jika e-mel ini berdaftar, pautan tetapan semula telah dihantar. Sila semak peti masuk dan folder Spam.", "ok");
        form.reset();
      } catch (error) {
        console.error(error);
        if (error.code === "auth/user-not-found") {
          // Mesej sama supaya orang luar tak boleh teka e-mel mana yang berdaftar
          papar("Jika e-mel ini berdaftar, pautan tetapan semula telah dihantar. Sila semak peti masuk dan folder Spam.", "ok");
        } else if (error.code === "auth/invalid-email") {
          papar("Format e-mel tidak sah.", "err");
        } else if (error.code === "auth/too-many-requests") {
          papar("Terlalu banyak percubaan. Sila cuba lagi selepas beberapa minit.", "err");
        } else {
          papar("Gagal menghantar pautan. Sila cuba lagi.", "err");
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Hantar Pautan";
      }
    });
  </script>
</body>
</html>
