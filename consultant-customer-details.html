<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen" style="font-family: Inter, sans-serif;">

<!-- HEADER -->
<div class="bg-[#153638] text-white p-5 shadow">
    <h1 class="text-2xl font-bold">Customer Details</h1>
    <p class="text-gray-200">Consultant Client Center</p>
</div>

<!-- CONTENT -->
<div class="p-5">

<a id="backBtn" href="#" class="inline-block mb-5 bg-gray-200 hover:bg-gray-300 transition text-gray-700 px-5 py-3 rounded-xl font-semibold">
    ← Kembali
</a>
  
<div id="customerInfo" class="bg-white rounded-2xl shadow p-6">
    <p class="text-gray-500">Memuatkan data...</p>
</div>

</div>

<script type="module">

// 1. Tarik 'db' dan 'auth' dari fail konfigurasi berpusat
import { db, auth } from './firebase.js';

// 2. Tarik fungsi Firestore yang berkaitan sahaja
import { doc, getDoc, updateDoc, serverTimestamp, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Label status dokumen (Bahasa Melayu)
const LABEL_STATUS = {
  DRAFT: "Draf", DRAFTING: "Draf", UNDER_REVIEW: "Dalam Semakan", PENDING_APPROVAL: "Menunggu Kelulusan",
  PAID: "Telah Dibayar", REJECTED: "Ditolak", APPROVED: "Diluluskan", VERIFIED: "Disahkan Pelanggan",
  PRINTED: "Dicetak", SENT: "Dihantar Kurier", AKAD: "Selesai Akad", STAMPING: "Dalam Pengesahan Mahkamah",
  HANDOVER: "Diserah kepada AQM", RECEIVED: "Selesai (AQM Terima)", COMPLETED: "Selesai"
};
const labelStatus = (s) => LABEL_STATUS[s] || s;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ==========================================
// 1. PENGAWALAN AUTH & ROLE DULU
// ==========================================
onAuthStateChanged(auth, async(user) => {
    if(!user){
        window.location.href = "login.html";
        return;
    }

    // Semak maklumat dari 'consultants' (Untuk kesan AQP)
    const consultantDoc = await getDoc(doc(db, "consultants", user.uid));
    let isAQP = false;
    
    if(consultantDoc.exists()){
        const cData = consultantDoc.data();
        if(cData.consultantLevel === "AQP" || cData.role === "aqp"){
            isAQP = true;
        }
    }

    // Semak dari 'users' (Fall-back pengesahan role)
    const userDoc = await getDoc(doc(db, "users", user.uid));
    const userData = userDoc.exists() ? userDoc.data() : {};

    if(userData.role !== "consultant" && userData.role !== "aqp" && !isAQP){
        alert("Akses ditolak");
        window.location.href = "index.html";
        return;
    }

    // --- TETAPAN BUTANG KEMBALI DINAMIK ---
    const backBtn = document.getElementById("backBtn");
    if(isAQP){
        backBtn.href = "aqp-clients.html";
        backBtn.innerText = "← Kembali ke Senarai Pelanggan (AQP)";
    } else {
        backBtn.href = "consultant-clients.html";
        backBtn.innerText = "← Kembali ke My Clients";
    }

    // Muat data klien menggunakan status role
    await loadCustomerDetails(isAQP);
});


// ==========================================
// 2. FUNGSI PEMUATAN DATA KLIEN & UI
// ==========================================
async function loadCustomerDetails(isAQP) {
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");

    if(!userId) return;

    const docSnap = await getDoc(doc(db,"users",userId));

    if(docSnap.exists()){
        const user = docSnap.data();

        // ======================
        // WASIAT
        // ======================
        const wasiatSnap = await getDoc(doc(db, "users", userId, "wasiat", "maklumat"));
        let wasiatStatus = "BELUM DIISI";
        let wasiatDocRef = "-";
        let wasiatData = {};
        if (wasiatSnap.exists()) {
            wasiatData = wasiatSnap.data();
            wasiatStatus = wasiatData.status || "DRAFT";
            wasiatDocRef = wasiatData.docRef || "-";
        }

        // ======================
        // HIBAH
        // ======================
        const hibahSnap = await getDoc(doc(db, "users", userId, "hibah", "maklumat"));
        let hibahStatus = "BELUM DIISI";
        let hibahDocRef = "-";
        let hibahData = {};
        if (hibahSnap.exists()) {
            hibahData = hibahSnap.data();
            hibahStatus = hibahData.status || "DRAFT";
            hibahDocRef = hibahData.docRef || "-";
        }

        // ======================
        // HARTA SEPENCARIAN
        // ======================
        const sepencarianSnap = await getDoc(doc(db, "users", userId, "sepencarian", "maklumat"));
        let sepencarianStatus = "BELUM DIISI";
        let sepencarianDocRef = "-";
        let sepencarianData = {};
        if (sepencarianSnap.exists()) {
            sepencarianData = sepencarianSnap.data();
            sepencarianStatus = sepencarianData.status || "DRAFT";
            sepencarianDocRef = sepencarianData.docRef || "-";
        }

        // ======================
        // MAWARIS
        // ======================
        const mawarisSnap = await getDoc(doc(db, "users", userId, "mawaris", "maklumat"));
        let mawarisStatus = "BELUM DIISI";
        let mawarisDocRef = "-";
        let mawarisData = {};
        if (mawarisSnap.exists()) {
            mawarisData = mawarisSnap.data();
            mawarisStatus = mawarisData.status || "DRAFT";
            mawarisDocRef = mawarisData.docRef || "-";
        }
        
        // ======================
        // CORPORATE (PREMIUM)
        // ======================
        const corporateSnap = await getDoc(doc(db, "users", userId, "corporate", "maklumat"));
        let corporateStatus = "BELUM DIISI";
        let corporateDocRef = "-";
        let corporateData = {};
        if (corporateSnap.exists()) {
            corporateData = corporateSnap.data();
            corporateStatus = corporateData.status || "DRAFT";
            corporateDocRef = corporateData.docRef || "-";
        }

        // ======================
        // CORPORATE TUNGGAL
        // ======================
        const corporateTunggalSnap = await getDoc(doc(db, "users", userId, "corporate_tunggal", "maklumat"));
        let corporateTunggalStatus = "BELUM DIISI";
        let corporateTunggalDocRef = "-";
        let corporateTunggalData = {};
        if (corporateTunggalSnap.exists()) {
            corporateTunggalData = corporateTunggalSnap.data();
            corporateTunggalStatus = corporateTunggalData.status || "DRAFT";
            corporateTunggalDocRef = corporateTunggalData.docRef || "-";
        }

        // ======================
        // CORPORATE KONGSI
        // ======================
        const corporateKongsiSnap = await getDoc(doc(db, "users", userId, "corporate_kongsi", "maklumat"));
        let corporateKongsiStatus = "BELUM DIISI";
        let corporateKongsiDocRef = "-";
        let corporateKongsiData = {};
        if (corporateKongsiSnap.exists()) {
            corporateKongsiData = corporateKongsiSnap.data();
            corporateKongsiStatus = corporateKongsiData.status || "DRAFT";
            corporateKongsiDocRef = corporateKongsiData.docRef || "-";
        }

        // ======================
        // CORPORATE ZURRI
        // ======================
        const corporateZurriSnap = await getDoc(doc(db, "users", userId, "corporate_zurri", "maklumat"));
        let corporateZurriStatus = "BELUM DIISI";
        let corporateZurriDocRef = "-";
        let corporateZurriData = {};
        if (corporateZurriSnap.exists()) {
            corporateZurriData = corporateZurriSnap.data();
            corporateZurriStatus = corporateZurriData.status || "DRAFT";
            corporateZurriDocRef = corporateZurriData.docRef || "-";
        }

        // KUMPULKAN SEMUA PRODUK
        const products = [
            { name:"Wasiat", snap:wasiatSnap, status:wasiatStatus, docRef:wasiatDocRef, preview:"preview-wasiat.html" },
            { name:"Hibah", snap:hibahSnap, status:hibahStatus, docRef:hibahDocRef, preview:"preview-hibah.html" },
            { name:"Harta Sepencarian", snap:sepencarianSnap, status:sepencarianStatus, docRef:sepencarianDocRef, preview:"preview-sepencarian.html" },
            { name:"Mawaris", snap:mawarisSnap, status:mawarisStatus, docRef:mawarisDocRef, preview:"preview-mawaris.html" },
            { name:"Mawaris Korporat (Premium)", snap:corporateSnap, status:corporateStatus, docRef:corporateDocRef, preview:"preview-corporate.html" },
            { name:"Mawaris Korporat (Tunggal)", snap:corporateTunggalSnap, status:corporateTunggalStatus, docRef:corporateTunggalDocRef, preview:"preview-corporate-tunggal.html" },
            { name:"Mawaris Korporat (Kongsi)", snap:corporateKongsiSnap, status:corporateKongsiStatus, docRef:corporateKongsiDocRef, preview:"preview-corporate-kongsi.html" },
            { name:"Mawaris Korporat (Wakaf Zurri)", snap:corporateZurriSnap, status:corporateZurriStatus, docRef:corporateZurriDocRef, preview:"preview-corporate-zurri.html" }
        ];

        const activeProduct = products.find(product => product.snap.exists());
        const currentStatus = activeProduct ? activeProduct.status : "UNDER_REVIEW";

        const currentCollection = activeProduct
        ? (
            activeProduct.name === "Wasiat" ? "wasiat"
            : activeProduct.name === "Hibah" ? "hibah"
            : activeProduct.name === "Harta Sepencarian" ? "sepencarian"
            : activeProduct.name === "Mawaris Korporat (Premium)" ? "corporate"
            : activeProduct.name === "Mawaris Korporat (Tunggal)" ? "corporate_tunggal"
            : activeProduct.name === "Mawaris Korporat (Kongsi)" ? "corporate_kongsi"
            : activeProduct.name === "Mawaris Korporat (Wakaf Zurri)" ? "corporate_zurri"
            : "mawaris"
        ) : "wasiat";

        const currentData = activeProduct
        ? (
            currentCollection === "wasiat" ? wasiatData
            : currentCollection === "hibah" ? hibahData
            : currentCollection === "sepencarian" ? sepencarianData
            : currentCollection === "corporate" ? corporateData
            : currentCollection === "corporate_tunggal" ? corporateTunggalData
            : currentCollection === "corporate_kongsi" ? corporateKongsiData
            : currentCollection === "corporate_zurri" ? corporateZurriData
            : mawarisData
        ) : {};

        
        // Pengesahan Mahkamah: pilihan & bayaran dibuat oleh pelanggan
        const pmPilihan = currentData.pengesahanMahkamah || "";
        const pmDibayar = currentData.pengesahanStatus === "PAID";
        const firmaSemasa = currentData.firmaGuaman || currentData.stampingRef || "";
        const bolehIsiPeguam = pmDibayar && !currentData.stampingDate;
        const bolehSerah = currentStatus === "STAMPING"
            || (pmPilihan === "TIDAK" && !!currentData.akadDate && !["HANDOVER", "RECEIVED", "COMPLETED"].includes(currentStatus));
        const statusPM = pmPilihan === "TIDAK" ? "Tidak Diperlukan (pilihan pelanggan)"
            : pmDibayar ? (currentData.stampingDate ? "Telah Dibayar • Diserah kepada peguam" : "Telah Dibayar • Sila serah dokumen kepada peguam")
            : pmPilihan === "YA" ? "Menunggu bayaran pelanggan"
            : currentData.stampingDate ? "Rekod lama (Stamping)"
            : "Menunggu pilihan pelanggan (selepas Akad)";

        const rankStatus = { UNDER_REVIEW: 0, PENDING_APPROVAL: 0, PAID: 0, APPROVED: 1, VERIFIED: 2, PRINTED: 3, SENT: 4, AKAD: 5, STAMPING: 6, HANDOVER: 7, RECEIVED: 8, COMPLETED: 8 };
        const workflowSteps = [
        { key:"UNDER_REVIEW", label:"Dalam Semakan" },
        { key:"APPROVED", label:"Diluluskan" },
        { key:"VERIFIED", label:"Disahkan Pelanggan" },
        { key:"PRINTED", label:"Dicetak" },
        { key:"SENT", label:"Dihantar Kurier" },
        { key:"KURIER", label:"Kurier Diterima" },
        { key:"AKAD", label:"Selesai Akad" },
        { key:"STAMPING", label:"Pengesahan Mahkamah" },
        { key:"HANDOVER", label:"Diserah kepada AQM" },
        { key:"COMPLETED", label:"Selesai (AQM Terima)" }
        ];
        function langkahSelesai(key, r) {
            if (key === "KURIER") return !!currentData.kurierDiterimaDate || r >= 5;
            if (key === "STAMPING") return pmPilihan === "TIDAK" || !!currentData.stampingDate;
            const sasaran = { UNDER_REVIEW: 0, APPROVED: 1, VERIFIED: 2, PRINTED: 3, SENT: 4, AKAD: 5, HANDOVER: 7, COMPLETED: 8 }[key];
            return r >= sasaran;
        }

        function renderTimeline(currentStatus){
            const r = rankStatus[currentStatus] ?? -1;
            const timelineDates = {
                UNDER_REVIEW: user.memberSince,
                APPROVED: currentData.approvedAt || "",
                VERIFIED: currentData.verifiedAt || "",
                PRINTED: currentData.printedAt || "",
                SENT: currentData.sentAt || "",
                KURIER: currentData.kurierDiterimaDate || "",
                AKAD: currentData.akadDate || "",
                STAMPING: currentData.stampingDate || "",
                HANDOVER: currentData.handoverDate || "",
                COMPLETED: currentData.receivedDate || ""
            };
            // Tarikh pertama disimpan sebagai rekod; tarikh baru dipapar di sebelahnya
            const fmtT = (t) => t ? new Date(t).toLocaleDateString("ms-MY") : "-";
            const tarikhPertama = { HANDOVER: currentData.serahPertamaDate, COMPLETED: currentData.terimaPertamaDate };
            function tarikhLangkah(key, selesai) {
                if (tarikhPertama[key]) {
                    return `${fmtT(tarikhPertama[key])} (pertama) → ${selesai ? fmtT(timelineDates[key]) : "-"} (selepas pengesahan)`;
                }
                return fmtT(timelineDates[key]);
            }
        
            const catatanLangkah = {
                STAMPING: pmPilihan === "TIDAK" ? "Tidak Diperlukan"
                    : pmDibayar ? "Telah Dibayar" + (firmaSemasa ? " • " + esc(firmaSemasa) : "")
                    : pmPilihan === "YA" ? "Menunggu Bayaran" : ""
            };
            document.getElementById("timelineContainer").innerHTML = workflowSteps.map((step,index)=>{
            const selesai = langkahSelesai(step.key, r);
            return `
            <div class="flex items-center gap-4 mb-4">
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold ${selesai ?"bg-green-600 text-white" :"bg-gray-200 text-gray-500"}">
                    ${selesai?"✓":index+1}
                </div>
                <div>
                    <span class="${selesai ?"font-semibold text-green-700" :"text-gray-500"}">${step.label}</span>
                    <p class="text-xs text-gray-400 mt-1">${tarikhLangkah(step.key, selesai)}</p>
                    ${catatanLangkah[step.key] ? `<p class="text-xs text-gray-500">${catatanLangkah[step.key]}</p>` : ""}
                </div>
            </div>`;}).join("");
        }

        // LOGIK PINTAR: Sembunyikan myIntroducer jika AQP
        const myIntroducerHTML = isAQP ? "" : `
            <div class="mt-5 pt-4 border-t border-gray-100">
                <label class="text-xs text-gray-500 mb-2 font-semibold block">Tetapan myIntroducer (Komisen)</label>
                
                <div class="flex gap-2 items-center">
                    <input type="number" id="introducerPercent" 
                            value="${user.introducerComm || 3}" 
                            min="1" max="100" 
                            class="w-20 border border-gray-300 rounded-xl p-2.5 text-center font-bold text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50" 
                            ${user.isIntroducer ? 'disabled' : ''}> 
                    <span class="text-gray-500 font-bold mr-1">%</span>

                    <button id="btnToggleIntroducer" class="flex-1 ${user.isIntroducer ? 'bg-red-500 hover:bg-red-600' : 'bg-indigo-600 hover:bg-indigo-700'} text-white py-2.5 rounded-xl font-semibold transition text-sm">
                        ${user.isIntroducer ? '✖ Nyahaktifkan' : '🚀 Aktifkan'}
                    </button>
                </div>
                
                <div class="mt-3">
                    <p class="text-[10px] text-gray-400 leading-relaxed italic">
                        *Tetapkan % komisen sebelum mengaktifkan. Jika ingin tukar %, nyahaktifkan dahulu.
                    </p>
                    <div class="bg-red-50 border-l-2 border-red-500 p-2 mt-2 rounded">
                        <p class="text-[10px] text-red-700 leading-tight">
                            <strong>⚠️ PENEGASAN:</strong> Program myIntroducer ini adalah urusan tertutup di antara AQC dan AQM sahaja. Pihak pengurusan (AQMS) <b>tidak terlibat</b> dalam sebarang urusan janji atau tuntutan pembayaran komisen ini. AQC dituntut untuk bersikap jujur, amanah, dan bertanggungjawab.
                        </p>
                    </div>
                </div>
            </div>
        `;

        document.getElementById("customerInfo").innerHTML = `
        <div class="space-y-6">

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">

        <!-- CUSTOMER PROFILE -->
        <div class="bg-white rounded-2xl shadow p-5 h-full flex flex-col">
            <h2 class="text-3xl font-bold text-[#153638]">${user.nama || "-"}</h2>
            <p class="text-gray-500 mb-5">${user.email || "-"}</p>

            <div class="space-y-3 text-sm flex-grow">
                <div class="flex justify-between">
                    <span class="text-gray-500">No Ahli</span>
                    <span id="memberNo"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Ahli Sejak</span>
                    <span id="memberSince"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Telefon</span>
                    <span id="telefon"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Referral</span>
                    <span id="referral"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Status</span>
                    <span id="memberStatus"></span>
                </div>
            </div>

            <!-- BUTANG MYINTRODUCER (DINAMIK) -->
            ${myIntroducerHTML}
        </div>

        <!-- TIMELINE -->
        <div id="timelineCard" class="bg-white rounded-2xl shadow p-5 h-full">
            <h3 class="font-bold mb-5">Status Timeline</h3>
            <div id="timelineContainer"></div>
        </div>

        </div> <!-- PENUTUP GRID ATAS -->

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-4">

        ${products.filter(product => product.snap.exists()).map(product => `
        <div class="bg-green-50 border border-green-200 rounded-xl p-5 flex flex-col h-full">
            <div>
                <h3 class="font-bold text-green-700 text-lg">${product.name}</h3>
                <p class="text-sm mt-4">No Dokumen : <strong>${product.docRef}</strong></p>
                <p class="text-sm mt-1">Status : <strong>${labelStatus(product.status)}</strong></p>
            </div>
            <div class="mt-auto pt-5">
                <a href="${product.preview}?uid=${userId}" target="_blank" class="block w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold">
                👁 View Dokumen
                </a>
            </div>
        </div>
        `).join("")}

        <div class="bg-white border rounded-xl p-5 flex flex-col h-full">
            <h3 class="font-bold text-blue-700">Selesai Akad</h3>
            <label>Tarikh</label>
            <input type="date" id="akadDate" value="${currentData.akadDate || ""}" class="w-full border rounded-lg p-2 mt-2 mb-3">
            <label class="mt-3 block">Masa</label>
            <input type="time" id="akadTime" value="${currentData.akadTime || ""}" class="w-full border rounded-lg p-2 mt-1">
            <div class="mt-auto pt-5">
                <button id="saveAkad" ${currentData.akadDate ? "disabled" : ""} class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg disabled:bg-gray-400">Simpan</button>
            </div>
        </div>

        <div class="bg-white border rounded-xl p-5 flex flex-col h-full ${pmPilihan === "TIDAK" ? "opacity-60 bg-gray-50" : ""}">
            <h3 class="font-bold text-orange-700">Pengesahan Mahkamah</h3>
            <p class="text-xs font-semibold mt-1 mb-3 ${pmDibayar ? "text-green-700" : "text-gray-500"}">${statusPM}</p>
            <label class="text-sm">Tarikh Serah Peguam</label>
            <input type="date" id="stampDate" value="${esc(currentData.stampingDate || "")}" ${bolehIsiPeguam ? "" : "disabled"} class="w-full border rounded-lg p-2 mt-1 mb-3 disabled:bg-gray-100">
            <label class="text-sm">Nama Firma Guaman</label>
            <input id="firmaGuaman" value="${esc(firmaSemasa)}" ${bolehIsiPeguam ? "" : "disabled"} placeholder="Contoh: Tetuan Ahmad & Rakan" class="w-full border rounded-lg p-2 mt-1 disabled:bg-gray-100">
            <div class="mt-auto pt-5">
                <button id="saveStamping" ${bolehIsiPeguam ? "" : "disabled"} class="w-full mt-4 bg-orange-600 text-white py-2 rounded-lg disabled:bg-gray-400">Simpan</button>
            </div>
        </div>

        <div class="bg-white border rounded-xl p-5 flex flex-col h-full">
            <h3 class="font-bold text-green-700">Serah kepada AQM</h3>
            ${!bolehSerah && !["HANDOVER", "RECEIVED", "COMPLETED"].includes(currentStatus) ? `<p class="text-xs text-gray-500 mt-1">Boleh diserah selepas Akad dan pengesahan mahkamah selesai (atau pelanggan pilih "Tidak").</p>` : ""}
            <input type="date" id="completeDate" value="${bolehSerah ? "" : esc(currentData.handoverDate || "")}" ${bolehSerah ? "" : "disabled"} class="w-full border rounded-lg p-2 mt-2 mb-3 disabled:bg-gray-100">
            <textarea id="completeRemarks" ${bolehSerah ? "" : "disabled"} class="w-full border rounded-lg p-2 mt-3 mb-3 disabled:bg-gray-100" placeholder="Catatan">${bolehSerah ? "" : esc(currentData.handoverRemarks || "")}</textarea>
            <div class="mt-auto pt-5">
                <button id="saveComplete" ${bolehSerah ? "" : "disabled"} class="w-full mt-4 bg-green-700 text-white py-2 rounded-lg disabled:bg-gray-400">Serah</button>
            </div>  
        </div>

        </div>
        </div>
        `;

        
        document.getElementById("memberNo").innerHTML = user.memberNo || "-";
        document.getElementById("memberSince").innerHTML = user.memberSince ? new Date(user.memberSince).toLocaleDateString("ms-MY") : "-";
        document.getElementById("referral").innerHTML = user.referral || "-";
        document.getElementById("telefon").innerHTML = user.telefon || "-";
        
        // Semakan untuk SEMUA jenis Produk
        document.getElementById("memberStatus").innerHTML = (
            user.paymentStatus === "paid" ||
            user.wasiatPaymentStatus === "paid" ||
            user.hibahPaymentStatus === "paid" ||
            user.sepencarianPaymentStatus === "paid" ||
            user.mawarisPaymentStatus === "paid" ||
            user.corporatePaymentStatus === "paid" ||
            user.corporateTunggalPaymentStatus === "paid" ||
            user.corporateKongsiPaymentStatus === "paid" ||
            user.corporateZurriPaymentStatus === "paid" 
        ) ? "AHLI AKTIF" : "PROSPEK";

        renderTimeline(currentStatus);

        // ==========================================
        // FUNGSI AKTIFKAN MYINTRODUCER (JIKA BUKAN AQP)
        // ==========================================
        if (!isAQP) {
            const btnToggleIntroducer = document.getElementById("btnToggleIntroducer");
            if (btnToggleIntroducer) {
                btnToggleIntroducer.onclick = async () => {
                    try {
                        const isCurrentlyIntroducer = user.isIntroducer || false;
                        const percentVal = document.getElementById("introducerPercent").value || 3; 

                        const confirmMsg = isCurrentlyIntroducer
                            ? "Adakah anda pasti mahu nyahaktifkan fungsi myIntroducer untuk klien ini?"
                            : `Anda pasti mahu aktifkan fungsi myIntroducer dengan komisen sebanyak ${percentVal}%?`;

                        if (confirm(confirmMsg)) {
                            btnToggleIntroducer.innerText = "Memproses...";
                            btnToggleIntroducer.disabled = true;

                            await updateDoc(doc(db, "users", userId), {
                                isIntroducer: !isCurrentlyIntroducer,
                                introducerComm: Number(percentVal)
                            });

                            alert("Berjaya! Status myIntroducer telah dikemaskini.");
                            location.reload();
                        }
                    } catch (error) {
                        console.error("Ralat MyIntroducer:", error);
                        alert("Gagal mengemaskini: " + error.message);
                        btnToggleIntroducer.innerText = "Cuba Lagi";
                        btnToggleIntroducer.disabled = false;
                    }
                };
            }
        }
        
        document.getElementById("saveAkad").onclick = async()=>{
            const akadDate = document.getElementById("akadDate").value;
            const akadTime = document.getElementById("akadTime").value;

            if(!akadDate || !akadTime){
                alert("Sila pilih tarikh dan masa.");
                return;
            }

            try {
                await updateDoc(doc(db,"users",userId,currentCollection,"maklumat"), {
                    akadDate,
                    akadTime,
                    status:"AKAD",
                    akadUpdatedAt:serverTimestamp()
                });
                alert("Tarikh akad berjaya disimpan.");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Gagal menyimpan akad: " + e.message);
            }
        };
        
        document.getElementById("saveStamping").onclick = async()=>{
            const stampDate = document.getElementById("stampDate").value;
            const firma = document.getElementById("firmaGuaman").value.trim();

            if(!stampDate || !firma){
                alert("Sila isi tarikh serah dan nama firma guaman.");
                return;
            }

            // Dokumen pernah diserah & diterima sebelum ini: simpan tarikh pertama sebagai rekod
            const rekodPertama = (currentData.handoverDate && !currentData.serahPertamaDate)
                ? { serahPertamaDate: currentData.handoverDate, terimaPertamaDate: currentData.receivedDate || "" }
                : {};

            try {
                await updateDoc(doc(db,"users",userId,currentCollection,"maklumat"), {
                    stampingDate:stampDate,
                    firmaGuaman:firma,
                    status:"STAMPING",
                    stampingUpdatedAt:serverTimestamp(),
                    ...rekodPertama
                });
                alert("Penyerahan dokumen kepada peguam berjaya direkodkan.");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Gagal menyimpan: " + e.message);
            }
        };

        document.getElementById("saveComplete").onclick = async()=>{
            const completeDate = document.getElementById("completeDate").value;
            const remarks = document.getElementById("completeRemarks").value;

            if(!completeDate){
                alert("Sila pilih tarikh.");
                return;
            }

            try {
                await updateDoc(doc(db,"users",userId,currentCollection,"maklumat"), {
                    handoverDate:completeDate,
                    handoverRemarks:remarks,
                    status:"HANDOVER",
                    handoverUpdatedAt:serverTimestamp()
                });
                alert("Dokumen telah diserahkan kepada AQM.");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Gagal menyimpan: " + e.message);
            }
        };
        
    } 
}
  
</script>

</body>
</html>
