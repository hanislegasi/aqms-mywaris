<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Customer Details
</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body
class="bg-gray-100 min-h-screen"
style="font-family: Inter, sans-serif;">

<!-- HEADER -->
<div class="bg-[#153638] text-white p-5 shadow">

<h1 class="text-2xl font-bold">
Customer Details
</h1>

<p class="text-gray-200">
Consultant Client Center
</p>

</div>

<!-- CONTENT -->
<div class="p-5">

<a
href="consultant-clients.html"
class="inline-block mb-5 bg-gray-200 hover:bg-gray-300 transition text-gray-700 px-5 py-3 rounded-xl font-semibold">

← Kembali ke My Clients

</a>
  
<div
id="customerInfo"
class="bg-white rounded-2xl shadow p-6">

<p class="text-gray-500">
Memuatkan data...
</p>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:
"AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",

authDomain:
"alqawthar-mywaris.firebaseapp.com",

projectId:
"alqawthar-mywaris",

storageBucket:
"alqawthar-mywaris.firebasestorage.app",

messagingSenderId:
"3498810778",

appId:
"1:3498810778:web:ee36e0fe42f76698046e23"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    window.location.href =
    "login.html";

    return;

  }

  const userDoc =
  await getDoc(
    doc(
      db,
      "users",
      user.uid
    )
  );

  const userData =
  userDoc.data();

   if(userData.role !== "consultant"){

    alert(
      "Akses ditolak"
    );

    window.location.href =
    "index.html";

  }

});

// GET ID
const params =
new URLSearchParams(
window.location.search
);

const userId =
params.get("id");

// LOAD USER
const docSnap =
await getDoc(
doc(db,"users",userId)
);

if(docSnap.exists()){

const user =
docSnap.data();

// ======================
// WASIAT
// ======================

const wasiatSnap = await getDoc(
    doc(db, "users", userId, "wasiat", "maklumat")
);

let wasiatStatus = "BELUM DIISI";
let wasiatDocRef = "-";
let wasiatApprovedDate = "-";
let wasiatExpiryDate = "-";
let wasiatBakiHari = 0;

if (wasiatSnap.exists()) {

    const wasiatData = wasiatSnap.data();

    wasiatStatus = wasiatData.status || "DRAFT";
    wasiatDocRef = wasiatData.docRef || "-";

    wasiatApprovedDate = wasiatData.approvedAt
        ? new Date(wasiatData.approvedAt).toLocaleDateString("ms-MY")
        : "-";

    wasiatExpiryDate = wasiatData.expiryDate
        ? new Date(wasiatData.expiryDate).toLocaleDateString("ms-MY")
        : "-";

    wasiatBakiHari = wasiatData.expiryDate
        ? Math.ceil(
            (new Date(wasiatData.expiryDate) - new Date())
            / (1000 * 60 * 60 * 24)
        )
        : 0;

}


// ======================
// HIBAH
// ======================

const hibahSnap = await getDoc(
    doc(db, "users", userId, "hibah", "maklumat")
);

let hibahStatus = "BELUM DIISI";
let hibahDocRef = "-";
let hibahApprovedDate = "-";
let hibahExpiryDate = "-";
let hibahBakiHari = 0;

if (hibahSnap.exists()) {

    const hibahData = hibahSnap.data();

    hibahStatus = hibahData.status || "DRAFT";
    hibahDocRef = hibahData.docRef || "-";

    hibahApprovedDate = hibahData.approvedAt
        ? new Date(hibahData.approvedAt).toLocaleDateString("ms-MY")
        : "-";

    hibahExpiryDate = hibahData.expiryDate
        ? new Date(hibahData.expiryDate).toLocaleDateString("ms-MY")
        : "-";

    hibahBakiHari = hibahData.expiryDate
        ? Math.ceil(
            (new Date(hibahData.expiryDate) - new Date())
            / (1000 * 60 * 60 * 24)
        )
        : 0;

}


// ======================
// HARTA SEPENCARIAN
// ======================

const sepencarianSnap = await getDoc(
    doc(db, "users", userId, "sepencarian", "maklumat")
);

let sepencarianStatus = "BELUM DIISI";
let sepencarianDocRef = "-";
let sepencarianApprovedDate = "-";
let sepencarianExpiryDate = "-";
let sepencarianBakiHari = 0;

if (sepencarianSnap.exists()) {

    const sepencarianData = sepencarianSnap.data();

    sepencarianStatus = sepencarianData.status || "DRAFT";
    sepencarianDocRef = sepencarianData.docRef || "-";

    sepencarianApprovedDate = sepencarianData.approvedAt
        ? new Date(sepencarianData.approvedAt).toLocaleDateString("ms-MY")
        : "-";

    sepencarianExpiryDate = sepencarianData.expiryDate
        ? new Date(sepencarianData.expiryDate).toLocaleDateString("ms-MY")
        : "-";

    sepencarianBakiHari = sepencarianData.expiryDate
        ? Math.ceil(
            (new Date(sepencarianData.expiryDate) - new Date())
            / (1000 * 60 * 60 * 24)
        )
        : 0;

}


// ======================
// MAWARIS
// ======================

const mawarisSnap = await getDoc(
    doc(db, "users", userId, "mawaris", "maklumat")
);

let mawarisStatus = "BELUM DIISI";
let mawarisDocRef = "-";
let mawarisApprovedDate = "-";
let mawarisExpiryDate = "-";
let mawarisBakiHari = 0;

if (mawarisSnap.exists()) {

    const mawarisData = mawarisSnap.data();

    mawarisStatus = mawarisData.status || "DRAFT";
    mawarisDocRef = mawarisData.docRef || "-";

    mawarisApprovedDate = mawarisData.approvedAt
        ? new Date(mawarisData.approvedAt).toLocaleDateString("ms-MY")
        : "-";

    mawarisExpiryDate = mawarisData.expiryDate
        ? new Date(mawarisData.expiryDate).toLocaleDateString("ms-MY")
        : "-";

    mawarisBakiHari = mawarisData.expiryDate
        ? Math.ceil(
            (new Date(mawarisData.expiryDate) - new Date())
            / (1000 * 60 * 60 * 24)
        )
        : 0;

}
  

const products = [

{
name:"Wasiat",
snap:wasiatSnap,
status:wasiatStatus,
docRef:wasiatDocRef,
preview:"preview-wasiat.html"
},

{
name:"Hibah",
snap:hibahSnap,
status:hibahStatus,
docRef:"hibahDocRef",
preview:"preview-hibah.html"
},

{
name:"Harta Sepencarian",
snap:sepencarianSnap,
status:sepencarianStatus,
docRef:"sepencarianDocRef",
preview:"preview-sepencarian.html"
},

{
name:"Mawaris",
snap:mawarisSnap,
status:mawarisStatus,
docRef:"mawarisDocRef",
preview:"preview-mawaris.html"
}

];

const workflowSteps = [
  { key:"UNDER_REVIEW", label:"Under Review" },
  { key:"APPROVED", label:"Approved" },
  { key:"VERIFIED", label:"Verified" },
  { key:"PRINTED", label:"Printed" },
  { key:"SENT", label:"Sent" },
  { key:"AKAD_SCHEDULED", label:"Akad Scheduled" },
  { key:"AKAD_COMPLETED", label:"Akad Completed" },
  { key:"STAMPING", label:"Stamping" },
  { key:"COMPLETED", label:"Completed" }
];

function renderTimeline(currentStatus){

    const currentIndex =
    workflowSteps.findIndex(
        s => s.key === currentStatus
    );

    document.getElementById("timelineContainer").innerHTML =
    workflowSteps.map((step,index)=>`

    <div class="flex items-center gap-4 mb-4">

        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold
        ${index<=currentIndex
        ?"bg-green-600 text-white"
        :"bg-gray-200 text-gray-500"}">

        ${index<=currentIndex?"✓":index+1}

        </div>

        <span class="${
            index<=currentIndex
            ?"font-semibold text-green-700"
            :"text-gray-500"
        }">

        ${step.label}

        </span>

    </div>

    `).join("");

}

document.getElementById(
"customerInfo"
).innerHTML = `
  
<div class="space-y-6">

<div class="grid grid-cols-1 xl:grid-cols-3 gap-5">

<!-- CUSTOMER PROFILE -->
<div class="bg-white rounded-2xl shadow p-5 h-full">

    <h2 class="text-3xl font-bold text-[#153638]">
        ${user.nama || "-"}
    </h2>

    <p class="text-gray-500 mb-5">
        ${user.email || "-"}
    </p>

    <div class="space-y-3 text-sm">

        <div class="flex justify-between">
            <span class="text-gray-500">No Ahli</span>
            <span id="memberNo"></span>
        </div>
        
        <div class="flex justify-between">
            <span class="text-gray-500">Ahli Sejak</span>
            <span id="memberSince"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Telefon</span>
            <span id="telefon"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Referral</span>
            <span id="referral"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Status</span>
            <span id="memberStatus"></span>
        </div>

    </div>

</div>

<!-- NOTIFICATION -->
<div
id="notificationCard"
class="lg:col-span-1 h-full bg-amber-50 border border-amber-200 rounded-2xl p-5">

<h3 class="font-bold text-amber-700 mb-3">

🔔 Notification

</h3>

<div
id="notificationList"
class="space-y-2 text-sm text-gray-700">

<p class="text-gray-400">
Tiada notification.
</p>

</div>

</div>

<!-- TIMELINE -->
<div
id="timelineCard"
class="lg:col-span-1 bg-white rounded-2xl shadow p-5 h-full">

<h3 class="font-bold mb-5">

Status Timeline

</h3>

<div
id="timelineContainer">

</div>

</div>

</div> <!-- PENUTUP GRID ATAS -->

<div class="grid grid-cols-1 xl:grid-cols-4 gap-4">

${products
.filter(product => product.snap.exists())
.map(product => `

<div class="bg-green-50 border border-green-200 rounded-xl p-5 flex flex-col h-full">

    <div>

        <h3 class="font-bold text-green-700 text-lg">
            ${product.name}
        </h3>

        <p class="text-sm mt-4">
            No Dokumen :
            <strong>${product.docRef}</strong>
        </p>

        <p class="text-sm mt-1">
            Status :
            <strong>${product.status}</strong>
        </p>

    </div>

    <div class="mt-auto pt-5">

        <a
        href="${product.preview}?uid=${userId}"
        target="_blank"
        class="block w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold">

        👁 View Dokumen

        </a>

    </div>

</div>

`).join("")}


<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-blue-700">
🗓 Akad
</h3>

<label>Tarikh</label>

<input
type="date"
id="akadDate"
class="w-full border rounded-lg p-2 mt-2 mb-3">

<label class="mt-3 block">Masa</label>

<input
type="time"
id="akadTime"
class="w-full border rounded-lg p-2 mt-1">

<div class="mt-auto pt-5">

<button
id="saveAkad"
class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg">

Simpan

</button>

</div>

</div>

<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-orange-700">

📑 Stamping

</h3>

<input
type="date"
id="stampDate"
class="w-full border rounded-lg p-2 mt-2 mb-3">

<input
placeholder="No Rujukan"
class="w-full border rounded-lg p-2 mt-3">

<div class="mt-auto pt-5">

<button
class="w-full mt-4 bg-orange-600 text-white py-2 rounded-lg">

Update

</button>

</div>

</div>

<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-green-700">

🏁 Complete

</h3>

<input
type="date"
id="completeDate"
class="w-full border rounded-lg p-2 mt-2 mb-3">

<textarea
class="w-full border rounded-lg p-2 mt-3 mb-3"
placeholder="Remarks"></textarea>

<div class="mt-auto pt-5">

<button
class="w-full mt-4 bg-green-700 text-white py-2 rounded-lg">

Complete

</button>

</div>  

</div>

</div>

</div>

`;

  
document.getElementById(
"memberNo"
).innerHTML =
user.memberNo || "-";

document.getElementById(
"memberSince"
).innerHTML =
user.memberSince
? new Date(
user.memberSince
).toLocaleDateString("ms-MY")
: "-";

document.getElementById(
"referral"
).innerHTML =
user.referral || "-";

document.getElementById("telefon").innerHTML =
user.telefon || "-";
  
document.getElementById("memberStatus").innerHTML =
(
user.paymentStatus === "paid" ||
user.wasiatPaymentStatus === "paid" ||
user.hibahPaymentStatus === "paid" ||
user.sepencarianPaymentStatus === "paid" ||
user.mawarisPaymentStatus === "paid"
)
? "AHLI AKTIF"
: "PROSPEK";

renderTimeline(wasiatStatus);
  
}


</script>

</body>
</html>
