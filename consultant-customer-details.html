<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Customer Details
</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body
class="bg-gray-100 min-h-screen"
style="font-family: Inter, sans-serif;">

<!-- HEADER -->
<div class="bg-[#153638] text-white p-5 shadow">

<h1 class="text-2xl font-bold">
Customer Details
</h1>

<p class="text-gray-200">
Consultant Client Center
</p>

</div>

<!-- CONTENT -->
<div class="p-5">

<a
href="consultant-clients.html"
class="inline-block mb-5 bg-gray-200 hover:bg-gray-300 transition text-gray-700 px-5 py-3 rounded-xl font-semibold">

← Kembali ke My Clients

</a>
  
<div
id="customerInfo"
class="bg-white rounded-2xl shadow p-6">

<p class="text-gray-500">
Memuatkan data...
</p>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey:
"AIzaSyCR3hpOyMowg4yLMxBw3Iu3QkepGvSE0MU",

authDomain:
"alqawthar-mywaris.firebaseapp.com",

projectId:
"alqawthar-mywaris",

storageBucket:
"alqawthar-mywaris.firebasestorage.app",

messagingSenderId:
"3498810778",

appId:
"1:3498810778:web:ee36e0fe42f76698046e23"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    window.location.href =
    "login.html";

    return;

  }

  const userDoc =
  await getDoc(
    doc(
      db,
      "users",
      user.uid
    )
  );

  const userData =
  userDoc.data();

   if(userData.role !== "consultant"){

    alert(
      "Akses ditolak"
    );

    window.location.href =
    "index.html";

  }

});

// GET ID
const params =
new URLSearchParams(
window.location.search
);

const userId =
params.get("id");

// LOAD USER
const docSnap =
await getDoc(
doc(db,"users",userId)
);

if(docSnap.exists()){

const user =
docSnap.data();

// WASIAT STATUS
const wasiatSnap =
await getDoc(
doc(
db,
"users",
userId,
"wasiat",
"maklumat"
)
);

let wasiatStatus =
"BELUM DIISI";

let docRef = "-";
let approvedDate = "-";
let expiryDate = "-";
let bakiHari = 0;
if(wasiatSnap.exists()){

const wasiatData =
wasiatSnap.data();

wasiatStatus =
wasiatData.status ||
"DRAFT";

docRef =
wasiatData.docRef || "-";

approvedDate =
wasiatData.approvedAt
? new Date(
wasiatData.approvedAt
).toLocaleDateString("ms-MY")
: "-";

expiryDate =
wasiatData.expiryDate
? new Date(
wasiatData.expiryDate
).toLocaleDateString("ms-MY")
: "-";

bakiHari =
expiryDate !== "-"
? Math.ceil(
(
new Date(wasiatData.expiryDate)
- new Date()
)
/
(1000*60*60*24)
)
: 0;
  
}

// HIBAH STATUS
const hibahSnap =
await getDoc(
doc(
db,
"users",
userId,
"hibah",
"maklumat"
)
);

let hibahStatus =
"BELUM DIISI";

if(hibahSnap.exists()){

const hibahData =
hibahSnap.data();

hibahStatus =
hibahData.status ||
"DRAFT";

}

// SEPENCARIAN STATUS
const sepencarianSnap =
await getDoc(
doc(
db,
"users",
userId,
"sepencarian",
"maklumat"
)
);

let sepencarianStatus =
"BELUM DIISI";

if(sepencarianSnap.exists()){

const sepencarianData =
sepencarianSnap.data();

sepencarianStatus =
sepencarianData.status ||
"DRAFT";

}

// MAWARIS STATUS
const mawarisSnap =
await getDoc(
doc(
db,
"users",
userId,
"mawaris",
"maklumat"
)
);

let mawarisStatus =
"BELUM DIISI";

if(mawarisSnap.exists()){

const mawarisData =
mawarisSnap.data();

mawarisStatus =
mawarisData.status ||
"DRAFT";

}
  


const products = [

{
name:"Wasiat",
snap:wasiatSnap,
status:wasiatStatus,
docRef:docRef,
preview:"preview-wasiat.html"
},

{
name:"Hibah",
snap:hibahSnap,
status:hibahStatus,
docRef:"-",
preview:"preview-hibah.html"
},

{
name:"Harta Sepencarian",
snap:sepencarianSnap,
status:sepencarianStatus,
docRef:"-",
preview:"preview-sepencarian.html"
},

{
name:"Mawaris",
snap:mawarisSnap,
status:mawarisStatus,
docRef:"-",
preview:"preview-mawaris.html"
}

];

const workflowSteps = [
  { key:"UNDER_REVIEW", label:"Under Review" },
  { key:"APPROVED", label:"Approved" },
  { key:"VERIFIED", label:"Verified" },
  { key:"PRINTED", label:"Printed" },
  { key:"SENT", label:"Sent" },
  { key:"AKAD_SCHEDULED", label:"Akad Scheduled" },
  { key:"AKAD_COMPLETED", label:"Akad Completed" },
  { key:"STAMPING", label:"Stamping" },
  { key:"COMPLETED", label:"Completed" }
];

function renderTimeline(currentStatus){

    const currentIndex =
    workflowSteps.findIndex(
        s => s.key === currentStatus
    );

    document.getElementById("timelineContainer").innerHTML =
    workflowSteps.map((step,index)=>`

    <div class="flex items-center gap-4 mb-4">

        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold
        ${index<=currentIndex
        ?"bg-green-600 text-white"
        :"bg-gray-200 text-gray-500"}">

        ${index<=currentIndex?"✓":index+1}

        </div>

        <span class="${
            index<=currentIndex
            ?"font-semibold text-green-700"
            :"text-gray-500"
        }">

        ${step.label}

        </span>

    </div>

    `).join("");

}
document.getElementById(
"customerInfo"
).innerHTML = `
  
<div class="space-y-6">

<div class="grid grid-cols-1 xl:grid-cols-3 gap-5">

<!-- CUSTOMER PROFILE -->
<div class="bg-white rounded-2xl shadow p-5 h-full">

    <h2 class="text-3xl font-bold text-[#153638]">
        ${user.nama || "-"}
    </h2>

    <p class="text-gray-500 mb-5">
        ${user.email || "-"}
    </p>

    <div class="space-y-3 text-sm">

        <div class="flex justify-between">
            <span class="text-gray-500">No Ahli</span>
            <span id="memberNo"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Telefon</span>
            <span id="telefon"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Referral</span>
            <span id="referral"></span>
        </div>

        <div class="flex justify-between">
            <span class="text-gray-500">Status</span>
            <span id="memberStatus"></span>
        </div>

    </div>

</div>

<!-- NOTIFICATION -->
<div
id="notificationCard"
class="lg:col-span-1 h-full bg-amber-50 border border-amber-200 rounded-2xl p-5"

<h3 class="font-bold text-amber-700 mb-3">

🔔 Notification

</h3>

<div
id="notificationList"
class="space-y-2 text-sm text-gray-700">

<p class="text-gray-400">
Tiada notification.
</p>

</div>

</div>

<!-- TIMELINE -->
<div
id="timelineCard"
class="lg:col-span-1 bg-white rounded-2xl shadow p-5 h-full">

<h3 class="font-bold mb-5">

Status Timeline

</h3>

<div
id="timelineContainer">

</div>

</div>

<div>

<div class="grid grid-cols-1 xl:grid-cols-4 gap-4">

${
wasiatSnap.exists()
?
`
<div class="bg-green-50 border border-green-200 rounded-xl p-5 flex flex-col h-full">

<div>

<h3 class="font-bold text-green-700 text-lg">
Wasiat
</h3>

<p class="text-sm mt-4">
No Dokumen :
<strong>${docRef}</strong>
</p>

<p class="text-sm mt-1">
Status :
<strong>${wasiatStatus}</strong>
</p>

</div>

<div class="mt-auto pt-5">

<a
href="preview-wasiat.html?uid=${userId}"
target="_blank"
class="block w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold transition">

👁 View Dokumen

</a>

</div>

</div>
`
:
""
}

${
hibahSnap.exists()
?
`
class="bg-blue-50 border border-blue-200 rounded-xl p-5 flex flex-col h-full"

<div>

<h3 class="font-bold text-blue-700 text-lg">
Hibah
</h3>

<p class="text-sm mt-4">
Status :
<strong>${hibahStatus}</strong>
</p>

</div>

<div class="mt-auto pt-5">

<a
href="preview-hibah.html?uid=${userId}"
target="_blank"
class="block w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold transition">
👁 View Dokumen

</a>

</div>

</div>
`
:
""
}

${
sepencarianSnap.exists()
?
`
class="bg-blue-50 border border-blue-200 rounded-xl p-5 flex flex-col h-full"

<div>

<h3 class="font-bold text-blue-700 text-lg">
Harta Sepencarian
</h3>

<p class="text-sm mt-4">
Status :
<strong>${sepencarianStatus}</strong>
</p>

</div>

<div class="mt-auto pt-5">

<a
href="preview-sepencarian.html?uid=${userId}"
target="_blank"
class="block w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold transition">

👁 View Dokumen

</a>

</div>

</div>
`
:
""
}

${
mawarisSnap.exists()
?
`
class="bg-blue-50 border border-blue-200 rounded-xl p-5 flex flex-col h-full"

<div>

<h3 class="font-bold text-blue-700 text-lg">
Mawaris
</h3>

<p class="text-sm mt-4">
Status :
<strong>${mawarisStatus}</strong>
</p>

</div>

<div class="mt-auto pt-5">

<a
href="preview-mawaris.html?uid=${userId}"
target="_blank"
class="mt-5 w-full bg-[#153638] hover:bg-[#1d4a4d] text-white text-center py-3 rounded-xl font-semibold transition">

👁 View Dokumen

</a>

</div>

</div>
`
:
""
}



<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-blue-700">
🗓 Akad
</h3>

<label>Tarikh</label>

<input
type="date"
id="akadDate"
class="w-full border rounded-lg p-2 mt-2 mb-3"

<label class="mt-3 block">Masa</label>

<input
type="time"
id="akadTime"
class="w-full border rounded-lg p-2 mt-1">

<div class="mt-auto pt-5">

<button
id="saveAkad"
class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg">

Simpan

</button>

</div>

</div>

<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-orange-700">

📑 Stamping

</h3>

<input
type="date"
id="stampDate"
class="w-full border rounded-lg p-2 mt-2 mb-3"

<input
placeholder="No Rujukan"
class="w-full border rounded-lg p-2 mt-3">

<div class="mt-auto pt-5">

<button
class="w-full mt-4 bg-orange-600 text-white py-2 rounded-lg">

Update

</button>

</div>

</div>

<div class="bg-white border rounded-xl p-5 flex flex-col h-full">

<h3 class="font-bold text-green-700">

🏁 Complete

</h3>

<input
type="date"
id="completeDate"
class="w-full border rounded-lg p-2 mt-2 mb-3"

<textarea
class="w-full border rounded-lg p-2 mt-3 mb-3"
placeholder="Remarks"></textarea>

<div class="mt-auto pt-5">

<button
class="w-full mt-4 bg-green-700 text-white py-2 rounded-lg">

Complete

</button>

</div>  

</div>

</div>

`;

  
document.getElementById(
"memberNo"
).innerHTML =
user.memberNo || "-";

document.getElementById(
"memberSince"
).innerHTML =
user.memberSince
? new Date(
user.memberSince
).toLocaleDateString("ms-MY")
: "-";

document.getElementById(
"referral"
).innerHTML =
user.referral || "-";

document.getElementById("telefon").innerHTML =
user.telefon || "-";
  
document.getElementById("memberStatus").innerHTML =
(
user.paymentStatus === "paid" ||
user.wasiatPaymentStatus === "paid" ||
user.hibahPaymentStatus === "paid" ||
user.sepencarianPaymentStatus === "paid" ||
user.mawarisPaymentStatus === "paid"
)
? "AHLI AKTIF"
: "PROSPEK";

renderTimeline(wasiatStatus);
  
}


</script>

</body>
</html>
